    }

      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;

    }

    .font-reader-sans { font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif; }
    .font-reader-serif { font-family: 'Noto Serif TC', Georgia, 'Times New Roman', serif; }
    .font-reader-mono { font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ADHD 呼吸定位高亮動畫 */
    @keyframes pulseFocusRing {
      0% { box-shadow: 0 0 0 0 rgba(94, 122, 148, 0.65); }
      50% { box-shadow: 0 0 0 7px rgba(94, 122, 148, 0.26); }
      100% { box-shadow: 0 0 0 0 rgba(94, 122, 148, 0); }
    }
    .pulse-target {
      animation: pulseFocusRing 0.85s ease-out 2;
    }

    /* 螢幕上隱藏專屬列印層 */
    #print-clean-layer {
      display: none;
    }

    /* =========================================================================
       專屬純文字 PDF 完整多頁列印樣式（無外框、無變暗、不截斷）
       ========================================================================= */
    @media print {
      @page {
        size: A4;
        margin: 18mm 16mm;
      }
      html, body, #root {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #111827 !important;
      }
      #screen-app-shell, .no-print {
        display: none !important;
      }
      #print-clean-layer {
        display: block !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #111827 !important;
      }

        break-inside: auto;
        margin-bottom: 1.5rem;
      }
      .print-heading {
        break-after: avoid;
      }
      .print-note-box {
        break-inside: avoid;

        print-color-adjust: exact;
      }
      mark {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

    /* 順手感：游標、焦點框、深色原生元件、減少動態 */
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {

        for (let registration of registrations) {
          registration.unregister();
        }

    // =========================================================================
    // 2. 本機 IndexedDB 與持久保存儲存引擎
    // =========================================================================
    const IDB_NAME = 'ADHDFocusReader_v3_Ultimate';
    const IDB_VERSION = 1;

    async function requestStoragePersistence() {
      if (navigator.storage && navigator.storage.persist) {
        try { return await navigator.storage.persist(); } catch { return false; }
      }
      return false;
    }

    function openReaderDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('瀏覽器不支援 IndexedDB'));
          return;
        }
        const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('documents')) {
            db.createObjectStore('documents', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('kv')) {
            db.createObjectStore('kv', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGetKV(key, fallback = null) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readonly');
          const req = tx.objectStore('kv').get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : fallback);
          req.onerror = () => resolve(fallback);
        });
      } catch {
        return fallback;
      }
    }

    async function idbSetKV(key, value) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbGetScopedKV(uid, key, fallback = null) {
      const val = await idbGetKV(`${uid}::${key}`, undefined);
      return val !== undefined ? val : fallback;
    }

    async function idbSetScopedKV(uid, key, value) {
      return idbSetKV(`${uid}::${key}`, value);
    }

    async function idbGetAllDocs(uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readonly');
          const req = tx.objectStore('documents').getAll();
          req.onsuccess = () => {
            const list = (req.result || []).filter((d) => (d.ownerUid || 'local-owner') === uid);
            resolve(list);
          };
          req.onerror = () => resolve([]);
        });
      } catch {
        return [];
      }
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return 'PDF 檔案';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function splitParagraphIntoSentences(text) {
      if (!text) return [];
      const cleaned = text.replace(/\s+/g, ' ').trim();
      if (!cleaned) return [];
      const rawParts = cleaned.match(/[^.!?。！？]+(?:[.!?。！？]+['"”’)]*|\s*$)/g) || [cleaned];
      const merged = [];
      for (const part of rawParts) {
        const trimmed = part.trim();
        if (!trimmed) continue;
        const prev = merged[merged.length - 1];
        if (
          prev &&
          (/(?:\b(?:Dr|Prof|Mr|Mrs|Ms|Jr|Sr|vs|etc|e\.g|i\.e|U\.S|cf|ib|op|p|pp|Fig|No)\.|[0-9]\.)$/i.test(prev) ||
            prev.length < 14)
        ) {
          merged[merged.length - 1] = `${prev} ${trimmed}`;
        } else {
          merged.push(trimmed);
        }
      }
      return merged;
    }

    // ==== HL-BEGIN（重點母子層級、多層底色、架構表指令：純函式）====
    function getHighlightRangeInLine(hl, line) {
      if (!hl || !hl.quote || !line || !line.text) return null;
      if (
        hl.lineId === line.id &&
        Number.isInteger(hl.qStart) &&
        hl.qStart >= 0 &&
        line.text.slice(hl.qStart, hl.qStart + hl.quote.length) === hl.quote
      ) {
        return { start: hl.qStart, end: hl.qStart + hl.quote.length };
      }
      const s = line.text.indexOf(hl.quote);
      return s === -1 ? null : { start: s, end: s + hl.quote.length };
    }

    function highlightAppliesToLine(hl, line) {
      return !!hl.quote && (hl.lineId === line.id || (hl.quote.length >= 3 && line.text.includes(hl.quote)));
    }

    function computeHighlightDepths(hls) {
      const byId = {};
      hls.forEach((h) => { byId[h.id] = h; });
      const memo = {};
      const depthOf = (h, guard) => {
        if (memo[h.id] !== undefined) return memo[h.id];
        if (!h.parentId || !byId[h.parentId] || h.parentId === h.id || guard > 200) {
          memo[h.id] = 0;
          return 0;
        }
        memo[h.id] = 1 + depthOf(byId[h.parentId], guard + 1);
        return memo[h.id];
      };
      hls.forEach((h) => depthOf(h, 0));
      return memo;
    }

    function compareHighlightReadingOrder(a, b) {
      return (
        (a.pageNumber || 0) - (b.pageNumber || 0) ||
        (a.lineIndex || 0) - (b.lineIndex || 0) ||
        (Number.isInteger(a.qStart) ? a.qStart : 0) - (Number.isInteger(b.qStart) ? b.qStart : 0)
      );
    }

    // 依母子層級攤平成 [{hl, depth}]；order: 'array'（側欄原順序）| 'reading'（閱讀順序）
    function buildHighlightTree(hls, order) {
      const ids = new Set(hls.map((h) => h.id));
      const childrenOf = {};
      const roots = [];
      const sorted = order === 'reading' ? [...hls].sort(compareHighlightReadingOrder) : hls;
      sorted.forEach((h) => {
        if (h.parentId && h.parentId !== h.id && ids.has(h.parentId)) {
          if (!childrenOf[h.parentId]) childrenOf[h.parentId] = [];
          childrenOf[h.parentId].push(h);
        } else {
          roots.push(h);
        }
      });
      const out = [];
      const seen = new Set();
      const walk = (h, depth) => {
        if (seen.has(h.id)) return;
        seen.add(h.id);
        out.push({ hl: h, depth });
        (childrenOf[h.id] || []).forEach((c) => walk(c, depth + 1));
      };
      roots.forEach((r) => walk(r, 0));
      sorted.forEach((h) => { if (!seen.has(h.id)) walk(h, 0); });
      return out;
    }

    function collectDescendantIds(rootId, hls) {
      const kids = {};
      hls.forEach((h) => {
        if (h.parentId) {
          if (!kids[h.parentId]) kids[h.parentId] = [];
          kids[h.parentId].push(h.id);
        }
      });
      const out = [];
      const seen = new Set([rootId]);
      const stack = [rootId];
      while (stack.length) {
        const cur = stack.pop();
        (kids[cur] || []).forEach((k) => {
          if (!seen.has(k)) { seen.add(k); out.push(k); stack.push(k); }
        });
      }
      return out;
    }

    // 在同一行內，找出「完全包住」所選文字的最內層既有標註，作為預選母標註
    function detectParentHighlightId(line, hls, quote, selStart, selEnd, depthById) {
      if (!line || !quote) return '';
      let s = selStart;
      let e = selEnd;
      if (!(Number.isInteger(s) && s >= 0 && Number.isInteger(e) && e > s)) {
        s = line.text.indexOf(quote);
        if (s === -1) return '';
        e = s + quote.length;
      }
      let best = null;
      let bestLen = Infinity;
      let bestDepth = -1;
      for (const h of hls) {
        if (h.lineId !== line.id) continue;
        const r = getHighlightRangeInLine(h, line);
        if (!r) continue;
        if (r.start <= s && r.end >= e && r.end - r.start > e - s) {
          const len = r.end - r.start;
          const d = (depthById && depthById[h.id]) || 0;
          if (len < bestLen || (len === bestLen && d > bestDepth)) {
            best = h; bestLen = len; bestDepth = d;
          }
        }
      }
      return best ? best.id : '';
    }

    // 把一行文字依所有標註邊界切段，每段記錄覆蓋它的標註層（允許重疊）
    function buildHighlightSegments(text, ranges) {
      const cuts = new Set([0, text.length]);
      ranges.forEach((r) => { cuts.add(r.start); cuts.add(r.end); });
      const pts = Array.from(cuts).filter((n) => n >= 0 && n <= text.length).sort((a, b) => a - b);
      const segs = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        if (b <= a) continue;
        segs.push({ a, b, layers: ranges.filter((r) => r.start <= a && r.end >= b) });
      }
      return segs;
    }

    async function copyTextToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch {
        return false;
      }
    }

    function shortQuote(q, n) {
      const t = String(q || '').replace(/\s+/g, ' ').trim();
      return t.length > n ? `${t.slice(0, n)}…` : t;
    }

    function buildArchitecturePromptText({ title, numPages, highlights, inlineNotes, colors }) {
      const tree = buildHighlightTree(highlights, 'reading');
      const colorName = (id) => ((colors || []).find((c) => c.id === id) || (colors || [])[0] || { name: '' }).name;
      const usedInline = new Set();
      const counters = [];
      const lines = [];
      lines.push(`# 文獻：${title || '（未命名）'}（共 ${numPages || '?'} 頁、${highlights.length} 則重點）`);
      lines.push('說明：縮排代表母子隸屬關係（子標註是母標註之下的子集合或細部概念）；顏色名稱是我自己的分類標記。');
      lines.push('');
      lines.push('## 重點筆記（依母子階層與閱讀順序排列）');
      tree.forEach(({ hl, depth }) => {
        counters.length = depth + 1;
        counters[depth] = (counters[depth] || 0) + 1;
        for (let i = 0; i < depth; i++) if (!counters[i]) counters[i] = 1;
        const label = counters.join('.');
        const ind = '  '.repeat(depth);
        lines.push(`${ind}${label}${depth === 0 ? '.' : ''} [P.${hl.pageNumber || 1}｜${colorName(hl.colorId)}${hl.tag ? `｜#${hl.tag}` : ''}] 「${hl.quote}」`);
        if (hl.note && hl.note.trim()) lines.push(`${ind}   筆記：${hl.note.trim().replace(/\n+/g, ' / ')}`);
        const inl = inlineNotes && hl.lineId ? (inlineNotes[hl.lineId] || '').trim() : '';
        if (inl && !usedInline.has(hl.lineId)) {
          usedInline.add(hl.lineId);
          lines.push(`${ind}   行間筆記：${inl.replace(/\n+/g, ' / ')}`);
        }
      });
      lines.push('');
      lines.push('---');
      lines.push('請根據上面「依母子階層排列的重點筆記」，幫我整理出這份文獻的完整架構表：');
      lines.push('1. 以 Markdown 表格輸出，欄位為：層級｜重點（精簡改寫）｜頁碼｜標籤｜我的筆記｜與上層的關係。');
      lines.push('2. 嚴格依照母子隸屬關係排列：子重點放在母重點之下，不要自行合併、省略或調換層級。');
      lines.push('3. 表格之後，用 3～5 句話說明整篇文獻的論證主線（由最上層重點串起）。');
      lines.push('4. 若發現層級有邏輯跳躍或缺漏，最後以「待補充」清單列出，並說明原因。');
      lines.push('5. 使用繁體中文；不要加入我的重點與筆記裡沒有的內容。');
      return lines.join('\n');
    }
    // ==== HL-END ====

    // ==== SYNC-BEGIN（同步重點至 PDF：文字比對與座標計算，純函式）====
    function sortTextItemsReadingOrder(items) {
      items.sort((a, b) => {
        if (Math.abs(b.y - a.y) > Math.min(a.h, b.h) * 0.45) return b.y - a.y;
        return a.x - b.x;
      });
      return items;
    }

    function squashText(str) {
      const s = String(str || '');
      let out = '';
      for (let i = 0; i < s.length; i++) {
        const ch = s[i];
        if (/\s/.test(ch)) continue;
        const low = ch.toLowerCase();
        out += low.length === ch.length ? low : ch;
      }
      return out;
    }

    async function loadPageTextData(pdfDoc, pageNum) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      const items = [];
      for (const it of tc.items || []) {
        const str = (it.str || '').replace(/\u0000/g, '');
        if (!str.trim()) continue;
        const tr = it.transform || [1, 0, 0, 1, 0, 0];
        const fontH = Math.max(8, Math.hypot(tr[0], tr[1]) || it.height || 12);
        items.push({ str, x: tr[4], y: tr[5], w: it.width || str.length * fontH * 0.5, h: fontH });
      }
      sortTextItemsReadingOrder(items);
      return { pageNum, viewport, items };
    }

    // 跨頁比對時，丟掉上一頁底部／下一頁頂部的頁首頁尾區（避免頁碼、running header 夾在句子中間）
    function trimItemsForJoin(data, side) {
      const vb = data.viewport.viewBox || [0, 0, data.viewport.width, data.viewport.height];
      const H = vb[3] - vb[1];
      if (!H || (data.viewport.rotation || 0) !== 0) return data.items;
      return data.items.filter((it) => {
        const yr = (it.y - vb[1]) / H;
        return side === 'first' ? yr >= 0.09 : yr <= 0.91;
      });
    }

    function buildMatchStream(parts) {
      let norm = '';
      const map = [];
      parts.forEach((part, pi) => {
        const items = part.items;
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          const str = it.str || '';
          const sameNext = items[i + 1];
          const next = sameNext || (parts[pi + 1] ? parts[pi + 1].items[0] : null);
          let lastNonSpace = -1;
          for (let k = str.length - 1; k >= 0; k--) {
            if (!/\s/.test(str[k])) { lastNonSpace = k; break; }
          }
          for (let c = 0; c < str.length; c++) {
            const ch = str[c];
            if (/\s/.test(ch)) continue;
            // 行尾連字號：下一行（或下一頁）以小寫字母開頭時，視為斷字，不納入比對
            if (
              ch === '-' && c === lastNonSpace && c > 0 && /[A-Za-z]/.test(str[c - 1]) && next &&
              (!sameNext || Math.abs(next.y - it.y) > Math.min(next.h, it.h) * 0.45) &&
              /^\s*[a-z]/.test(next.str || '')
            ) continue;
            const low = ch.toLowerCase();
            norm += low.length === ch.length ? low : ch;
            map.push({ pi, i, c });
          }
        }
      });
      return { norm, map, parts };
    }

    function allIndexOf(hay, needle) {
      const out = [];
      if (!needle) return out;
      let from = 0;
      while (out.length < 50) {
        const idx = hay.indexOf(needle, from);
        if (idx === -1) break;
        out.push(idx);
        from = idx + 1;
      }
      return out;
    }

    function charWidthWeight(ch) {
      if (/[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]/.test(ch)) return 1;
      if (/\s/.test(ch)) return 0.3;
      if (/[iljI.,;:'!|`]/.test(ch)) return 0.3;
      if (/[mwMW@]/.test(ch)) return 0.85;
      if (/[A-Z]/.test(ch)) return 0.65;
      return 0.5;
    }

    function cumulativeWidths(str) {
      const cw = [0];
      for (let i = 0; i < str.length; i++) cw.push(cw[i] + charWidthWeight(str[i]));
      return cw;
    }

    const clamp01 = (v) => Math.min(1, Math.max(0, v));

    function rectsFromStreamRange(stream, ns, ne) {
      const groups = [];
      let cur = null;
      for (let k = ns; k < ne; k++) {
        const m = stream.map[k];
        if (!m) continue;
        if (!cur || cur.pi !== m.pi || cur.i !== m.i) {
          cur = { pi: m.pi, i: m.i, c0: m.c, c1: m.c };
          groups.push(cur);
        }
        cur.c1 = m.c;
      }
      const byPage = {};
      for (const g of groups) {
        const part = stream.parts[g.pi];
        const it = part.items[g.i];
        const vp = part.data.viewport;
        const cw = cumulativeWidths(it.str);
        const total = cw[it.str.length] || 1;
        const x0 = it.x + it.w * (cw[g.c0] / total);
        const x1 = it.x + it.w * (cw[g.c1 + 1] / total);
        const [ax, ay, bx, by] = vp.convertToViewportRectangle([x0, it.y - it.h * 0.22, x1, it.y + it.h * 0.86]);
        const left = Math.min(ax, bx);
        const right = Math.max(ax, bx);
        const top = Math.min(ay, by);
        const bottom = Math.max(ay, by);
        const r = {
          x: clamp01(left / vp.width),
          y: clamp01(top / vp.height),
          w: clamp01((right - left) / vp.width),
          h: clamp01((bottom - top) / vp.height)
        };
        if (r.w <= 0 || r.h <= 0) continue;
        const key = part.data.pageNum;
        if (!byPage[key]) byPage[key] = [];
        byPage[key].push(r);
      }
      return byPage;
    }

    // 同一行相鄰的小矩形合併成一條
    function mergeLineRects(rects) {
      const sorted = [...rects].sort((a, b) => (Math.abs(a.y - b.y) < 0.006 ? a.x - b.x : a.y - b.y));
      const out = [];
      for (const r of sorted) {
        const last = out[out.length - 1];
        if (last && Math.abs(last.y - r.y) < 0.006 && r.x - (last.x + last.w) < 0.02) {
          const right = Math.max(last.x + last.w, r.x + r.w);
          const top = Math.min(last.y, r.y);
          const bottom = Math.max(last.y + last.h, r.y + r.h);
          last.x = Math.min(last.x, r.x);
          last.w = right - last.x;
          last.y = top;
          last.h = bottom - top;
        } else {
          out.push({ ...r });
        }
      }
      return out;
    }

    // 先用「所在句」定位（避免重複詞），再退回直接找引文；不唯一就不畫，避免畫錯位置
    function locateQuoteInStream(stream, line, hl) {
      const qs = squashText(hl.quote);
      if (!qs) return { error: 'empty' };
      if (line && line.text) {
        const ls = squashText(line.text);
        if (ls.length >= 6 && ls.includes(qs)) {
          const occ = allIndexOf(stream.norm, ls);
          if (occ.length === 1) {
            let off = -1;
            const r = getHighlightRangeInLine(hl, line);
            if (r) {
              const cand = squashText(line.text.slice(0, r.start)).length;
              if (ls.substr(cand, qs.length) === qs) off = cand;
            }
            if (off < 0) off = ls.indexOf(qs);
            return { ns: occ[0] + off, ne: occ[0] + off + qs.length };
          }
        }
      }
      const occ = allIndexOf(stream.norm, qs);
      if (occ.length === 1) return { ns: occ[0], ne: occ[0] + qs.length };
      return { error: occ.length === 0 ? 'notfound' : 'ambiguous' };
    }

    async function computeHighlightSyncRects(pdfDoc, highlights, lineById, numPages, onProgress) {
      const dataCache = new Map();
      const streamCache = new Map();
      const getData = async (p) => {
        if (p < 1 || p > numPages) return null;
        if (!dataCache.has(p)) dataCache.set(p, await loadPageTextData(pdfDoc, p));
        return dataCache.get(p);
      };
      const getStream = async (pages) => {
        const key = pages.join(',');
        if (streamCache.has(key)) return streamCache.get(key);
        const parts = [];
        for (let idx = 0; idx < pages.length; idx++) {
          const data = await getData(pages[idx]);
          if (!data) { streamCache.set(key, null); return null; }
          parts.push({ data, items: pages.length > 1 ? trimItemsForJoin(data, idx === 0 ? 'first' : 'second') : data.items });
        }
        const st = buildMatchStream(parts);
        streamCache.set(key, st);
        return st;
      };

      const annotations = [];
      const failed = [];
      let ok = 0;
      for (let n = 0; n < highlights.length; n++) {
        const hl = highlights[n];
        if (onProgress) onProgress(n + 1, highlights.length);
        const line = lineById[hl.lineId] || null;
        const base = Math.min(numPages, Math.max(1, hl.pageNumber || (line && line.pageNumber) || 1));
        const attempts = [[base], [base, base + 1], [base - 1, base], [base + 1], [base - 1]];
        let found = null;
        let lastErr = 'notfound';
        for (const pages of attempts) {
          if (pages.some((p) => p < 1 || p > numPages)) continue;
          const st = await getStream(pages);
          if (!st) continue;
          const res = locateQuoteInStream(st, line, hl);
          if (res.error) {
            if (res.error === 'ambiguous') lastErr = 'ambiguous';
            continue;
          }
          found = { st, res };
          break;
        }
        const failReason = lastErr === 'ambiguous'
          ? '這段文字在 PDF 中重複出現，無法確定位置'
          : '在 PDF 文字圖層找不到（可能是掃描圖片，或文字已被修改）';
        if (!found) {
          failed.push({ hl, reason: failReason });
          continue;
        }
        const byPage = rectsFromStreamRange(found.st, found.res.ns, found.res.ne);
        let any = false;
        Object.keys(byPage).forEach((pk) => {
          const rects = mergeLineRects(byPage[pk]);
          if (rects.length === 0) return;
          any = true;
          annotations.push({
            id: `hlsync-${hl.id}-p${pk}`,
            page: Number(pk),
            type: 'hlsync',
            hlId: hl.id,
            colorId: hl.colorId || 'ochre',
            rects
          });
        });
        if (any) ok++;
        else failed.push({ hl, reason: failReason });
      }
      return { annotations, failed, ok };
    }
    // ==== SYNC-END ====

    // ==== EXT-BEGIN（PDF 轉文字 V2：頁首頁尾偵測、跨頁合併、分段與斷句；僅用於新匯入的文件）====
    const SENT_ALWAYS_ABBR = new Set([
      'dr', 'prof', 'mr', 'mrs', 'ms', 'jr', 'sr', 'vs', 'cf', 'al', 'approx', 'dept', 'inc', 'ltd', 'co',
      'viz', 'ca', 'st', 'resp', 'trans', 'ibid', 'op', 'cit'
    ]);
    const SENT_NUMBERED_ABBR = new Set(['fig', 'figs', 'eq', 'eqs', 'no', 'nos', 'vol', 'vols', 'ch', 'sec', 'p', 'pp', 'art', 'ed', 'eds']);
    const SENT_CLOSERS = /["'”’)\]」』）]/;
    const SENT_TERMINAL_RE = /[.!?。！？…]["'”’)\]」』）]*$/;
    const BLOCK_LIST_MARKER_RE = /^(\d+\.|[•·\-▪])\s+/;

    function splitParagraphIntoSentencesV2(text) {
      const t = String(text || '').replace(/\s+/g, ' ').trim();
      if (!t) return [];
      const out = [];
      let start = 0;
      const pushPart = (end) => {
        const part = t.slice(start, end).trim();
        if (part) out.push(part);
        start = end;
      };
      for (let i = 0; i < t.length; i++) {
        const c = t[i];
        if (c === '。' || c === '！' || c === '？') {
          let j = i + 1;
          while (j < t.length && (/[。！？]/.test(t[j]) || SENT_CLOSERS.test(t[j]))) j++;
          pushPart(j);
          i = j - 1;
          continue;
        }
        if (c === '.' || c === '!' || c === '?') {
          let j = i + 1;
          while (j < t.length && /[.!?]/.test(t[j])) j++;
          const multi = j - i > 1;
          let k = j;
          while (k < t.length && SENT_CLOSERS.test(t[k])) k++;
          if (k >= t.length) {
            pushPart(t.length);
            break;
          }
          if (t[k] !== ' ') { i = j - 1; continue; } // 3.14、U.S.A、e.g.x 等不是句界
          const m = t.slice(k + 1).match(/^[\s"'“‘(\[「『（]*(.)/);
          const nextCh = m ? m[1] : '';
          if (c === '.' && !multi) {
            const wm = t.slice(start, i).match(/([A-Za-z][A-Za-z.]*|\d+)$/);
            const word = wm ? wm[1] : '';
            const lower = word.toLowerCase();
            if (SENT_ALWAYS_ABBR.has(lower)) { i = j - 1; continue; }
            if (SENT_NUMBERED_ABBR.has(lower) && /[0-9A-Z]/.test(nextCh) && /\d/.test(nextCh)) { i = j - 1; continue; }
            if (/^[A-Z]$/.test(word)) { i = j - 1; continue; }                 // 人名縮寫 J. Smith
            if (/^[A-Za-z](\.[A-Za-z])+$/.test(word)) { i = j - 1; continue; } // e.g. / i.e. / U.S.
          }
          if (/[a-z]/.test(nextCh)) { i = j - 1; continue; } // 後面小寫 → 同一句
          pushPart(k);
          i = k - 1;
          continue;
        }
      }
      if (start < t.length) pushPart(t.length);

      // 太短的碎片（如 "1."、"A."）併入相鄰句
      const merged = [];
      for (const p of out) {
        const prev = merged[merged.length - 1];
        if (prev && p.replace(/\s/g, '').length < 3) merged[merged.length - 1] = `${prev} ${p}`;
        else merged.push(p);
      }
      if (merged.length > 1 && merged[0].replace(/\s/g, '').length < 3) {
        merged[1] = `${merged[0]} ${merged[1]}`;
        merged.shift();
      }
      return merged;
    }

    function joinBlockText(prevText, nextText) {
      if (/[a-zA-Z]-$/.test(prevText) && /^[a-z]/.test(nextText)) {
        return { base: prevText.slice(0, -1), joiner: '' };
      }
      const bothCJK =
        /[\u4e00-\u9fff，。；：「」『』（）！？”’]$/.test(prevText) && /^[\u4e00-\u9fff「『（]/.test(nextText);
      return { base: prevText, joiner: bothCJK ? '' : ' ' };
    }

    function finalizeBlockV2(b) {
      const text = b.text.trim();
      const out = { type: b.type, text };
      if (b.type === 'paragraph') {
        const sents = splitParagraphIntoSentencesV2(text);
        out.sentences = sents;
        if (b.segments && b.segments.length > 1) {
          let cursor = 0;
          out.sentencePages = sents.map((s) => {
            const idx = text.indexOf(s, cursor);
            const pos = idx === -1 ? cursor : idx;
            cursor = pos + s.length;
            const seg = b.segments.find((g) => pos >= g.start && pos < g.end) || b.segments[b.segments.length - 1];
            return seg.page;
          });
        }
      }
      return out;
    }

    async function extractStructuredPagesFromPdfV2(pdfDoc, filterHeaderFooter = true, onProgress = null) {
      const numPages = pdfDoc.numPages;
      const pageLines = [];

      // ---- 第 1 階段：逐頁取出文字行（座標、字高、左右邊界）----
      for (let p = 1; p <= numPages; p++) {
        if (onProgress) onProgress(p, numPages);
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        const pageHeight = viewport.height || 800;
        const textContent = await page.getTextContent();
        const items = [];
        for (const item of textContent.items || []) {
          const str = (item.str || '').replace(/\u0000/g, '');
          if (!str.trim()) continue;
          const tr = item.transform || [1, 0, 0, 1, 0, 0];
          const fontH = Math.max(8, Math.hypot(tr[0], tr[1]) || item.height || 12);
          items.push({ str, x: tr[4], y: tr[5], w: item.width || str.length * fontH * 0.5, h: fontH });
        }
        sortTextItemsReadingOrder(items);

        const lines = [];
        for (const it of items) {
          const last = lines[lines.length - 1];
          if (last && Math.abs(last.y - it.y) <= Math.max(last.h, it.h) * 0.48) {
            const prevItem = last.lastItem;
            const gap = it.x - (prevItem.x + prevItem.w);
            const isCJK = /[\u4e00-\u9fff]$/.test(last.text) || /^[\u4e00-\u9fff]/.test(it.str);
            const needSpace =
              !isCJK &&
              gap > it.h * 0.16 &&
              !/[\s\-–—/(\[「『（]$/.test(last.text) &&
              !/^[\s.,;:!?%)\]」』）]/.test(it.str);
            last.text += (needSpace ? ' ' : '') + it.str;
            last.lastItem = it;
            last.h = Math.max(last.h, it.h);
            last.xEnd = Math.max(last.xEnd, it.x + it.w);
          } else {
            lines.push({ text: it.str.trim(), y: it.y, x: it.x, xEnd: it.x + it.w, h: it.h, lastItem: it });
          }
        }
        lines.forEach((l) => { l.yr = l.y / pageHeight; delete l.lastItem; });
        pageLines.push({ pageNumber: p, lines });
      }

      // ---- 第 2 階段：頁首／頁尾／頁碼偵測（跨頁重複 ＋ 頁碼樣式）----
      if (filterHeaderFooter) {
        const sigOf = (t) => t.replace(/\d+/g, '#').replace(/\s+/g, ' ').trim().toLowerCase();
        const zoneOf = (l) => (l.yr > 0.9 ? 'top' : l.yr < 0.09 ? 'bottom' : '');
        const counts = {};
        pageLines.forEach((pl) => {
          const seen = new Set();
          pl.lines.forEach((l) => {
            const z = zoneOf(l);
            if (!z) return;
            const k = `${z}|${sigOf(l.text)}`;
            if (!seen.has(k)) { seen.add(k); counts[k] = (counts[k] || 0) + 1; }
          });
        });
        const minRepeat = Math.max(3, Math.ceil(numPages * 0.3));
        pageLines.forEach((pl) => {
          pl.lines = pl.lines.filter((l) => {
            const z = zoneOf(l);
            if (!z) return true;
            const t = l.text.trim();
            const nearEdge = l.yr > 0.94 || l.yr < 0.055;
            const isStamp =
              /^https?:\/\//i.test(t) ||
              /^[-–—]?\s*\d+\s*[-–—]?$/.test(t) ||
              /^\d+\s*\/\s*\d+$/.test(t) ||
              /^(page|p\.?|第)\s*\d+(\s*(頁|页))?(\s*(of|\/)\s*\d+)?$/i.test(t);
            if (nearEdge && isStamp) return false;
            if (numPages >= 4 && counts[`${z}|${sigOf(t)}`] >= minRepeat) return false;
            return true;
          });
        });
      }

      // ---- 第 3 階段：分段（含跨頁接續）----
      const pages = [];
      let totalCharCount = 0;
      let carry = null; // 上一頁最後一個區塊（可能被下一頁接續）

      for (const pl of pageLines) {
        const lines = pl.lines.filter((l) => l.text.trim());
        if (lines.length === 0) {
          pages.push({ pageNumber: pl.pageNumber, blocks: [] });
          carry = null;
          continue;
        }
        const heights = lines.map((l) => l.h).sort((a, b) => a - b);
        const medianH = heights[Math.floor(heights.length / 2)] || 12;
        const lefts = lines.map((l) => l.x).sort((a, b) => a - b);
        const rights = lines.map((l) => l.xEnd).sort((a, b) => a - b);
        const leftMargin = lefts[Math.floor(lefts.length * 0.15)];
        const rightMargin = rights[Math.floor(rights.length * 0.9)];
        const fullW = Math.max(1, rightMargin - leftMargin);

        const blocks = [];
        let cur = null;
        const startBlock = (type, line, text) => ({
          type, text, startPage: pl.pageNumber,
          lastY: line.y, lastH: line.h, lastXEnd: line.xEnd, firstYr: line.yr, lastYr: line.yr
        });

        for (const line of lines) {
          const lineText = line.text.trim();
          totalCharCount += lineText.length;
          const isHeading = line.h >= medianH * 1.2 && lineText.length < 130;

          if (!cur) {
            cur = startBlock(isHeading ? 'heading' : 'paragraph', line, lineText);
            continue;
          }
          const verticalGap = cur.lastY - line.y;
          const prevEndsTerminal = SENT_TERMINAL_RE.test(cur.text);
          const prevShort = cur.lastXEnd - leftMargin < fullW * 0.78;
          const indented = line.x - leftMargin > Math.max(line.h * 1.1, 8);
          const paragraphBreak =
            isHeading ||
            cur.type === 'heading' ||
            verticalGap > Math.max(cur.lastH, line.h) * 1.72 ||
            BLOCK_LIST_MARKER_RE.test(lineText) ||
            (prevEndsTerminal && (prevShort || indented));

          if (paragraphBreak) {
            blocks.push(cur);
            cur = startBlock(isHeading ? 'heading' : 'paragraph', line, lineText);
          } else {
            const { base, joiner } = joinBlockText(cur.text, lineText);
            cur.text = base + joiner + lineText;
            cur.lastY = line.y;
            cur.lastH = line.h;
            cur.lastXEnd = line.xEnd;
            cur.lastYr = line.yr;
          }
        }
        if (cur && cur.text.trim()) blocks.push(cur);

        // 跨頁接續：上一頁最後一段沒收尾、且落在頁面下方；本頁第一段在頁面上方、不是標題或條列
        if (carry && blocks.length > 0) {
          const prev = carry;
          const first = blocks[0];
          const canContinue =
            prev.type === 'paragraph' && first.type === 'paragraph' &&
            !SENT_TERMINAL_RE.test(prev.text) &&
            !BLOCK_LIST_MARKER_RE.test(first.text) &&
            prev.lastYr < 0.35 && first.firstYr > 0.55;
          if (canContinue) {
            if (!prev.segments) prev.segments = [{ page: prev.startPage, start: 0, end: prev.text.length }];
            const { base, joiner } = joinBlockText(prev.text, first.text);
            const segStart = base.length + joiner.length;
            prev.text = base + joiner + first.text;
            prev.segments[prev.segments.length - 1].end = Math.min(prev.segments[prev.segments.length - 1].end, base.length) || prev.segments[prev.segments.length - 1].end;
            prev.segments.push({ page: pl.pageNumber, start: segStart, end: prev.text.length });
            prev.lastYr = first.lastYr;
            blocks.shift();
          }
        }

        const pageObj = { pageNumber: pl.pageNumber, blocks };
        pages.push(pageObj);
        carry = blocks.length > 0 ? blocks[blocks.length - 1] : carry;
      }

      return {
        pages: pages.map((pg) => ({ pageNumber: pg.pageNumber, blocks: pg.blocks.map(finalizeBlockV2) })),
        totalCharCount
      };
    }
    // ==== EXT-END ====

    async function extractStructuredPagesFromPdf(pdfDoc, filterHeaderFooter = true, onProgress = null) {
      const pages = [];
      let totalCharCount = 0;

      for (let p = 1; p <= pdfDoc.numPages; p++) {
        if (onProgress) onProgress(p, pdfDoc.numPages);
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        const pageHeight = viewport.height || 800;
        const textContent = await page.getTextContent();
        const rawItems = textContent.items || [];

        const items = [];
        for (const item of rawItems) {
          const str = (item.str || '').replace(/\u0000/g, '');
          if (!str.trim()) continue;
          const tx = item.transform ? item.transform[4] : 0;
          const ty = item.transform ? item.transform[5] : 0;
          const fontH = Math.max(
            8,
            Math.hypot(item.transform?.[0] || 0, item.transform?.[1] || 0) || item.height || 12
          );

          if (filterHeaderFooter) {
            const isNearEdge = ty > pageHeight * 0.94 || ty < pageHeight * 0.055;
            const isStamp =
              /^https?:\/\//i.test(str.trim()) ||
              /^[-–—]?\s*\d+\s*[-–—]?$/.test(str.trim()) ||
              /^\d+\s*\/\s*\d+$/.test(str.trim());
            if (isNearEdge && isStamp) continue;
          }

          items.push({
            str,
            x: tx,
            y: ty,
            w: item.width || str.length * fontH * 0.5,
            h: fontH
          });
        }

        if (items.length === 0) {
          pages.push({ pageNumber: p, blocks: [] });
          continue;
        }

        items.sort((a, b) => {
          if (Math.abs(b.y - a.y) > Math.min(a.h, b.h) * 0.45) {
            return b.y - a.y;
          }
          return a.x - b.x;
        });

        const visualLines = [];
        for (const it of items) {
          const lastLine = visualLines[visualLines.length - 1];
          if (lastLine && Math.abs(lastLine.y - it.y) <= Math.max(lastLine.h, it.h) * 0.48) {
            const prevItem = lastLine.items[lastLine.items.length - 1];
            const gap = it.x - (prevItem.x + prevItem.w);
            const isCJK = /[\u4e00-\u9fff]$/.test(lastLine.text) || /^[\u4e00-\u9fff]/.test(it.str);
            const needSpace =
              !isCJK &&
              gap > it.h * 0.16 &&
              !/[\s\-–—/(\[「『（]$/.test(lastLine.text) &&
              !/^[\s.,;:!?%)\]」』）]/.test(it.str);
            lastLine.text += (needSpace ? ' ' : '') + it.str;
            lastLine.items.push(it);
            lastLine.h = Math.max(lastLine.h, it.h);
          } else {
            visualLines.push({
              text: it.str.trim(),
              y: it.y,
              x: it.x,
              h: it.h,
              items: [it]
            });
          }
        }

        const sortedHeights = visualLines.map((l) => l.h).sort((a, b) => a - b);
        const medianH = sortedHeights[Math.floor(sortedHeights.length / 2)] || 12;

        const blocks = [];
        let currentBlock = null;

        for (const line of visualLines) {
          const lineText = line.text.trim();
          if (!lineText) continue;
          totalCharCount += lineText.length;
          const isHeading = line.h >= medianH * 1.2 && lineText.length < 130;

          if (!currentBlock) {
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
            continue;
          }

          const verticalGap = currentBlock.lastY - line.y;
          const paragraphBreak =
            isHeading ||
            currentBlock.type === 'heading' ||
            verticalGap > Math.max(currentBlock.lastH, line.h) * 1.72 ||
            /^(\d+\.|[•·\-▪])\s+/.test(lineText);

          if (paragraphBreak) {
            blocks.push({ type: currentBlock.type, text: currentBlock.text });
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
          } else {
            if (/[a-zA-Z]-$/.test(currentBlock.text) && /^[a-z]/.test(lineText)) {
              currentBlock.text = currentBlock.text.slice(0, -1) + lineText;
            } else {
              const bothCJK =
                /[\u4e00-\u9fff，。；：「」『』（）！？”’]$/.test(currentBlock.text) &&
                /^[\u4e00-\u9fff「『（]/.test(lineText);
              currentBlock.text = `${currentBlock.text}${bothCJK ? '' : ' '}${lineText}`;
            }
            currentBlock.lastY = line.y;
            currentBlock.lastH = line.h;
          }
        }

        if (currentBlock && currentBlock.text.trim()) {
          blocks.push({ type: currentBlock.type, text: currentBlock.text.trim() });
        }
        pages.push({ pageNumber: p, blocks });
      }

      return { pages, totalCharCount };
    }

    // 將便利貼或中文文字盒渲染為高解析 PNG Uint8Array，供 pdf-lib 嵌入（完美支援繁體中文不亂碼）
    async function renderStickyNoteToPngBytes(text, borderHex = '#c8a86b', bgHex = '#fffdf7') {
      const scale = 2;
      const boxW = 210;
      const padding = 12;
      const fontSize = 12;
      const lineH = 18;

      const measureCanvas = document.createElement('canvas');
      const mCtx = measureCanvas.getContext('2d');
      mCtx.font = `500 ${fontSize}px "Noto Sans TC", "Inter", sans-serif`;

      const maxTextW = boxW - padding * 2;
      const paragraphs = String(text || '').split('\n');
      const wrappedLines = [];

      for (const para of paragraphs) {
        if (!para) {
          wrappedLines.push('');
          continue;
        }
        let line = '';
        for (const ch of para) {
          const test = line + ch;
          if (mCtx.measureText(test).width > maxTextW && line) {
            wrappedLines.push(line);
            line = ch;
          } else {
            line = test;
          }
        }
        if (line) wrappedLines.push(line);
      }

      const boxH = Math.max(58, wrappedLines.length * lineH + padding * 2 + 12);
      const canvas = document.createElement('canvas');
      canvas.width = boxW * scale;
      canvas.height = boxH * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      // 背景與色條
      ctx.fillStyle = bgHex;
      ctx.strokeStyle = borderHex;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(1, 1, boxW - 2, boxH - 2, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = borderHex;
      ctx.fillRect(1, 1, boxW - 2, 8);

      ctx.fillStyle = '#22252a';
      ctx.font = `500 ${fontSize}px "Noto Sans TC", "Inter", sans-serif`;
      wrappedLines.forEach((ln, idx) => {
        ctx.fillText(ln, padding, padding + 16 + idx * lineH);
      });

      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return { bytes, width: boxW, height: boxH };
    }

    // 將整頁重點附錄渲染為 A4 PNG 嵌入標註 PDF 文末
    async function renderAppendixPageToPngBytes(title, highlights) {
      const scale = 2;
      const pageW = 595;
      const pageH = 842;
      const pad = 42;
      const canvas = document.createElement('canvas');
      canvas.width = pageW * scale;
      canvas.height = pageH * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, pageW, pageH);

      ctx.fillStyle = '#1e293b';
      ctx.font = '700 18px "Noto Sans TC", sans-serif';
      ctx.fillText(`重點標註與筆記附錄 — ${String(title || '').slice(0, 26)}`, pad, pad + 12);

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad, pad + 26);
      ctx.lineTo(pageW - pad, pad + 26);
      ctx.stroke();

      let curY = pad + 52;
      const maxW = pageW - pad * 2;

      const wrapText = (str, fontStr, maxWidth) => {
        ctx.font = fontStr;
        const out = [];
        for (const rawP of String(str || '').split('\n')) {
          let ln = '';
          for (const ch of rawP) {
            if (ctx.measureText(ln + ch).width > maxWidth && ln) {
              out.push(ln);
              ln = ch;
            } else {
              ln += ch;
            }
          }
          if (ln) out.push(ln);
        }
        return out;
      };

      for (const hl of highlights) {
        if (curY > pageH - 80) break;
        const cObj = MARKER_COLORS.find((c) => c.id === hl.colorId) || MARKER_COLORS[0];
        ctx.fillStyle = cObj.hex;
        ctx.font = '700 11px "Noto Sans TC", sans-serif';
        ctx.fillText(`● P.${hl.pageNumber || 1}  #${hl.tag || '重點'}`, pad, curY);
        curY += 18;

        ctx.fillStyle = '#0f172a';
        const qLines = wrapText(`「${hl.quote}」`, '600 12px "Noto Sans TC", sans-serif', maxW);
        for (const ql of qLines.slice(0, 4)) {
          ctx.fillText(ql, pad, curY);
          curY += 17;
        }

        if (hl.note) {
          ctx.fillStyle = '#475569';
          const nLines = wrapText(`筆記：${hl.note}`, '400 11px "Noto Sans TC", sans-serif', maxW - 10);
          for (const nl of nLines.slice(0, 4)) {
            ctx.fillText(nl, pad + 8, curY);
            curY += 16;
          }
        }
        curY += 12;
      }

      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    // 免金鑰快速直譯字典通道
    async function fetchKeylessInstantDictionary(queryText) {
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(queryText)}`;
        const res = await fetch(gtxUrl);
        if (res.ok) {
          const data = await res.json();
          const mainTrans = Array.isArray(data?.[0])
            ? data[0].map((seg) => seg?.[0] || '').join('').trim()
            : '';
          let posNote = '';
          if (Array.isArray(data?.[1]) && data[1].length > 0) {
            posNote = data[1]
              .slice(0, 2)
              .map((entry) => `${entry[0]}：${(entry[1] || []).slice(0, 4).join('、')}`)
              .join(' ｜ ');
          }
          if (mainTrans) return { translation: mainTrans, posOrNote: posNote };
        }
      } catch {}

      const isAscii = /^[A-Za-z0-9\s.,'?!:;()-]+$/.test(queryText);
      const mmRes = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(queryText)}&langpair=${isAscii ? 'en|zh-TW' : 'autodetect|zh-TW'}`
      );
      if (!mmRes.ok) throw new Error('免費字典通道忙碌，請點下方「語境深譯」');
      const mmData = await mmRes.json();
      const mmText = mmData?.responseData?.translatedText?.trim();
      if (!mmText) throw new Error('查無直譯結果');
      return { translation: mmText, posOrNote: '' };
    }

    // 全面鎖定呼叫 gemini-3.8-flash（支援純文字、JSON Schema 與圖片 OCR inlineData）
    async function callGeminiFlash({
      geminiKey = '',
      systemInstruction = '',
      messages = [],
      thinkingLevelObj = THINKING_LEVELS[2],
      expectJson = false,
      geminiJsonSchema = null
    }) {
      const cleanKey = (geminiKey || localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
      if (!cleanKey) {
        throw new Error('請先點擊右上角「API 金鑰」設定您的 Google Gemini API Key');
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${LOCKED_GEMINI_MODEL}:generateContent?key=${encodeURIComponent(cleanKey)}`;

      const contents = messages.map((m) => {
        const parts = [];
        if (m.inlineData) {
          parts.push({ inlineData: m.inlineData });
        }
        if (m.text) {
          parts.push({ text: m.text });
        }
        return {
          role: m.role === 'assistant' ? 'model' : 'user',
          parts
        };
      });

      const buildPayload = (includeThinking) => {
        const generationConfig = {};
        if (expectJson) {
          generationConfig.responseMimeType = 'application/json';
          if (geminiJsonSchema) generationConfig.responseSchema = geminiJsonSchema;
        }
        if (includeThinking && typeof thinkingLevelObj?.geminiBudget === 'number') {
          generationConfig.thinkingConfig = { thinkingBudget: thinkingLevelObj.geminiBudget };
        }
        return {
          contents,
          ...(systemInstruction ? { systemInstruction: { parts: [{ text: systemInstruction }] } } : {}),
          ...(Object.keys(generationConfig).length > 0 ? { generationConfig } : {})
        };
      };

      let res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildPayload(true))
      });

      if (res.status === 400) {
        const errCheck = await res.clone().json().catch(() => ({}));
        if (/thinking/i.test(errCheck?.error?.message || '')) {
          res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildPayload(false))
          });
        }
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data?.error?.message || `Gemini 連線錯誤 (${res.status})`);

      const parts = data?.candidates?.[0]?.content?.parts || [];
      let thoughtText = '';
      let answerText = '';
      for (const p of parts) {
        if (p.thought) thoughtText += p.text || '';
        else answerText += p.text || '';
      }
      return { text: answerText.trim(), thought: thoughtText.trim() };
    }

    // =========================================================================
    // 5. 單頁 PDF 畫布＋手寫直線標註＋便利貼互動子組件（支援連續滾動與單頁模式）
    // =========================================================================
    function PdfPageSurfaceBase({
      pdfDoc,
      pageNumber,
      pdfZoom,
      pdfTool,
      drawMode,
      activeBrushColor,
      pageAnnotations,
      onCommitAnnotation,
      onUpdateAnnotation,
      onDeleteAnnotation,
      onEraseAtPoint,
      pdfSpotlightRuler,
      rulerYRatio,
      setRulerYRatio,
      onPageVisible,
      scrollRootRef
    }) {
      const wrapperRef = useRef(null);
      const pdfCanvasRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const drawingStrokeRef = useRef(null);
      const draggingStickyRef = useRef(null);

      const [isNearViewport, setIsNearViewport] = useState(pageNumber <= 3);
      const [pageSize, setPageSize] = useState({ width: Math.round(595 * pdfZoom), height: Math.round(842 * pdfZoom) });
      const [editingStickyId, setEditingStickyId] = useState(null);

      // 偵測頁面進入視野（懶載入畫布 ＋ 自動更新當前頁碼）
      useEffect(() => {
        const el = wrapperRef.current;
        if (!el) return;
        const rootEl = scrollRootRef?.current || null;

        const lazyObs = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) setIsNearViewport(true);
            });
          },
          { root: rootEl, rootMargin: '800px 0px' }
        );

        const activePageObs = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
                onPageVisible?.(pageNumber);
              }
            });
          },
          { root: rootEl, threshold: [0.35, 0.65] }
        );

        lazyObs.observe(el);
        activePageObs.observe(el);
        return () => {
          lazyObs.disconnect();
          activePageObs.disconnect();
        };
      }, [pageNumber, onPageVisible, scrollRootRef]);

      // 繪製手寫與直線標註覆蓋層
      const redrawStrokes = useCallback(() => {
        const canvas = overlayCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 「同步重點至 PDF」的底色（先畫，讓手寫線條蓋在上面）
        pageAnnotations
          .filter((a) => a.type === 'hlsync')
          .forEach((a) => {
            const hc = MARKER_COLORS.find((c) => c.id === a.colorId) || MARKER_COLORS[0];
            ctx.save();
            ctx.globalAlpha = 0.36;
            ctx.fillStyle = hc.hex;
            (a.rects || []).forEach((r) => {
              ctx.fillRect(r.x * canvas.width, r.y * canvas.height, r.w * canvas.width, r.h * canvas.height);
            });
            ctx.restore();
          });

        const strokes = pageAnnotations.filter((a) => a.type === 'pen' || a.type === 'marker');

        const drawOne = (s) => {
          if (!s.points || s.points.length < 2) return;
          const cObj = MARKER_COLORS.find((c) => c.id === s.colorId) || MARKER_COLORS[0];
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = cObj.hex;
          if (s.type === 'marker') {
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = Math.max(14, canvas.width * 0.024);
          } else {
            ctx.globalAlpha = 0.92;
            ctx.lineWidth = Math.max(2.5, canvas.width * 0.0038);
          }
          ctx.beginPath();
          s.points.forEach((pt, idx) => {
            const px = pt.x * canvas.width;
            const py = pt.y * canvas.height;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.stroke();
          ctx.restore();
        };

        strokes.forEach(drawOne);
        if (drawingStrokeRef.current) drawOne(drawingStrokeRef.current);
      }, [pageAnnotations]);

      // 渲染 PDF 底層畫布
      useEffect(() => {
        if (!pdfDoc || !isNearViewport || !pdfCanvasRef.current || !overlayCanvasRef.current) return;
        let renderTask = null;
        let cancelled = false;

        (async () => {
          try {
            const page = await pdfDoc.getPage(pageNumber);
            if (cancelled) return;
            const dpr = window.devicePixelRatio || 1;
            const viewport = page.getViewport({ scale: pdfZoom });
            const w = Math.floor(viewport.width);
            const h = Math.floor(viewport.height);
            setPageSize({ width: w, height: h });

            const canvas = pdfCanvasRef.current;
            const overlay = overlayCanvasRef.current;
            if (!canvas || !overlay) return;

            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;

            overlay.width = Math.floor(w * dpr);
            overlay.height = Math.floor(h * dpr);
            overlay.style.width = `${w}px`;
            overlay.style.height = `${h}px`;

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            renderTask = page.render({ canvasContext: ctx, viewport });
            await renderTask.promise;
            if (!cancelled) redrawStrokes();
          } catch {}
        })();

        return () => {
          cancelled = true;
          if (renderTask?.cancel) renderTask.cancel();
        };
      }, [pdfDoc, pageNumber, pdfZoom, isNearViewport, redrawStrokes]);

      useEffect(() => {
        redrawStrokes();
      }, [redrawStrokes]);

      const getNormPoint = (e) => {
        const el = wrapperRef.current;
        if (!el) return { x: 0.5, y: 0.5 };
        const rect = el.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height))
        };
      };

      const handlePointerDown = (e) => {
        if (e.target.closest('.sticky-note-card')) return;
        const pt = getNormPoint(e);
        if (pdfSpotlightRuler && pdfTool === 'cursor') {
          setRulerYRatio(pt.y);
        }
        if (pdfTool === 'cursor') return;
        e.preventDefault();
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        }

        if (pdfTool === 'note') {
          const newSticky = {
            id: `sticky-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            page: pageNumber,
            type: 'note',
            x: Math.min(0.72, Math.max(0.03, pt.x)),
            y: Math.min(0.82, Math.max(0.03, pt.y)),
            colorId: activeBrushColor,
            text: ''
          };
          onCommitAnnotation(newSticky, true);
          setEditingStickyId(newSticky.id);
          return;
        }

        if (pdfTool === 'eraser') {
          onEraseAtPoint(pageNumber, pt);
          return;
        }

        if (pdfTool === 'pen' || pdfTool === 'marker') {
          const isStraight = drawMode === 'line' || e.shiftKey;
          drawingStrokeRef.current = {
            id: `stroke-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            page: pageNumber,
            type: pdfTool,
            colorId: activeBrushColor,
            isStraight,
            points: [pt, pt]
          };
          redrawStrokes();
        }
      };

      const handlePointerMove = (e) => {
        const pt = getNormPoint(e);

        if (draggingStickyRef.current) {
          const { id, offsetX, offsetY } = draggingStickyRef.current;
          onUpdateAnnotation(
            id,
            {
              x: Math.min(0.78, Math.max(0.01, pt.x - offsetX)),
              y: Math.min(0.86, Math.max(0.01, pt.y - offsetY))
            },
            false
          );
          return;
        }

        if (pdfSpotlightRuler && e.buttons === 1 && pdfTool === 'cursor') {
          setRulerYRatio(pt.y);
        }

        if (pdfTool === 'eraser' && e.buttons === 1) {
          onEraseAtPoint(pageNumber, pt);
          return;
        }

        if (!drawingStrokeRef.current) return;
        const stroke = drawingStrokeRef.current;
        const isStraight = stroke.isStraight || e.shiftKey;

        if (isStraight) {
          const startPt = stroke.points[0];
          let endPt = { ...pt };
          if (e.shiftKey) {
            const dx = Math.abs(endPt.x - startPt.x);
            const dy = Math.abs(endPt.y - startPt.y);
            if (dx > dy) endPt.y = startPt.y;
            else endPt.x = startPt.x;
          }
          stroke.points = [startPt, endPt];
        } else {
          stroke.points.push(pt);
        }
        redrawStrokes();
      };

      const handlePointerUp = () => {
        if (draggingStickyRef.current) {
          draggingStickyRef.current = null;
        }
        if (drawingStrokeRef.current) {
          const finished = drawingStrokeRef.current;
          drawingStrokeRef.current = null;
          if (finished.points.length >= 2) {
            onCommitAnnotation(finished, false);
          }
          redrawStrokes();
        }
      };

      const stickyNotes = pageAnnotations.filter((a) => a.type === 'note');

      return (
        <div
          ref={wrapperRef}
          data-pdf-page={pageNumber}
          style={{ width: `${pageSize.width}px`, height: `${pageSize.height}px` }}
          className="relative shadow-xl rounded-lg bg-white select-none shrink-0 mb-5"
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
        >
          {/* 頁碼浮水印小角標 */}
          <div className="absolute right-2.5 bottom-2 z-10 px-2 py-0.5 rounded bg-black/50 text-white text-[10px] font-mono pointer-events-none">
            P.{pageNumber}
          </div>

          {isNearViewport ? (
            <>
              <canvas ref={pdfCanvasRef} className="block rounded-lg" />
              <canvas
                ref={overlayCanvasRef}
                className={`absolute inset-0 touch-none rounded-lg ${
                  pdfTool === 'cursor' ? 'cursor-default' : 'cursor-crosshair'
                }`}
              />
            </>
          ) : (
            <div className="w-full h-full flex items-center justify-center text-xs text-slate-400">
              載入第 {pageNumber} 頁...
            </div>
          )}

          {/* PDF 便利貼互動渲染圖層 */}
          {stickyNotes.map((note) => {
            const cObj = MARKER_COLORS.find((c) => c.id === note.colorId) || MARKER_COLORS[0];
            const isEditing = editingStickyId === note.id;

            return (
              <div
                key={note.id}
                style={{
                  left: `${note.x * 100}%`,
                  top: `${note.y * 100}%`,
                  borderColor: cObj.hex,
                  backgroundColor: '#fffdf7'
                }}
                onClick={(e) => e.stopPropagation()}
                className="sticky-note-card absolute z-20 w-48 sm:w-52 rounded-xl border-2 shadow-xl text-slate-800 overflow-hidden"
              >
                {/* 便利貼標題列：按住可自由拖曳位置 */}
                <div
                  style={{ backgroundColor: cObj.hex }}
                  onPointerDown={(e) => {
                    e.stopPropagation();
                    const pt = getNormPoint(e);
                    onUpdateAnnotation(note.id, {}, true); // 先推入復原堆疊
                    draggingStickyRef.current = {
                      id: note.id,
                      offsetX: pt.x - note.x,
                      offsetY: pt.y - note.y
                    };
                  }}
                  className="px-2.5 py-1 flex items-center justify-between text-white text-[11px] font-semibold cursor-grab active:cursor-grabbing touch-none"
                  title="按住標題列拖曳移動位置"
                >
                  <span className="flex items-center gap-1">
                    <Icon name="grip" className="w-3 h-3" />
                    <span>便利貼 P.{pageNumber}</span>
                  </span>
                  <div className="flex items-center gap-1">
                    {isEditing && (
                      <button
                        type="button"
                        onPointerDown={(e) => e.stopPropagation()}
                        onClick={() => setEditingStickyId(null)}
                        className="px-1.5 py-0.5 rounded bg-black/20 hover:bg-black/30 text-[10px]"
                      >
                        完成
                      </button>
                    )}
                    <button
                      type="button"
                      onPointerDown={(e) => e.stopPropagation()}
                      onClick={() => onDeleteAnnotation(note.id)}
                      className="p-0.5 rounded hover:bg-black/20"
                      title="刪除此便利貼"
                    >
                      <Icon name="x" className="w-3 h-3" />
                    </button>
                  </div>
                </div>

                {/* 便利貼內容：點擊直接打字即時自動存檔 */}
                <div
                  onClick={() => setEditingStickyId(note.id)}
                  className="p-2 text-xs cursor-text"
                >
                  {isEditing ? (
                    <textarea
                      value={note.text || ''}
                      autoFocus
                      rows={3}
                      placeholder="輸入便利貼內容（自動保存）..."
                      onChange={(e) => onUpdateAnnotation(note.id, { text: e.target.value }, false)}
                      className="w-full bg-transparent text-slate-800 text-xs leading-relaxed outline-none resize-none"
                    />
                  ) : (
                    <div className="min-h-[42px] whitespace-pre-wrap break-words leading-relaxed text-slate-800">
                      {note.text?.trim() ? (
                        note.text
                      ) : (
                        <span className="text-slate-400 italic">點擊輸入筆記...</span>
                      )}
                    </div>
                  )}
                </div>
              </div>
            );
          })}

          {/* ADHD 閱讀尺遮罩 */}
          {pdfSpotlightRuler && (
            <div className="absolute inset-0 pointer-events-none rounded-lg overflow-hidden z-10">
              <div style={{ height: `${Math.max(0, rulerYRatio * 100 - 6)}%`, backgroundColor: 'rgba(30,34,40,0.62)' }} className="w-full" />
              <div style={{ borderColor: '#c8a86b', backgroundColor: 'rgba(200,168,107,0.07)' }} className="h-[12%] w-full border-y-2" />
              <div style={{ backgroundColor: 'rgba(30,34,40,0.62)' }} className="h-full w-full" />
            </div>
          )}
        </div>
      );
    }

    // 自動播放時 App 每一幀都會重繪；用 memo 避免每頁 PDF 被重新渲染（PDF 標註切換更順）
    const PdfPageSurface = React.memo(PdfPageSurfaceBase, (prev, next) => {
      for (const k of Object.keys(next)) {
        if (k === 'onPageVisible') continue;
        if (k === 'pageAnnotations') {
          const a = prev[k];
          const b = next[k];
          if (a.length !== b.length || a.some((x, i) => x !== b[i])) return false;
          continue;
        }
        if (prev[k] !== next[k]) return false;
      }
      return true;
    });

    // =========================================================================
    // 6. 主應用程式組件 App
    // =========================================================================
    function App() {
      const currentOwnerUid = 'local-owner';

      // 第 0 秒從 localStorage 同步讀取 API Key、設定、自訂 Hashtag、資料夾與上次閱讀座標
      const initialSession = useMemo(() => readLSJson(LS_KEYS.SESSION_STATE, {}), []);

      const [geminiApiKey, setGeminiApiKey] = useState(() =>
        (window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim()
      );
      const [geminiKeyDraft, setGeminiKeyDraft] = useState(() =>
        (window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim()
      );

      const [settings, setSettings] = useState(() => ({
        ...DEFAULT_SETTINGS,
        ...(readLSJson(LS_KEYS.SETTINGS, null) || {})
      }));

      // 自訂 Hashtag 清單與管理狀態
      const [customTags, setCustomTags] = useState(() => {
        const saved = readLSJson(LS_KEYS.CUSTOM_TAGS, null);
        return Array.isArray(saved) && saved.length > 0 ? saved : DEFAULT_NOTE_TAGS;
      });
      const [newTagInput, setNewTagInput] = useState('');
      const [cardNewTagInput, setCardNewTagInput] = useState('');

      // 書庫分類資料夾狀態
      const [folders, setFolders] = useState(() => {
        const saved = readLSJson(LS_KEYS.FOLDERS, null);
        return Array.isArray(saved) ? saved : DEFAULT_FOLDERS;
      });
      const [selectedFolderId, setSelectedFolderId] = useState('ALL'); // 'ALL' | 'UNCATEGORIZED' | folder.id
      const [newFolderInput, setNewFolderInput] = useState('');
      const [confirmDeleteFolderId, setConfirmDeleteFolderId] = useState(null);
      const [librarySearch, setLibrarySearch] = useState('');
      const [renamingDocId, setRenamingDocId] = useState(null);
      const [renameDraft, setRenameDraft] = useState('');

      // 書庫與當前文獻
      const [libraryDocs, setLibraryDocs] = useState([]);
      const [activeDocId, setActiveDocId] = useState(initialSession.docId || null);
      const [docMeta, setDocMeta] = useState({
        title: '尚未開啟文獻',
        subtitle: '請匯入 PDF 開始專注閱讀',
        filename: '',
        domainHint: '',
        numPages: 0
      });
      const [docPages, setDocPages] = useState([]);
      const [pdfBytes, setPdfBytes] = useState(null);
      const [pdfDocInstance, setPdfDocInstance] = useState(null);

      // 檢視模式與雙欄可拖曳寬度比例 (20% ~ 80%)
      const [viewMode, setViewMode] = useState(initialSession.viewMode || 'focus'); // 'focus' | 'split' | 'pdf'
      const [splitRatio, setSplitRatio] = useState(() => {
        const r = Number(initialSession.splitRatio);
        return r >= 20 && r <= 80 ? r : 50;
      });
      const [isDraggingSplit, setIsDraggingSplit] = useState(false);

            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying(false);
            setActiveLineIdx((idx) => Math.min(readingLines.length - 1, idx + 1));
          } else if (e.key === 'ArrowUp' || e.key === 'k') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying(false);
            setActiveLineIdx((idx) => Math.max(0, idx - 1));

        if (!currentLine) return;

        const cjkCount = currentLine.text.match(/[\u4e00-\u9fff]/g)?.length || 0;
        const wordCount = currentLine.text.replace(/[\u4e00-\u9fff]/g, ' ').trim().split(/\s+/).filter(Boolean).length;
        const wordEquivalent = Math.max(2, cjkCount * 0.6 + wordCount);
        const durationMs = Math.max(1500, Math.min(14000, (wordEquivalent / settings.wpm) * 60000));

        const startTime = performance.now();
        let rafId;
        const tick = (now) => {
          const elapsed = now - startTime;
          setAutoPlayProgress(Math.min(100, (elapsed / durationMs) * 100));
          if (elapsed >= durationMs) {
            if (activeLineIdx < readingLines.length - 1) {
              setActiveLineIdx((i) => i + 1);
            } else {
              setIsAutoPlaying(false);
              showToast('已完成全文閱讀');

            rafId = requestAnimationFrame(tick);
          }
        };

        e.preventDefault();

          const sidebarEl = container.querySelector('.right-sidebar-panel');
          const availWidth = rect.width - (sidebarEl ? sidebarEl.getBoundingClientRect().width : 0);
          if (availWidth <= 200) return;
          const pct = ((clientX - rect.left) / availWidth) * 100;
          const clamped = Math.min(80, Math.max(20, Math.round(pct * 10) / 10));
          setSplitRatio(clamped);
        };

        const onUp = () => {
          setIsDraggingSplit(false);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);

        window.addEventListener('pointerup', onUp);
