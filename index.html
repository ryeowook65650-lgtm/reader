    // =========================================================================
    // 2. 本機 IndexedDB 儲存引擎
    // =========================================================================
    const IDB_NAME = 'ADHDFocusReader_v4_Master';
    const IDB_VERSION = 1;

    async function requestStoragePersistence() {
      if (navigator.storage && navigator.storage.persist) {
        try { return await navigator.storage.persist(); } catch { return false; }
      }
      return false;
    }

    function openReaderDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('瀏覽器不支援 IndexedDB'));
          return;
        }
        const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('documents')) {
            db.createObjectStore('documents', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('kv')) {
            db.createObjectStore('kv', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGetKV(key, fallback = null) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readonly');
          const req = tx.objectStore('kv').get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : fallback);
          req.onerror = () => resolve(fallback);
        });
      } catch {
        return fallback;
      }
    }

    async function idbSetKV(key, value) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbGetScopedKV(uid, key, fallback = null) {
      const val = await idbGetKV(`${uid}::${key}`, undefined);
      return val !== undefined ? val : fallback;
    }

    async function idbSetScopedKV(uid, key, value) {
      return idbSetKV(`${uid}::${key}`, value);
    }

    async function idbGetAllDocs(uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readonly');
          const req = tx.objectStore('documents').getAll();
          req.onsuccess = () => {
            const list = (req.result || []).filter((d) => (d.ownerUid || 'local-owner') === uid);
            resolve(list);
          };
          req.onerror = () => resolve([]);
        });
      } catch {
        return [];
      }
    }

    async function idbPutDoc(docRecord, uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        const payload = { ...docRecord, ownerUid: uid || docRecord.ownerUid || 'local-owner' };
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').put(payload);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbDeleteDoc(docId) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').delete(docId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    function formatFileSize(bytes) {

    // =========================================================================
    // 4. 超高精準度 PDF 擷取、斷詞斷句與連字號修復引擎
    // =========================================================================
    function splitParagraphIntoSentences(text) {
      if (!text) return [];
      const cleaned = text.replace(/\s+/g, ' ').trim();
      if (!cleaned) return [];
      // 支援中英文複合標點斷句，保護常見縮寫 (e.g., Dr., i.e., et al., Fig. 1)
      const rawParts = cleaned.match(/[^.!?。！？]+(?:[.!?。！？]+['"”’）)]*|\s*$)/g) || [cleaned];
      const merged = [];
      for (const part of rawParts) {
        const trimmed = part.trim();
        if (!trimmed) continue;
        const prev = merged[merged.length - 1];
        if (
          prev &&
          (/(?:\b(?:Dr|Prof|Mr|Mrs|Ms|Jr|Sr|vs|etc|e\.g|i\.e|et al|U\.S|cf|ib|op|p|pp|Fig|No)\.|[0-9]\.)$/i.test(prev) ||
            prev.length < 15)
        ) {
          merged[merged.length - 1] = `${prev} ${trimmed}`;
        } else {
          merged.push(trimmed);
        }
      }
      return merged;
    }

    async function extractStructuredPagesFromPdf(pdfDoc, filterHeaderFooter = true, onProgress = null) {
      const pages = [];
      let totalCharCount = 0;

      for (let p = 1; p <= pdfDoc.numPages; p++) {
        if (onProgress) onProgress(p, pdfDoc.numPages);
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        const pageHeight = viewport.height || 800;
        const pageWidth = viewport.width || 600;
        const textContent = await page.getTextContent();
        const rawItems = textContent.items || [];

        const items = [];
        for (const item of rawItems) {
          const str = (item.str || '').replace(/\u0000/g, '');
          if (!str.trim()) continue;
          const tx = item.transform ? item.transform[4] : 0;
          const ty = item.transform ? item.transform[5] : 0;
          const fontH = Math.max(
            8,
            Math.hypot(item.transform?.[0] || 0, item.transform?.[1] || 0) || item.height || 12
          );

          if (filterHeaderFooter) {
            const isNearEdge = ty > pageHeight * 0.94 || ty < pageHeight * 0.055;
            const isStamp =
              /^https?:\/\//i.test(str.trim()) ||
              /^[-–—]?\s*\d+\s*[-–—]?$/.test(str.trim()) ||
              /^\d+\s*\/\s*\d+$/.test(str.trim());
            if (isNearEdge && isStamp) continue;
          }

          items.push({
            str,
            x: tx,
            y: ty,
            w: item.width || (str.length * fontH * 0.5),
            h: fontH,
            pdfWidth: pageWidth,
            pdfHeight: pageHeight
          });
        }

        if (items.length === 0) {
          pages.push({ pageNumber: p, blocks: [], rawItems: [] });
          continue;
        }

        // 依幾何 y, x 座標精確重組行
        items.sort((a, b) => {
          if (Math.abs(b.y - a.y) > Math.min(a.h, b.h) * 0.45) {
            return b.y - a.y;
          }
          return a.x - b.x;
        });

        const visualLines = [];
        for (const it of items) {
          const lastLine = visualLines[visualLines.length - 1];
          if (lastLine && Math.abs(lastLine.y - it.y) <= Math.max(lastLine.h, it.h) * 0.48) {
            const prevItem = lastLine.items[lastLine.items.length - 1];
            const gap = it.x - (prevItem.x + prevItem.w);
            const isCJK = /[\u4e00-\u9fff]$/.test(lastLine.text) || /^[\u4e00-\u9fff]/.test(it.str);
            
            // 英文自動補空白，CJK 緊鄰不拆開
            const needSpace =
              !isCJK &&
              gap > it.h * 0.16 &&
              !/[\s\-–—/(\[「『（]$/.test(lastLine.text) &&
              !/^[\s.,;:!?%)\]」』）]/.test(it.str);

            // 連字號 (Hyphenation) 跨行重組：例如 "inter-" + "national" -> "international"
            if (/[a-zA-Z]-$/.test(lastLine.text) && /^[a-zA-Z]/.test(it.str)) {
              lastLine.text = lastLine.text.slice(0, -1) + it.str;
            } else {
              lastLine.text += (needSpace ? ' ' : '') + it.str;
            }
            lastLine.items.push(it);
            lastLine.h = Math.max(lastLine.h, it.h);
          } else {
            visualLines.push({
              text: it.str.trim(),
              y: it.y,
              x: it.x,
              h: it.h,
              items: [it]
            });
          }
        }

        const sortedHeights = visualLines.map((l) => l.h).sort((a, b) => a - b);
        const medianH = sortedHeights[Math.floor(sortedHeights.length / 2)] || 12;

        const blocks = [];
        let currentBlock = null;

        for (const line of visualLines) {
          const lineText = line.text.trim();
          if (!lineText) continue;
          totalCharCount += lineText.length;
          const isHeading = line.h >= medianH * 1.25 && lineText.length < 130;

          if (!currentBlock) {
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
            continue;
          }

          const verticalGap = currentBlock.lastY - line.y;
          const paragraphBreak =
            isHeading ||
            currentBlock.type === 'heading' ||
            verticalGap > Math.max(currentBlock.lastH, line.h) * 1.75 ||
            /^(\d+\.|[•·\-▪])\s+/.test(lineText);

          if (paragraphBreak) {
            blocks.push({ type: currentBlock.type, text: currentBlock.text });
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
          } else {
            // 合併跨行段落文字，防止單字被拆斷
            if (/[a-zA-Z]-$/.test(currentBlock.text) && /^[a-zA-Z]/.test(lineText)) {
              currentBlock.text = currentBlock.text.slice(0, -1) + lineText;
            } else {
              const bothCJK =
                /[\u4e00-\u9fff，。；：「」『』（）！？”’]$/.test(currentBlock.text) &&
                /^[\u4e00-\u9fff「『（]/.test(lineText);
              currentBlock.text = `${currentBlock.text}${bothCJK ? '' : ' '}${lineText}`;
            }
            currentBlock.lastY = line.y;
            currentBlock.lastH = line.h;
          }
        }

        if (currentBlock && currentBlock.text.trim()) {
          blocks.push({ type: currentBlock.type, text: currentBlock.text.trim() });
        }
        pages.push({ pageNumber: p, blocks, rawItems: items });
      }

      return { pages, totalCharCount };
    }

    // 免金鑰字典與 Gemini 呼叫函式
    async function fetchKeylessInstantDictionary(queryText) {
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(queryText)}`;
        const res = await fetch(gtxUrl);
        if (res.ok) {
          const data = await res.json();
          const mainTrans = Array.isArray(data?.[0])
            ? data[0].map((seg) => seg?.[0] || '').join('').trim()
            : '';
          let posNote = '';
          if (Array.isArray(data?.[1]) && data[1].length > 0) {
            posNote = data[1].slice(0, 2).map((e) => `${e[0]}：${(e[1] || []).slice(0, 4).join('、')}`).join(' ｜ ');
          }
          if (mainTrans) return { translation: mainTrans, posOrNote: posNote };
        }
      } catch {}

      const isAscii = /^[A-Za-z0-9\s.,'?!:;()-]+$/.test(queryText);
      const mmRes = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(queryText)}&langpair=${isAscii ? 'en|zh-TW' : 'autodetect|zh-TW'}`
      );
      if (!mmRes.ok) throw new Error('公開字典通道忙碌');
      const mmData = await mmRes.json();
      return { translation: mmData?.responseData?.translatedText?.trim() || '查無直譯結果', posOrNote: '' };
    }

    async function callGeminiFlash({
      geminiKey = '',
      systemInstruction = '',
      messages = [],
      thinkingLevelObj = THINKING_LEVELS[2],
      expectJson = false,
      geminiJsonSchema = null
    }) {
      const cleanKey = (geminiKey || localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
      if (!cleanKey) throw new Error('請先設定 Google Gemini API Key');

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${LOCKED_GEMINI_MODEL}:generateContent?key=${encodeURIComponent(cleanKey)}`;
      const contents = messages.map((m) => {
        const parts = [];
        if (m.inlineData) parts.push({ inlineData: m.inlineData });
        if (m.text) parts.push({ text: m.text });
        return { role: m.role === 'assistant' ? 'model' : 'user', parts };
      });

      const generationConfig = {};
      if (expectJson) {
        generationConfig.responseMimeType = 'application/json';
        if (geminiJsonSchema) generationConfig.responseSchema = geminiJsonSchema;
      }
      if (typeof thinkingLevelObj?.geminiBudget === 'number') {
        generationConfig.thinkingConfig = { thinkingBudget: thinkingLevelObj.geminiBudget };
      }

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents,
          ...(systemInstruction ? { systemInstruction: { parts: [{ text: systemInstruction }] } } : {}),
          ...(Object.keys(generationConfig).length > 0 ? { generationConfig } : {})
        })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data?.error?.message || `Gemini 連線錯誤 (${res.status})`);
      const parts = data?.candidates?.[0]?.content?.parts || [];
      let thought = '';
      let text = '';
      for (const p of parts) {
        if (p.thought) thought += p.text || '';
        else text += p.text || '';
      }
      return { text: text.trim(), thought: thought.trim() };
    }

    // =========================================================================
    // 5. PDF 單頁渲染畫布組件
    // =========================================================================
    function PdfPageSurface({
      pdfDoc,
      pageNumber,
      pdfZoom,
      pdfTool,
      drawMode,
      activeBrushColor,
      pageAnnotations,
      onCommitAnnotation,
      onUpdateAnnotation,
      onDeleteAnnotation,
      onEraseAtPoint,
      pdfSpotlightRuler,
      rulerYRatio,
      setRulerYRatio,
      onPageVisible,
      scrollRootRef
    }) {
      const wrapperRef = useRef(null);
      const pdfCanvasRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const drawingStrokeRef = useRef(null);
      const draggingStickyRef = useRef(null);

      const [isNearViewport, setIsNearViewport] = useState(pageNumber <= 3);
      const [pageSize, setPageSize] = useState({ width: Math.round(595 * pdfZoom), height: Math.round(842 * pdfZoom) });
      const [editingStickyId, setEditingStickyId] = useState(null);

      useEffect(() => {
        const el = wrapperRef.current;
        if (!el) return;
        const rootEl = scrollRootRef?.current || null;

        const lazyObs = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) setIsNearViewport(true);
            });
          },
          { root: rootEl, rootMargin: '800px 0px' }
        );

        const activePageObs = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
                onPageVisible?.(pageNumber);
              }
            });
          },
          { root: rootEl, threshold: [0.35, 0.65] }
        );

        lazyObs.observe(el);
        activePageObs.observe(el);
        return () => {
          lazyObs.disconnect();
          activePageObs.disconnect();
        };
      }, [pageNumber, onPageVisible, scrollRootRef]);

      const redrawStrokes = useCallback(() => {
        const canvas = overlayCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const strokes = pageAnnotations.filter((a) => a.type === 'pen' || a.type === 'marker');

        const drawOne = (s) => {
          if (!s.points || s.points.length < 2) return;
          const cObj = MARKER_COLORS.find((c) => c.id === s.colorId) || MARKER_COLORS[0];
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = cObj.hex;
          if (s.type === 'marker') {
            ctx.globalAlpha = 0.38;
            ctx.lineWidth = Math.max(14, canvas.width * 0.024);
          } else {
            ctx.globalAlpha = 0.92;
            ctx.lineWidth = Math.max(2.5, canvas.width * 0.0038);
          }
          ctx.beginPath();
          s.points.forEach((pt, idx) => {
            const px = pt.x * canvas.width;
            const py = pt.y * canvas.height;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.stroke();
          ctx.restore();
        };

        strokes.forEach(drawOne);
        if (drawingStrokeRef.current) drawOne(drawingStrokeRef.current);
      }, [pageAnnotations]);

      useEffect(() => {
        if (!pdfDoc || !isNearViewport || !pdfCanvasRef.current || !overlayCanvasRef.current) return;
        let renderTask = null;
        let cancelled = false;

        (async () => {
          try {
            const page = await pdfDoc.getPage(pageNumber);
            if (cancelled) return;
            const dpr = window.devicePixelRatio || 1;
            const viewport = page.getViewport({ scale: pdfZoom });
            const w = Math.floor(viewport.width);
            const h = Math.floor(viewport.height);
            setPageSize({ width: w, height: h });

            const canvas = pdfCanvasRef.current;
            const overlay = overlayCanvasRef.current;
            if (!canvas || !overlay) return;

            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;

            overlay.width = Math.floor(w * dpr);
            overlay.height = Math.floor(h * dpr);
            overlay.style.width = `${w}px`;
            overlay.style.height = `${h}px`;

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            renderTask = page.render({ canvasContext: ctx, viewport });
            await renderTask.promise;
            if (!cancelled) redrawStrokes();
          } catch {}
        })();

        return () => {
          cancelled = true;
          if (renderTask?.cancel) renderTask.cancel();
        };
      }, [pdfDoc, pageNumber, pdfZoom, isNearViewport, redrawStrokes]);

      useEffect(() => {
        redrawStrokes();
      }, [redrawStrokes]);

      const getNormPoint = (e) => {
        const el = wrapperRef.current;
        if (!el) return { x: 0.5, y: 0.5 };
        const rect = el.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height))
        };
      };

      const handlePointerDown = (e) => {
        if (e.target.closest('.sticky-note-card')) return;
        const pt = getNormPoint(e);
        if (pdfSpotlightRuler && pdfTool === 'cursor') setRulerYRatio(pt.y);
        if (pdfTool === 'cursor') return;
        e.preventDefault();

        if (pdfTool === 'note') {
          const newSticky = {
            id: `sticky-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            page: pageNumber,
            type: 'note',
            x: Math.min(0.72, Math.max(0.03, pt.x)),
            y: Math.min(0.82, Math.max(0.03, pt.y)),
            colorId: activeBrushColor,
            text: ''
          };
          onCommitAnnotation(newSticky, true);
          setEditingStickyId(newSticky.id);
          return;
        }

        if (pdfTool === 'eraser') {
          onEraseAtPoint(pageNumber, pt);
          return;
        }

        if (pdfTool === 'pen' || pdfTool === 'marker') {
          const isStraight = drawMode === 'line' || e.shiftKey;
          drawingStrokeRef.current = {
            id: `stroke-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            page: pageNumber,
            type: pdfTool,
            colorId: activeBrushColor,
            isStraight,
            points: [pt, pt]
          };
          redrawStrokes();
        }
      };

      const handlePointerMove = (e) => {
        const pt = getNormPoint(e);

        if (draggingStickyRef.current) {
          const { id, offsetX, offsetY } = draggingStickyRef.current;
          onUpdateAnnotation(
            id,
            {
              x: Math.min(0.78, Math.max(0.01, pt.x - offsetX)),
              y: Math.min(0.86, Math.max(0.01, pt.y - offsetY))
            },
            false
          );
          return;
        }

        if (pdfSpotlightRuler && e.buttons === 1 && pdfTool === 'cursor') {
          setRulerYRatio(pt.y);
        }

        if (pdfTool === 'eraser' && e.buttons === 1) {
          onEraseAtPoint(pageNumber, pt);
          return;
        }

        if (!drawingStrokeRef.current) return;
        const stroke = drawingStrokeRef.current;
        const isStraight = stroke.isStraight || e.shiftKey;

        if (isStraight) {
          const startPt = stroke.points[0];
          let endPt = { ...pt };
          if (e.shiftKey) {
            const dx = Math.abs(endPt.x - startPt.x);
            const dy = Math.abs(endPt.y - startPt.y);
            if (dx > dy) endPt.y = startPt.y;
            else endPt.x = startPt.x;
          }
          stroke.points = [startPt, endPt];
        } else {
          stroke.points.push(pt);
        }
        redrawStrokes();
      };

      const handlePointerUp = () => {
        if (draggingStickyRef.current) draggingStickyRef.current = null;
        if (drawingStrokeRef.current) {
          const finished = drawingStrokeRef.current;
          drawingStrokeRef.current = null;
          if (finished.points.length >= 2) onCommitAnnotation(finished, false);
          redrawStrokes();
        }
      };

      const stickyNotes = pageAnnotations.filter((a) => a.type === 'note');

      return (
        <div
          ref={wrapperRef}
          data-pdf-page={pageNumber}
          style={{ width: `${pageSize.width}px`, height: `${pageSize.height}px` }}
          className="relative shadow-xl rounded-lg bg-white select-none shrink-0 mb-5"
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
        >
          <div className="absolute right-2.5 bottom-2 z-10 px-2 py-0.5 rounded bg-black/50 text-white text-[10px] font-mono pointer-events-none">
            P.{pageNumber}
          </div>

          {isNearViewport ? (
            <>
              <canvas ref={pdfCanvasRef} className="block rounded-lg" />
              <canvas
                ref={overlayCanvasRef}
                className={`absolute inset-0 touch-none rounded-lg ${
                  pdfTool === 'cursor' ? 'cursor-default' : 'cursor-crosshair'
                }`}
              />
            </>
          ) : (
            <div className="w-full h-full flex items-center justify-center text-xs text-slate-400">
              載入第 {pageNumber} 頁...
            </div>
          )}

          {stickyNotes.map((note) => {
            const cObj = MARKER_COLORS.find((c) => c.id === note.colorId) || MARKER_COLORS[0];
            const isEditing = editingStickyId === note.id;

            return (
              <div
                key={note.id}
                style={{
                  left: `${note.x * 100}%`,
                  top: `${note.y * 100}%`,
                  borderColor: cObj.hex,
                  backgroundColor: '#fffdf7'
                }}
                onClick={(e) => e.stopPropagation()}
                className="sticky-note-card absolute z-20 w-48 sm:w-52 rounded-xl border-2 shadow-xl text-slate-800 overflow-hidden"
              >
                <div
                  style={{ backgroundColor: cObj.hex }}
                  onPointerDown={(e) => {
                    e.stopPropagation();
                    const pt = getNormPoint(e);
                    onUpdateAnnotation(note.id, {}, true);
                    draggingStickyRef.current = {
                      id: note.id,
                      offsetX: pt.x - note.x,
                      offsetY: pt.y - note.y
                    };
                  }}
                  className="px-2.5 py-1 flex items-center justify-between text-white text-[11px] font-semibold cursor-grab active:cursor-grabbing touch-none"
                >
                  <span className="flex items-center gap-1">
                    <Icon name="grip" className="w-3 h-3" />
                    <span>便利貼 P.{pageNumber}</span>
                  </span>
                  <div className="flex items-center gap-1">
                    {isEditing && (
                      <button
                        type="button"
                        onClick={() => setEditingStickyId(null)}
                        className="px-1.5 py-0.5 rounded bg-black/20 hover:bg-black/30 text-[10px]"
                      >
                        完成
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => onDeleteAnnotation(note.id)}
                      className="p-0.5 rounded hover:bg-black/20"
                    >
                      <Icon name="x" className="w-3 h-3" />
                    </button>
                  </div>
                </div>

                <div onClick={() => setEditingStickyId(note.id)} className="p-2 text-xs cursor-text">
                  {isEditing ? (
                    <textarea
                      value={note.text || ''}
                      autoFocus
                      rows={3}
                      placeholder="輸入便利貼內容..."
                      onChange={(e) => onUpdateAnnotation(note.id, { text: e.target.value }, false)}
                      className="w-full bg-transparent text-slate-800 text-xs leading-relaxed outline-none resize-none"
                    />
                  ) : (
                    <div className="min-h-[42px] whitespace-pre-wrap break-words leading-relaxed text-slate-800">
                      {note.text?.trim() ? note.text : <span className="text-slate-400 italic">點擊輸入筆記...</span>}
                    </div>
                  )}
                </div>
              </div>
            );
          })}

          {pdfSpotlightRuler && (
            <div className="absolute inset-0 pointer-events-none rounded-lg overflow-hidden z-10">
              <div style={{ height: `${Math.max(0, rulerYRatio * 100 - 6)}%`, backgroundColor: 'rgba(30,34,40,0.62)' }} className="w-full" />
              <div style={{ borderColor: '#c8a86b', backgroundColor: 'rgba(200,168,107,0.07)' }} className="h-[12%] w-full border-y-2" />
              <div style={{ backgroundColor: 'rgba(30,34,40,0.62)' }} className="h-full w-full" />
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. 主應用程式組件 App
    // =========================================================================
    function App() {
      const currentOwnerUid = 'local-owner';
      const initialSession = useMemo(() => readLSJson(LS_KEYS.SESSION_STATE, {}), []);

      const [geminiApiKey, setGeminiApiKey] = useState(() =>
        (window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim()
      );
      const [geminiKeyDraft, setGeminiKeyDraft] = useState(() =>
        (window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim()
      );

      const [settings, setSettings] = useState(() => ({
        ...DEFAULT_SETTINGS,
        ...(readLSJson(LS_KEYS.SETTINGS, null) || {})

      // 自訂 Hashtag 清單
      const [customTags, setCustomTags] = useState(() => {
        const saved = readLSJson(LS_KEYS.CUSTOM_TAGS, null);

      const [folders, setFolders] = useState(() => {
        const saved = readLSJson(LS_KEYS.FOLDERS, null);
        return Array.isArray(saved) ? saved : DEFAULT_FOLDERS;
      });
      const [selectedFolderId, setSelectedFolderId] = useState('ALL');
      const [newFolderInput, setNewFolderInput] = useState('');
      const [confirmDeleteFolderId, setConfirmDeleteFolderId] = useState(null); // 分類資料夾刪除二次確認
      const [librarySearchQuery, setLibrarySearchQuery] = useState(''); // 書庫關鍵字搜尋
      const [editingDocId, setEditingDocId] = useState(null); // 書庫就地重新命名
      const [editingDocTitleDraft, setEditingDocTitleDraft] = useState('');

      // 書庫與當前文獻
      const [libraryDocs, setLibraryDocs] = useState([]);
      const [activeDocId, setActiveDocId] = useState(initialSession.docId || null);
      const [docMeta, setDocMeta] = useState({
        title: '尚未開啟文獻',
        subtitle: '請匯入 PDF 開始專注閱讀',
        filename: '',
        domainHint: '',
        numPages: 0
      });
      const [docPages, setDocPages] = useState([]);
      const [pdfBytes, setPdfBytes] = useState(null);
      const [pdfDocInstance, setPdfDocInstance] = useState(null);

      // 檢視模式與雙欄寬度
      const [viewMode, setViewMode] = useState(initialSession.viewMode || 'focus');
      const [splitRatio, setSplitRatio] = useState(() => {
        const r = Number(initialSession.splitRatio);
        return r >= 20 && r <= 80 ? r : 50;
      });
      const [isDraggingSplit, setIsDraggingSplit] = useState(false);

      // 選單面板
      const [showLibraryMenu, setShowLibraryMenu] = useState(false);
      const [confirmDeleteDocId, setConfirmDeleteDocId] = useState(null);
      const [showSettingsPanel, setShowSettingsPanel] = useState(false);
      const [showRightSidebar, setShowRightSidebar] = useState(false);
      const [sidebarTab, setSidebarTab] = useState('highlights');
      const [showAccountModal, setShowAccountModal] = useState(false);

      // 聚光燈行
      const [activeLineIdx, setActiveLineIdx] = useState(initialSession.activeLineIdx || 0);
      const [isAutoPlaying, setIsAutoPlaying] = useState(false);
      const [autoPlayProgress, setAutoPlayProgress] = useState(0);
      const [pulseLineId, setPulseLineId] = useState(null);

      // 筆記與標註（支援多層級母子隸屬關係 & 收合/展開）
      const [inlineNotes, setInlineNotes] = useState({});
      const [editingInlineLineId, setEditingInlineLineId] = useState(null);
      const [textHighlights, setTextHighlights] = useState([]);
      const [selectedTagFilter, setSelectedTagFilter] = useState('ALL');
      const [selectedColorFilter, setSelectedColorFilter] = useState('ALL'); // 依顏色篩選
      const [expandedHlIds, setExpandedHlIds] = useState({}); // 卡片收合/展開集合
      const [editingHlNoteId, setEditingHlNoteId] = useState(null);
      const [cardNewTagInput, setCardNewTagInput] = useState('');

      // 反白查詞浮窗
      const [selectionPopover, setSelectionPopover] = useState(null);
      const quickTransCacheRef = useRef({});
      const quickReqIdRef = useRef(0);
      const transDebounceRef = useRef(null);

      // PDF 標註與復原
      const [pdfAnnotations, setPdfAnnotations] = useState([]);
      const [undoStack, setUndoStack] = useState([]);
      const [currentPdfPage, setCurrentPdfPage] = useState(initialSession.currentPdfPage || 1);
      const [pdfZoom, setPdfZoom] = useState(1.1);
      const [pdfTool, setPdfTool] = useState('cursor');
      const [drawMode, setDrawMode] = useState('free');
      const [activeBrushColor, setActiveBrushColor] = useState('terracotta');
      const [pdfSpotlightRuler, setPdfSpotlightRuler] = useState(false);
      const [rulerYRatio, setRulerYRatio] = useState(0.38);
      const [isOcrLoading, setIsOcrLoading] = useState(false);
      const [isExportingPdf, setIsExportingPdf] = useState(false);

      // AI 對話
      const [quotedContext, setQuotedContext] = useState(null);
      const [thinkingLevel, setThinkingLevel] = useState('medium');
      const [chatMessages, setChatMessages] = useState(DEFAULT_WELCOME_MESSAGES());
      const [chatInput, setChatInput] = useState('');
      const [isChatSending, setIsChatSending] = useState(false);

      // 系統提示
      const [toastMsg, setToastMsg] = useState('');
      const [importProgressText, setImportProgressText] = useState('');
      const [dbInitialized, setDbInitialized] = useState(false);

      // DOM Refs
      const fileInputRef = useRef(null);
      const backupInputRef = useRef(null);
      const workspaceRef = useRef(null);
      const leftScrollRef = useRef(null);
      const pdfScrollRef = useRef(null);
      const lineRefs = useRef({});
      const longPressTimerRef = useRef(null);
      const chatEndRef = useRef(null);
      const toastTimerRef = useRef(null);
      const skipNextAutoScrollRef = useRef(false);
      const initialScrollRestoredRef = useRef(false);

      const currentTheme = THEMES[settings.theme] || THEMES.slate;
      const hasActiveApiKey = Boolean(geminiApiKey.trim());

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToastMsg(''), 3200);
      }, []);

      useEffect(() => { requestStoragePersistence(); }, []);
      useEffect(() => { document.body.className = currentTheme.className; }, [currentTheme.className]);
      useEffect(() => {
        writeLSJson(LS_KEYS.SETTINGS, settings);
        if (dbInitialized) idbSetScopedKV(currentOwnerUid, 'settings', settings);
      }, [settings, dbInitialized]);
      useEffect(() => {
        writeLSJson(LS_KEYS.CUSTOM_TAGS, customTags);
        if (dbInitialized) idbSetScopedKV(currentOwnerUid, 'customTags', customTags);
      }, [customTags, dbInitialized]);
      useEffect(() => {
        writeLSJson(LS_KEYS.FOLDERS, folders);
        if (dbInitialized) idbSetScopedKV(currentOwnerUid, 'folders', folders);
      }, [folders, dbInitialized]);

      const saveApiKeyPermanently = useCallback(async (rawKey) => {
        const clean = (rawKey || '').trim();
        setGeminiApiKey(clean);
        setGeminiKeyDraft(clean);
        try { window.localStorage.setItem(LS_KEYS.API_KEY, clean); } catch {}
        await idbSetScopedKV(currentOwnerUid, 'geminiApiKey', clean);
      }, []);

      // 多頁文字扁平化陣列
      const readingLines = useMemo(() => {
        const result = [];
        for (const page of docPages || []) {
          const pNum = page.pageNumber || 1;
          (page.blocks || []).forEach((block, bIdx) => {
            if (!block?.text?.trim()) return;
            if (block.type === 'heading' || settings.granularity === 'paragraph') {
              result.push({
                id: `p${pNum}-b${bIdx}-s0`,
                pageNumber: pNum,
                type: block.type || 'paragraph',
                text: block.text.trim(),
                paragraphContext: block.text.trim()
              });
            } else {
              const sentences = splitParagraphIntoSentences(block.text);
              sentences.forEach((sent, sIdx) => {
                result.push({
                  id: `p${pNum}-b${bIdx}-s${sIdx}`,
                  pageNumber: pNum,
                  type: block.type || 'paragraph',
                  text: sent,
                  paragraphContext: block.text.trim()
                });
              });
            }
          });
        }
        return result;
      }, [docPages, settings.granularity]);

      const persistSessionPosition = useCallback((overrides = {}) => {
        const current = readLSJson(LS_KEYS.SESSION_STATE, {});
        const next = {
          ...current,
          docId: activeDocId,
          activeLineIdx,
          viewMode,
          splitRatio,
          currentPdfPage,
          leftScrollTop: leftScrollRef.current ? leftScrollRef.current.scrollTop : (current.leftScrollTop || 0),
          pdfScrollTop: pdfScrollRef.current ? pdfScrollRef.current.scrollTop : (current.pdfScrollTop || 0),
          ...overrides
        };
        writeLSJson(LS_KEYS.SESSION_STATE, next);
      }, [activeDocId, activeLineIdx, viewMode, splitRatio, currentPdfPage]);

      useEffect(() => {
        if (!dbInitialized) return;
        persistSessionPosition();
      }, [dbInitialized, activeDocId, activeLineIdx, viewMode, splitRatio, currentPdfPage, persistSessionPosition]);

      const jumpToPdfPage = useCallback((pageNum, smooth = true) => {
        const safeP = Math.max(1, Math.min(docMeta.numPages || 1, pageNum));
        setCurrentPdfPage(safeP);
        if (settings.pdfContinuousScroll && pdfScrollRef.current) {
          const targetEl = pdfScrollRef.current.querySelector(`[data-pdf-page="${safeP}"]`);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          }
        }
      }, [docMeta.numPages, settings.pdfContinuousScroll]);

      useEffect(() => {
        if (skipNextAutoScrollRef.current) {
          skipNextAutoScrollRef.current = false;
          return;
        }
        const currentLine = readingLines[activeLineIdx];
        if (!currentLine) return;
        const el = lineRefs.current[activeLineIdx];
        if (el && viewMode !== 'pdf') {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (viewMode === 'split' && currentLine.pageNumber && currentLine.pageNumber !== currentPdfPage) {
          jumpToPdfPage(currentLine.pageNumber, true);
        }
      }, [activeLineIdx, readingLines, viewMode]);

      useEffect(() => {
        if (showRightSidebar && sidebarTab === 'ai') {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, showRightSidebar, sidebarTab]);

      // 載入文獻記錄
      const activateDocumentRecord = useCallback(async (docRecord, restoreScrollFromSession = false) => {
        setIsAutoPlaying(false);
        setSelectionPopover(null);
        setConfirmDeleteDocId(null);
        setEditingInlineLineId(null);
        setEditingHlNoteId(null);
        setPulseLineId(null);
        setUndoStack([]);

        if (!docRecord) {
          setActiveDocId(null);
          setDocMeta({
            title: '尚未開啟文獻',
            subtitle: '請匯入 PDF 開始專注閱讀',
            filename: '',
            domainHint: '',
            numPages: 0
          });
          setDocPages([]);
          setPdfBytes(null);
          setPdfDocInstance(null);
          setTextHighlights([]);
          setInlineNotes({});
          setPdfAnnotations([]);
          setChatMessages(DEFAULT_WELCOME_MESSAGES());
          await idbSetScopedKV(currentOwnerUid, 'activeDocId', null);
          return;
        }

        const session = readLSJson(LS_KEYS.SESSION_STATE, {});
        const isSameSessionDoc = restoreScrollFromSession && session.docId === docRecord.id;
        if (isSameSessionDoc) skipNextAutoScrollRef.current = true;

        setActiveDocId(docRecord.id);
        setDocMeta({
          title: docRecord.title,
          subtitle: docRecord.subtitle || `共 ${docRecord.pages?.length || 1} 頁`,
          filename: docRecord.filename || `${docRecord.title}.pdf`,
          domainHint: docRecord.domainHint || '學術與專業閱讀文本',
          numPages: docRecord.numPages || docRecord.pages?.length || 1
        });
        setDocPages(docRecord.pages || []);
        setActiveLineIdx(
          isSameSessionDoc && typeof session.activeLineIdx === 'number'
            ? session.activeLineIdx
            : (docRecord.activeLineIdx || 0)
        );
        setCurrentPdfPage(
          isSameSessionDoc && typeof session.currentPdfPage === 'number'
            ? session.currentPdfPage
            : 1
        );
        setTextHighlights(docRecord.textHighlights || []);
        setInlineNotes(docRecord.inlineNotes || {});
        setPdfAnnotations(docRecord.pdfAnnotations || []);
        setChatMessages(
          docRecord.chatMessages?.length > 0 ? docRecord.chatMessages : DEFAULT_WELCOME_MESSAGES()
        );

        await idbSetScopedKV(currentOwnerUid, 'activeDocId', docRecord.id);

        if (window.pdfjsLib && docRecord.pdfBytes) {
          const bytes = docRecord.pdfBytes instanceof Uint8Array
            ? docRecord.pdfBytes
            : new Uint8Array(docRecord.pdfBytes);
          setPdfBytes(bytes);
          try {
            const loadedPdf = await window.pdfjsLib.getDocument({
              data: bytes.slice(0),
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
              standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            }).promise;
            setPdfDocInstance(loadedPdf);
          } catch {
            setPdfDocInstance(null);
          }
        } else {
          setPdfBytes(null);
          setPdfDocInstance(null);
        }

        if (isSameSessionDoc) {
          requestAnimationFrame(() => {
            setTimeout(() => {
              if (leftScrollRef.current && typeof session.leftScrollTop === 'number') {
                leftScrollRef.current.scrollTop = session.leftScrollTop;
              }
              if (pdfScrollRef.current && typeof session.pdfScrollTop === 'number') {
                pdfScrollRef.current.scrollTop = session.pdfScrollTop;
              }
              initialScrollRestoredRef.current = true;
            }, 80);
          });
        }
      }, []);

      // 初始化資料庫
      useEffect(() => {
        let mounted = true;
        async function bootstrap() {
          const [
            idbKey,
            idbSettings,
            idbTags,
            idbFolders,
            savedTransCache,
            savedActiveId,
            storedDocs
          ] = await Promise.all([
            idbGetScopedKV(currentOwnerUid, 'geminiApiKey', ''),
            idbGetScopedKV(currentOwnerUid, 'settings', null),
            idbGetScopedKV(currentOwnerUid, 'customTags', null),
            idbGetScopedKV(currentOwnerUid, 'folders', null),
            idbGetScopedKV(currentOwnerUid, 'quickTransCache', {}),
            idbGetScopedKV(currentOwnerUid, 'activeDocId', null),
            idbGetAllDocs(currentOwnerUid)
          ]);

          if (!mounted) return;

          const lsKey = (window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
          if (!lsKey && idbKey) await saveApiKeyPermanently(idbKey);
          else if (lsKey && lsKey !== idbKey) idbSetScopedKV(currentOwnerUid, 'geminiApiKey', lsKey);

          if (!window.localStorage.getItem(LS_KEYS.SETTINGS) && idbSettings) {
            setSettings((prev) => ({ ...prev, ...idbSettings }));
          }
          if (!window.localStorage.getItem(LS_KEYS.CUSTOM_TAGS) && Array.isArray(idbTags) && idbTags.length) {
            setCustomTags(idbTags);
          }
          if (!window.localStorage.getItem(LS_KEYS.FOLDERS) && Array.isArray(idbFolders)) {
            setFolders(idbFolders);
          }

          quickTransCacheRef.current = savedTransCache && typeof savedTransCache === 'object' ? savedTransCache : {};
          const sortedDocs = (storedDocs || []).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          setLibraryDocs(sortedDocs);

          const session = readLSJson(LS_KEYS.SESSION_STATE, {});
          const preferredId = session.docId || savedActiveId;
          const targetDoc = sortedDocs.find((d) => d.id === preferredId) || sortedDocs[0] || null;
          await activateDocumentRecord(targetDoc, true);
          if (mounted) setDbInitialized(true);
        }
        bootstrap();
        return () => { mounted = false; };
      }, [activateDocumentRecord, saveApiKeyPermanently]);

      // 自動持久存檔
      useEffect(() => {
        if (!dbInitialized || !activeDocId) return;
        const timer = setTimeout(() => {
          const total = Math.max(1, readingLines.length);
          const progressPct = Math.min(100, Math.round(((activeLineIdx + 1) / total) * 100));

          setLibraryDocs((prev) => {
            const target = prev.find((d) => d.id === activeDocId);
            if (!target) return prev;
            const updated = {
              ...target,
              ownerUid: currentOwnerUid,
              title: docMeta.title,
              filename: docMeta.filename,
              activeLineIdx,
              progressPct,
              textHighlights,
              inlineNotes,
              pdfAnnotations,
              chatMessages
            };
            idbPutDoc(updated, currentOwnerUid);
            return prev.map((d) => (d.id === activeDocId ? updated : d));
          });
        }, 300);
        return () => clearTimeout(timer);
      }, [dbInitialized, activeDocId, docMeta.title, docMeta.filename, activeLineIdx, readingLines.length, textHighlights, inlineNotes, pdfAnnotations, chatMessages]);

      // 復原 PDF 標註
      const handleUndoPdfAnnotation = useCallback(() => {
        setUndoStack((prevStack) => {
          if (prevStack.length === 0) {
            showToast('已無可復原的步驟');
            return prevStack;
          }
          const previousState = prevStack[prevStack.length - 1];
          setPdfAnnotations(previousState);
          showToast('已復原上一步標註');
          return prevStack.slice(0, -1);
        });
      }, [showToast]);

      const commitPdfAnnotation = useCallback((newAnn, switchToCursor = false) => {
        setPdfAnnotations((prev) => {
          setUndoStack((stk) => [...stk.slice(-49), prev]);
          return [...prev, newAnn];
        });
        if (switchToCursor) setPdfTool('cursor');
      }, []);

      const updatePdfAnnotation = useCallback((id, patch, pushUndo = false) => {
        setPdfAnnotations((prev) => {
          if (pushUndo) setUndoStack((stk) => [...stk.slice(-49), prev]);
          if (!patch || Object.keys(patch).length === 0) return prev;
          return prev.map((a) => (a.id === id ? { ...a, ...patch } : a));
        });
      }, []);

      const deletePdfAnnotation = useCallback((id) => {
        setPdfAnnotations((prev) => {
          setUndoStack((stk) => [...stk.slice(-49), prev]);
          return prev.filter((a) => a.id !== id);
        });
      }, []);

      const erasePdfAnnotationAtPoint = useCallback((pageNum, pt) => {
        setPdfAnnotations((prev) => {
          const filtered = prev.filter((ann) => {
            if (ann.page !== pageNum) return true;
            if (ann.type === 'note') return Math.hypot(ann.x - pt.x, ann.y - pt.y) > 0.06;
            return !(ann.points || []).some((p) => Math.hypot(p.x - pt.x, p.y - pt.y) < 0.035);
          });
          if (filtered.length !== prev.length) setUndoStack((stk) => [...stk.slice(-49), prev]);
          return filtered;
        });
      }, []);

      // 鍵盤快捷鍵
      useEffect(() => {
        const onKeyDown = (e) => {
          const tag = document.activeElement?.tagName?.toLowerCase();
          const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';

          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !isTyping) {
            if (viewMode !== 'focus' && undoStack.length > 0) {
              e.preventDefault();
              handleUndoPdfAnnotation();
              return;
            }
          }

          if (isTyping) return;

          if (e.key === 'ArrowDown' || e.key === 'j') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying(false);
            setActiveLineIdx((idx) => Math.min(readingLines.length - 1, idx + 1));
          } else if (e.key === 'ArrowUp' || e.key === 'k') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying(false);
            setActiveLineIdx((idx) => Math.max(0, idx - 1));
          } else if (e.code === 'Space') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying((p) => !p);
          } else if (e.key === 'Escape') {
            setSelectionPopover(null);
            setShowLibraryMenu(false);
            setShowSettingsPanel(false);
            setConfirmDeleteFolderId(null);
            setConfirmDeleteTag(null);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [readingLines.length, viewMode, undoStack.length, handleUndoPdfAnnotation]);

      // 自動播放配速
      useEffect(() => {
        if (!isAutoPlaying || readingLines.length === 0) {
          setAutoPlayProgress(0);
          return;
        }
        const currentLine = readingLines[activeLineIdx];
        if (!currentLine) return;

        const cjkCount = currentLine.text.match(/[\u4e00-\u9fff]/g)?.length || 0;
        const wordCount = currentLine.text.replace(/[\u4e00-\u9fff]/g, ' ').trim().split(/\s+/).filter(Boolean).length;
        const wordEquivalent = Math.max(2, cjkCount * 0.6 + wordCount);
        const durationMs = Math.max(1500, Math.min(14000, (wordEquivalent / settings.wpm) * 60000));

        const startTime = performance.now();
        let rafId;
        const tick = (now) => {
          const elapsed = now - startTime;
          setAutoPlayProgress(Math.min(100, (elapsed / durationMs) * 100));
          if (elapsed >= durationMs) {
            if (activeLineIdx < readingLines.length - 1) {
              setActiveLineIdx((i) => i + 1);
            } else {
              setIsAutoPlaying(false);
              showToast('已完成全文閱讀');
            }
          } else {
            rafId = requestAnimationFrame(tick);
          }
        };
        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [isAutoPlaying, activeLineIdx, readingLines, settings.wpm, showToast]);

      // 雙欄手動拖曳
      const handleSplitDividerPointerDown = (e) => {
        e.preventDefault();
        setIsDraggingSplit(true);
        const onMove = (moveEvt) => {
          const container = workspaceRef.current;
          if (!container) return;
          const rect = container.getBoundingClientRect();
          const clientX = moveEvt.touches ? moveEvt.touches[0].clientX : moveEvt.clientX;
          const sidebarEl = container.querySelector('.right-sidebar-panel');
          const availWidth = rect.width - (sidebarEl ? sidebarEl.getBoundingClientRect().width : 0);
          if (availWidth <= 200) return;
          const pct = ((clientX - rect.left) / availWidth) * 100;
          setSplitRatio(Math.min(80, Math.max(20, Math.round(pct * 10) / 10)));
        };
        const onUp = () => {
          setIsDraggingSplit(false);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      };

      // =======================================================================
      // 【全新核心功能】：文字顏色標註手動同步至 PDF 同句子（座標自動比對＋烙印）
      // =======================================================================
      const handleSyncHighlightsToPdf = useCallback(() => {
        if (!pdfDocInstance || textHighlights.length === 0) {
          showToast('尚無文字重點標註可同步');
          return;
        }

        const newStrokes = [];
        let matchCount = 0;

        for (const hl of textHighlights) {
          const pNum = hl.pageNumber || 1;
          const pageData = docPages.find((p) => p.pageNumber === pNum);
          if (!pageData || !pageData.rawItems || pageData.rawItems.length === 0) continue;

          const quoteClean = (hl.quote || '').replace(/\s+/g, '');
          if (quoteClean.length < 2) continue;

          // 尋找涵蓋此重點的原始文字區塊
          let accumulated = '';
          let matchedItems = [];

          for (const item of pageData.rawItems) {
            const strClean = item.str.replace(/\s+/g, '');
            if (!strClean) continue;
            accumulated += strClean;
            matchedItems.push(item);

            if (accumulated.includes(quoteClean)) {
              // 取得這批 matchedItems 的幾何跨度
              const targetItems = matchedItems.slice(-Math.max(1, Math.ceil(quoteClean.length / 2)));
              const pw = targetItems[0].pdfWidth || 600;
              const ph = targetItems[0].pdfHeight || 800;

              // 依行群組繪製莫蘭迪標記
              const yMap = {};
              targetItems.forEach((it) => {
                const rowKey = Math.round(it.y / 6);
                if (!yMap[rowKey]) yMap[rowKey] = [];
                yMap[rowKey].push(it);
              });

              Object.values(yMap).forEach((row) => {
                const minX = Math.min(...row.map((it) => it.x));
                const maxX = Math.max(...row.map((it) => it.x + it.w));
                const avgY = row.reduce((s, it) => s + it.y, 0) / row.length;
                const avgH = row.reduce((s, it) => s + it.h, 0) / row.length;

                // 轉為歸一化比例 (0~1)
                const startPt = { x: Math.max(0.02, minX / pw), y: Math.min(0.98, (ph - avgY - avgH * 0.45) / ph) };
                const endPt = { x: Math.min(0.98, maxX / pw), y: startPt.y };

                newStrokes.push({
                  id: `sync-stroke-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  page: pNum,
                  type: 'marker',
                  colorId: hl.colorId || 'terracotta',
                  isStraight: true,
                  points: [startPt, endPt]
                });
              });

              matchCount++;
              break;
            }
          }
        }

        if (newStrokes.length > 0) {
          setPdfAnnotations((prev) => {
            setUndoStack((stk) => [...stk.slice(-49), prev]);
            return [...prev, ...newStrokes];
          });
          showToast(`已成功比對文字座標，將 ${matchCount} 條重點同步劃記至 PDF！(支援 Ctrl+Z 復原)`);
          if (viewMode === 'focus') setViewMode('split');
        } else {
          showToast('無法自動定位文字在 PDF 上的精確幾何座標');
        }
      }, [pdfDocInstance, textHighlights, docPages, viewMode, showToast]);

      // 書庫：修改檔案名稱
      const handleCommitRenameDoc = async (docId) => {
        const nextTitle = editingDocTitleDraft.trim();
        if (!nextTitle) {
          setEditingDocId(null);
          return;

        setLibraryDocs((prev) =>
          prev.map((d) => {
            if (d.id !== docId) return d;
            const updated = {
              ...d,
              title: nextTitle,

            idbPutDoc(updated, currentOwnerUid);
            return updated;

        if (activeDocId === docId) {

            ...prev,

            filename: `${nextTitle.replace(/\.pdf$/i, '')}.pdf`

        showToast(`檔案已重新命名為「${nextTitle}」`);

      // 一鍵複製「所有重點筆記 ＋ 生成架構表指令」
      const handleCopyPromptArchitecture = useCallback(() => {
        if (textHighlights.length === 0) {
          showToast('目前尚無重點筆記可生成架構表');
          return;
        }

        // 依母子關係分層組織
        const parentMap = {};
        const rootHls = [];

        textHighlights.forEach((h) => {
          if (h.parentId) {
            if (!parentMap[h.parentId]) parentMap[h.parentId] = [];
            parentMap[h.parentId].push(h);
          } else {
            rootHls.push(h);
          }
        });

        const formatHlTree = (hl, depth = 0) => {
          const indent = '  '.repeat(depth);
          const cObj = MARKER_COLORS.find((c) => c.id === hl.colorId) || MARKER_COLORS[0];
          let out = `${indent}- [P.${hl.pageNumber || 1}] [${cObj.name}] #${hl.tag || '概念'}：「${hl.quote}」\n`;
          if (hl.note) out += `${indent}  ↳ 個人註解：${hl.note}\n`;
          const children = parentMap[hl.id] || [];
          children.forEach((ch) => {
            out += formatHlTree(ch, depth + 1);
          });
          return out;
        };

        let noteBody = '';
        rootHls.forEach((r) => {
          noteBody += formatHlTree(r, 0);
        });

        // 包含行間筆記
        const inlineNoteEntries = Object.entries(inlineNotes);
        let inlineText = '';
        if (inlineNoteEntries.length > 0) {
          inlineText = '\n【文章行間即時筆記】：\n' + inlineNoteEntries.map(([lineId, val]) => {
            const lineObj = readingLines.find((l) => l.id === lineId);
            return `- P.${lineObj?.pageNumber || '?'}:「${lineObj?.text || ''}」↳ ${val}`;
          }).join('\n') + '\n';
        }

        const promptTemplate = `你是一位專業的學術知識圖譜與邏輯架構架構師。請根據以下這篇文獻的階層式重點標註、母子延伸概念與個人筆記，為我梳理並生成一份「清晰、結構完整且符合邏輯論證脈絡的文獻架構表（Mindmap / Outline）」。

【文獻標題】：${docMeta.title}
【領域類型】：${docMeta.domainHint}

【階層式重點標註清單】：
${noteBody}${inlineText}

【指令要求】：
1. 嚴格依據母子集合隸屬關係，梳理出：第一層「核心論點/主題」➔ 第二層「支撐論證/子概念」➔ 第三層「細部案例/術語定義」。
2. 請用繁體中文 Markdown 樹狀層級清單呈現，並標註引用的頁碼 (P.X)。
3. 在架構表末端，提供 3 點批判性反思與核心 takeaway 總結。`;

        // 複製至剪貼簿
        const dummy = document.createElement('textarea');
        dummy.value = promptTemplate;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);

        showToast('已複製！包含全階層重點、母子關係、筆記與專屬架構表 Prompt');
      }, [textHighlights, inlineNotes, readingLines, docMeta, showToast]);

      // 匯入 PDF
      const handleImportPdfFiles = async (fileList) => {

      // 反白選取建立重點（自動比對是否為已有重點的子句子）

        let autoParentId = customParentId;
        if (!autoParentId) {
          const parentCandidate = textHighlights.find((h) => h.quote && h.quote !== quote && h.quote.includes(quote));
          if (parentCandidate) autoParentId = parentCandidate.id;

        const autoNote = selectionPopover.deepResult
          ? `【深譯】${selectionPopover.deepResult.rigorousTranslation} — ${selectionPopover.deepResult.contextualNuance}`
          : selectionPopover.quickResult
          ? `【快譯】${selectionPopover.quickResult.translation}`
          : '';

        const newHl = {
          id: `hl-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          parentId: autoParentId || null,
          lineId,

          pageNumber: selectionPopover.pageNumber,
          quote,
          colorId,
          tag: customTags[0] || '重要概念',
          note: autoNote,
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setTextHighlights((prev) => [newHl, ...prev]);
        setExpandedHlIds((prev) => ({ ...prev, [newHl.id]: true })); // 新增自動展開
        setSelectionPopover(null);
        window.getSelection()?.removeAllRanges();
        setSidebarTab('highlights');
        setShowRightSidebar(true);
        setEditingHlNoteId(newHl.id);

        if (autoParentId) showToast('已成功建立多層級子標註！');
        else showToast('已新增重點標註');
      };

      // 篩選與統計
      const colorCounts = useMemo(() => {
        const counts = { terracotta: 0, ochre: 0, dustyBlue: 0, sage: 0 };
        textHighlights.forEach((h) => {
          if (counts[h.colorId] !== undefined) counts[h.colorId]++;
        });
        return counts;
      }, [textHighlights]);

      const filteredHighlights = useMemo(() => {
        return textHighlights.filter((h) => {
          const matchesTag = selectedTagFilter === 'ALL' || h.tag === selectedTagFilter;
          const matchesColor = selectedColorFilter === 'ALL' || h.colorId === selectedColorFilter;
          return matchesTag && matchesColor;
        });
      }, [textHighlights, selectedTagFilter, selectedColorFilter]);

      const filteredLibraryDocs = useMemo(() => {
        return libraryDocs.filter((d) => {
          const inFolder =
            selectedFolderId === 'ALL'
              ? true
              : selectedFolderId === 'UNCATEGORIZED'
              ? !d.folderId
              : d.folderId === selectedFolderId;
          const matchesSearch =
            !librarySearchQuery.trim() ||
            (d.title || '').toLowerCase().includes(librarySearchQuery.toLowerCase()) ||
            (d.filename || '').toLowerCase().includes(librarySearchQuery.toLowerCase());
          return inFolder && matchesSearch;
        });
      }, [libraryDocs, selectedFolderId, librarySearchQuery]);

      // 渲染多層級標註文字（支援重疊莫蘭迪色與底線）
      const renderHighlightedLineText = (line, isForPrint = false) => {
        const lineHls = textHighlights.filter(
          (h) => h.quote && (h.lineId === line.id || (h.quote.length >= 3 && line.text.includes(h.quote)))
        );
        if (lineHls.length === 0) return line.text;

        // 收集所有區間
        const ranges = [];
        for (const hl of lineHls) {
          let pos = 0;
          while ((pos = line.text.indexOf(hl.quote, pos)) !== -1) {
            ranges.push({
              start: pos,
              end: pos + hl.quote.length,
              colorId: hl.colorId,
              isChild: Boolean(hl.parentId)
            });
            pos += hl.quote.length;
          }
        }
        if (ranges.length === 0) return line.text;

        // 拆分為不重疊切片
        const cutPoints = Array.from(new Set([0, line.text.length, ...ranges.flatMap((r) => [r.start, r.end])])).sort((a, b) => a - b);
        const slices = [];

        for (let i = 0; i < cutPoints.length - 1; i++) {
          const s = cutPoints[i];
          const e = cutPoints[i + 1];
          const activeRanges = ranges.filter((r) => r.start <= s && r.end >= e);
          slices.push({ s, e, text: line.text.slice(s, e), activeRanges });
        }

        return slices.map((sl, idx) => {
          if (sl.activeRanges.length === 0) return sl.text;
          const topRange = sl.activeRanges[sl.activeRanges.length - 1];
          const cObj = MARKER_COLORS.find((c) => c.id === topRange.colorId) || MARKER_COLORS[0];
          const hasMultiple = sl.activeRanges.length > 1;

          return (
            <mark
              key={idx}
              style={{
                backgroundColor: isForPrint
                  ? cObj.printBg
                  : currentTheme.isDark
                  ? cObj.bgDark
                  : cObj.bgLight,
                color: isForPrint ? '#111827' : 'inherit',
                borderBottom: hasMultiple ? `3px double ${cObj.hex}` : `2px solid ${cObj.hex}`
              }}
              className="rounded px-0.5 py-0.5 transition-colors"
              title={hasMultiple ? '多層子標註重疊區域' : undefined}
            >
              {sl.text}
            </mark>
          );
        });
      };

      const fontClass =
        settings.fontFamily === 'serif'
          ? 'font-reader-serif'
          : settings.fontFamily === 'mono'
          ? 'font-reader-mono'
          : 'font-reader-sans';

      const pdfPageNumbers = useMemo(() => {
        const total = Math.max(1, docMeta.numPages || 1);
        return Array.from({ length: total }, (_, idx) => idx + 1);
      }, [docMeta.numPages]);

      return (
        <>
          <div
            id="screen-app-shell"
            className="h-screen w-full flex flex-col overflow-hidden transition-colors duration-300 no-print"
            style={{ backgroundColor: 'var(--bg-app)', color: 'var(--text-main)' }}
            onDragOver={(e) => e.preventDefault()}

            }}
          >
            <input
              ref={fileInputRef}
              type="file"
              accept="application/pdf,.pdf"
              multiple
              className="hidden"
              onChange={(e) => handleImportPdfFiles(e.target.files)}
            />
            <input
              ref={backupInputRef}
              type="file"
              accept=".json"
              className="hidden"
              onChange={async (e) => {

                    }, currentOwnerUid);

            {importProgressText && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center">
                <div
                  style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                  className="px-6 py-4 rounded-2xl border shadow-2xl text-xs font-semibold flex items-center gap-3"
                >

                  <span>{importProgressText}</span>
                </div>

            {/* 頂部功能列 */}
            <header

              className="h-14 px-3 sm:px-4 flex items-center justify-between gap-2 border-b shrink-0 z-30 relative backdrop-blur-md"
            >
              <div className="flex items-center gap-2 min-w-0">
                {/* 保存書庫按鈕與下拉選單 */}
                <div className="relative min-w-0 shrink">
                  <button

                    style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                    className="flex items-center gap-2 h-9 px-3 rounded-xl border shrink min-w-0 w-[140px] sm:w-[210px] transition hover:opacity-90"

                  >

                    <span className="truncate text-xs sm:text-sm font-medium flex-1 text-left">
                      {activeDocId ? docMeta.title : `書庫 (${libraryDocs.length})`}
                    </span>

                  </button>

                  {showLibraryMenu && (
                    <div
                      style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                      className="absolute left-0 top-11 w-[350px] sm:w-[460px] rounded-2xl border p-4 shadow-2xl z-50 space-y-3"
                    >
                      <div className="flex items-center justify-between gap-2 pb-2.5 border-b" style={{ borderColor: 'var(--border-color)' }}>
                        <div>

                          </button>
                          {folders.map((f) => {

                            const active = selectedFolderId === f.id;
                            const isConfirming = confirmDeleteFolderId === f.id;

                                onClick={() => setChatMessages((prev) => prev.filter((m) => m.id !== msg.id))}
                                className="opacity-0 group-hover:opacity-100 p-0.5 hover:text-red-400 transition"
                                title="刪除此則對話紀錄"
                              >
                                <Icon name="trash" className="w-3 h-3" />
                              </button>
                            </div>

                            {msg.quote && (
                              <div className="rounded bg-black/15 px-2 py-0.5 text-[10px] border-l-2 italic" style={{ borderColor: '#c8a86b' }}>
                                「{msg.quote}」
                              </div>
                            )}
                            <div className="whitespace-pre-wrap break-words">{msg.content}</div>
                          </div>
                        ))}
                        {isChatSending && (
                          <div style={{ backgroundColor: 'var(--bg-subtle)' }} className="rounded-2xl p-3 border mr-6 text-xs opacity-80">
                            正在深度推理回應中...
                          </div>
                        )}
                        <div ref={chatEndRef} />
                      </div>

                      <form
                        onSubmit={async (e) => {
                          e.preventDefault();
                          const q = chatInput.trim();
                          if (!q || isChatSending) return;
                          const activeKey = (geminiApiKey || window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
                          if (!activeKey) {
                            setShowAccountModal(true);
                            return;
                          }

                          const userMsg = { id: `u-${Date.now()}`, role: 'user', content: q };
                          setChatMessages((prev) => [...prev, userMsg]);
                          setChatInput('');
                          setIsChatSending(true);

                          try {
                            const { text } = await callGeminiFlash({
                              geminiKey: activeKey,
                              systemInstruction: '你是專為學術閱讀與 ADHD 設計的導讀助理。回答層次清楚、條列核心。',
                              messages: [{ role: 'user', text: `【文獻】：${docMeta.title}\n\n${q}` }]
                            });
                            setChatMessages((prev) => [
                              ...prev,
                              { id: `a-${Date.now()}`, role: 'assistant', model: LOCKED_GEMINI_MODEL, content: text }
                            ]);
                          } catch (err) {
                            setChatMessages((prev) => [
                              ...prev,
                              { id: `err-${Date.now()}`, role: 'assistant', content: `連線異常：${err.message}` }
                            ]);
                          } finally {
                            setIsChatSending(false);
                          }
                        }}
                        className="p-3 border-t flex items-center gap-2"
                        style={{ borderColor: 'var(--border-color)' }}
                      >
                        <input
                          type="text"
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          placeholder="針對文獻提問（Enter 送出）..."
                          style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                          className="flex-1 h-9 px-3 rounded-xl border text-xs outline-none"
                        />
                        <button
                          type="submit"
                          disabled={isChatSending || !chatInput.trim()}
                          style={{ backgroundColor: 'var(--accent)' }}
                          className="h-9 px-3.5 rounded-xl text-white disabled:opacity-40 flex items-center justify-center shrink-0"
                        >
                          <Icon name="send" className="w-4 h-4" />
                        </button>
                      </form>
                    </div>
                  )}
                </aside>
              )}
            </div>

            {/* 反白選字浮動彈窗（支援母標註關聯 ＋ 免金鑰秒譯 ＋ 深譯） */}
            {selectionPopover && (
              <div
                onClick={(e) => e.stopPropagation()}
                style={{
                  left: `${selectionPopover.x}px`,
                  top: `${selectionPopover.y}px`,
                  transform: selectionPopover.placeBelow ? 'translate(-50%, 0)' : 'translate(-50%, -100%)',
                  backgroundColor: 'var(--bg-panel)',
                  borderColor: 'var(--border-color)'
                }}
                className="fixed z-50 w-[340px] sm:w-[390px] rounded-2xl border p-3.5 shadow-2xl space-y-2.5"
              >
                {/* 免金鑰高速字典 */}
                <div style={{ backgroundColor: 'var(--bg-subtle)' }} className="rounded-xl border p-2.5 text-xs">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px] font-bold flex items-center gap-1" style={{ color: 'var(--warn)' }}>
                      <Icon name="zap" className="w-3 h-3" />
                      <span>反白即翻</span>
                    </span>
                    <button onClick={() => setSelectionPopover(null)} className="opacity-60 hover:opacity-100">
                      <Icon name="x" className="w-3 h-3" />
                    </button>
                  </div>
                  {selectionPopover.quickLoading ? (
                    <p className="text-[11px] opacity-70">字典查詢中...</p>
                  ) : selectionPopover.quickResult ? (
                    <div>
                      <p className="font-semibold text-sm leading-snug">{selectionPopover.quickResult.translation}</p>
                      {selectionPopover.quickResult.posOrNote && (
                        <p className="text-[10px] mt-1 opacity-70">{selectionPopover.quickResult.posOrNote}</p>
                      )}
                    </div>
                  ) : (
                    <p className="text-[11px] opacity-70">查無直譯</p>
                  )}
                </div>

                {/* 劃線色塊 ＋ 多層級標註 */}
                <div className="flex items-center justify-between gap-1.5 flex-wrap">
                  <div className="flex items-center gap-1.5">
                    {MARKER_COLORS.map((c) => (
                      <button
                        key={c.id}
                        onClick={() => handleAddHighlightWithHierarchy(c.id)}
                        style={{ backgroundColor: c.hex }}
                        className="w-5 h-5 rounded-full border border-black/20 hover:scale-110 transition"
                        title={`以${c.name}標記（自動關聯外層母標註）`}
                      />
                    ))}
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={async () => {
                        const activeKey = (geminiApiKey || window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
                        if (!activeKey) {
                          setShowAccountModal(true);
                          return;
                        }
                        setSelectionPopover((p) => ({ ...p, deepLoading: true }));
                        try {
                          const { text } = await callGeminiFlash({
                            geminiKey: activeKey,
                            systemInstruction: '嚴謹學術導讀譯者。請解析該句在文獻段落中的脈絡與精確繁體中文翻譯。',
                            messages: [{ role: 'user', text: `【上下文】：${selectionPopover.paragraphContext}\n【句子】：${selectionPopover.quote}` }]
                          });
                          setSelectionPopover((p) => ({ ...p, deepLoading: false, deepResult: { rigorousTranslation: text, contextualNuance: '學術語境分析' } }));
                        } catch (err) {
                          setSelectionPopover((p) => ({ ...p, deepLoading: false, deepError: err.message }));
                        }
                      }}
                      style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)', color: 'var(--accent-text)' }}
                      className="h-8 px-2.5 rounded-xl border text-xs font-semibold flex items-center gap-1"
                    >
                      <Icon name="languages" className="w-3.5 h-3.5" />
                      <span>{selectionPopover.deepLoading ? '深譯中...' : '語境深譯'}</span>
                    </button>
                  </div>
                </div>

                {selectionPopover.deepResult && (
                  <div style={{ backgroundColor: 'var(--accent-soft)' }} className="rounded-xl border p-2.5 text-xs space-y-1">
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-[10px]">Gemini 語境深譯：</span>
                      <button onClick={() => handleAddHighlightWithHierarchy('ochre')} className="text-[10px] underline font-medium">
                        + 存為重點
                      </button>
                    </div>
                    <p className="leading-relaxed">{selectionPopover.deepResult.rigorousTranslation}</p>
                  </div>
                )}
              </div>
            )}

            {/* API 金鑰設定彈窗 */}
            {showAccountModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }} className="w-full max-w-md rounded-2xl border p-5 shadow-2xl space-y-4">
                  <div className="flex items-center justify-between border-b pb-3" style={{ borderColor: 'var(--border-color)' }}>
                    <h2 className="text-sm font-bold">Google Gemini API Key 設定</h2>
                    <button onClick={() => setShowAccountModal(false)} className="p-1 opacity-70 hover:opacity-100">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                  <input
                    type="password"
                    value={geminiKeyDraft}
                    onChange={(e) => setGeminiKeyDraft(e.target.value)}
                    placeholder="貼上 AIzaSy... 金鑰"
                    style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                    className="w-full px-3 py-2 rounded-xl border text-xs outline-none font-mono"
                  />
                  <div className="pt-2 border-t flex justify-end gap-2" style={{ borderColor: 'var(--border-color)' }}>
                    <button onClick={() => setShowAccountModal(false)} className="px-3.5 py-1.5 text-xs opacity-75">取消</button>
                    <button
                      onClick={async () => {
                        await saveApiKeyPermanently(geminiKeyDraft);
                        setShowAccountModal(false);
                        showToast('API 金鑰已保存！');
                      }}
                      style={{ backgroundColor: 'var(--accent)' }}
                      className="px-4 py-1.5 rounded-xl text-white text-xs font-semibold"
                    >
                      儲存金鑰
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Toast 提示 */}
            {toastMsg && (
              <div style={{ backgroundColor: 'var(--accent)' }} className="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-white text-xs font-medium shadow-lg pointer-events-none">
                {toastMsg}
              </div>
            )}
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
