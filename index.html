    // =========================================================================
    // 2. 本機 IndexedDB 與持久保存儲存引擎 (支援 Persistence API)
    // =========================================================================
    const IDB_NAME = 'ADHDFocusReader_v3_Ultimate';
    const IDB_VERSION = 1;

    async function requestStoragePersistence() {
      if (navigator.storage && navigator.storage.persist) {
        const isPersisted = await navigator.storage.persist();
        return isPersisted;
      }
      return false;
    }

    function openReaderDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('瀏覽器不支援 IndexedDB'));
          return;
        }
        const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('documents')) {
            db.createObjectStore('documents', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('kv')) {
            db.createObjectStore('kv', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGetKV(key, fallback = null) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readonly');
          const req = tx.objectStore('kv').get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : fallback);
          req.onerror = () => resolve(fallback);
        });
      } catch {
        return fallback;
      }
    }

    async function idbSetKV(key, value) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbGetScopedKV(uid, key, fallback = null) {
      const val = await idbGetKV(`${uid}::${key}`, undefined);
      return val !== undefined ? val : fallback;
    }

    async function idbSetScopedKV(uid, key, value) {
      return idbSetKV(`${uid}::${key}`, value);
    }

    async function idbGetAllDocs(uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readonly');
          const req = tx.objectStore('documents').getAll();
          req.onsuccess = () => {
            const list = (req.result || []).filter((d) => (d.ownerUid || 'local-owner') === uid);
            resolve(list);
          };
          req.onerror = () => resolve([]);
        });
      } catch {
        return [];
      }
    }

    async function idbPutDoc(docRecord, uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        const payload = { ...docRecord, ownerUid: uid || docRecord.ownerUid || 'local-owner' };
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').put(payload);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbDeleteDoc(docId) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').delete(docId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    // 4. 文字分句、PDF 座標解析、免金鑰極速字典與 AI 呼叫

    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return 'PDF 檔案';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function splitParagraphIntoSentences(text) {
      if (!text) return [];
      const cleaned = text.replace(/\s+/g, ' ').trim();
      if (!cleaned) return [];
      const rawParts = cleaned.match(/[^.!?。！？]+(?:[.!?。！？]+['"”’)]*|\s*$)/g) || [cleaned];
      const merged = [];
      for (const part of rawParts) {
        const trimmed = part.trim();
        if (!trimmed) continue;
        const prev = merged[merged.length - 1];
        if (
          prev &&
          (/(?:\b(?:Dr|Prof|Mr|Mrs|Ms|Jr|Sr|vs|etc|e\.g|i\.e|U\.S|cf|ib|op|p|pp|Fig|No)\.|[0-9]\.)$/i.test(prev) ||
            prev.length < 14)
        ) {
          merged[merged.length - 1] = `${prev} ${trimmed}`;
        } else {
          merged.push(trimmed);
        }
      }
      return merged;
    }

    async function extractStructuredPagesFromPdf(pdfDoc, filterHeaderFooter = true, onProgress = null) {
      const pages = [];
      let totalCharCount = 0;

      for (let p = 1; p <= pdfDoc.numPages; p++) {
        if (onProgress) onProgress(p, pdfDoc.numPages);
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        const pageHeight = viewport.height || 800;
        const textContent = await page.getTextContent();
        const rawItems = textContent.items || [];

        const items = [];
        for (const item of rawItems) {
          const str = (item.str || '').replace(/\u0000/g, '');
          if (!str.trim()) continue;
          const tx = item.transform ? item.transform[4] : 0;
          const ty = item.transform ? item.transform[5] : 0;
          const fontH = Math.max(
            8,
            Math.hypot(item.transform?.[0] || 0, item.transform?.[1] || 0) || item.height || 12
          );

          if (filterHeaderFooter) {
            const isNearEdge = ty > pageHeight * 0.94 || ty < pageHeight * 0.055;
            const isStamp =
              /^https?:\/\//i.test(str.trim()) ||
              /^[-–—]?\s*\d+\s*[-–—]?$/.test(str.trim()) ||
              /^\d+\s*\/\s*\d+$/.test(str.trim());
            if (isNearEdge && isStamp) continue;
          }

          items.push({
            str,
            x: tx,
            y: ty,
            w: item.width || str.length * fontH * 0.5,
            h: fontH
          });
        }

        if (items.length === 0) {
          pages.push({ pageNumber: p, blocks: [] });
          continue;
        }

        items.sort((a, b) => {
          if (Math.abs(b.y - a.y) > Math.min(a.h, b.h) * 0.45) {
            return b.y - a.y;
          }
          return a.x - b.x;
        });

        const visualLines = [];
        for (const it of items) {
          const lastLine = visualLines[visualLines.length - 1];
          if (lastLine && Math.abs(lastLine.y - it.y) <= Math.max(lastLine.h, it.h) * 0.48) {
            const prevItem = lastLine.items[lastLine.items.length - 1];
            const gap = it.x - (prevItem.x + prevItem.w);
            const isCJK = /[\u4e00-\u9fff]$/.test(lastLine.text) || /^[\u4e00-\u9fff]/.test(it.str);
            const needSpace =
              !isCJK &&
              gap > it.h * 0.16 &&
              !/[\s\-–—/(\[「『（]$/.test(lastLine.text) &&
              !/^[\s.,;:!?%)\]」』）]/.test(it.str);
            lastLine.text += (needSpace ? ' ' : '') + it.str;
            lastLine.items.push(it);
            lastLine.h = Math.max(lastLine.h, it.h);
          } else {
            visualLines.push({
              text: it.str.trim(),
              y: it.y,
              x: it.x,
              h: it.h,
              items: [it]
            });
          }
        }

        const sortedHeights = visualLines.map((l) => l.h).sort((a, b) => a - b);
        const medianH = sortedHeights[Math.floor(sortedHeights.length / 2)] || 12;

        const blocks = [];
        let currentBlock = null;

        for (const line of visualLines) {
          const lineText = line.text.trim();
          if (!lineText) continue;
          totalCharCount += lineText.length;
          const isHeading = line.h >= medianH * 1.2 && lineText.length < 130;

          if (!currentBlock) {
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
            continue;
          }

          const verticalGap = currentBlock.lastY - line.y;
          const paragraphBreak =
            isHeading ||
            currentBlock.type === 'heading' ||
            verticalGap > Math.max(currentBlock.lastH, line.h) * 1.72 ||
            /^(\d+\.|[•·\-▪])\s+/.test(lineText);

          if (paragraphBreak) {
            blocks.push({ type: currentBlock.type, text: currentBlock.text });
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
          } else {
            if (/[a-zA-Z]-$/.test(currentBlock.text) && /^[a-z]/.test(lineText)) {
              currentBlock.text = currentBlock.text.slice(0, -1) + lineText;
            } else {
              const bothCJK =
                /[\u4e00-\u9fff，。；：「」『』（）！？”’]$/.test(currentBlock.text) &&
                /^[\u4e00-\u9fff「『（]/.test(lineText);
              currentBlock.text = `${currentBlock.text}${bothCJK ? '' : ' '}${lineText}`;
            }
            currentBlock.lastY = line.y;
            currentBlock.lastH = line.h;
          }
        }

        if (currentBlock && currentBlock.text.trim()) {
          blocks.push({ type: currentBlock.type, text: currentBlock.text.trim() });
        }
        pages.push({ pageNumber: p, blocks });
      }

      return { pages, totalCharCount };
    }

    // 免金鑰快速直譯字典通道 (不耗費 AI 額度)
    async function fetchKeylessInstantDictionary(queryText) {
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(queryText)}`;
        const res = await fetch(gtxUrl);
        if (res.ok) {
          const data = await res.json();
          const mainTrans = Array.isArray(data?.[0])
            ? data[0].map((seg) => seg?.[0] || '').join('').trim()
            : '';
          let posNote = '';
          if (Array.isArray(data?.[1]) && data[1].length > 0) {
            posNote = data[1]
              .slice(0, 2)
              .map((entry) => `${entry[0]}：${(entry[1] || []).slice(0, 4).join('、')}`)
              .join(' ｜ ');
          }
          if (mainTrans) return { translation: mainTrans, posOrNote: posNote };
        }
      } catch {}

      const isAscii = /^[A-Za-z0-9\s.,'?!:;()-]+$/.test(queryText);
      const mmRes = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(queryText)}&langpair=${isAscii ? 'en|zh-TW' : 'autodetect|zh-TW'}`
      );
      if (!mmRes.ok) throw new Error('免費字典通道忙碌，請點下方「語境深譯」');
      const mmData = await mmRes.json();
      const mmText = mmData?.responseData?.translatedText?.trim();
      if (!mmText) throw new Error('查無直譯結果');
      return { translation: mmText, posOrNote: '' };
    }

    // 呼叫個人 Gemini 3.8 / OpenAI Key
    async function callUnifiedAI({
      provider = 'gemini',
      geminiKey = '',
      openaiKey = '',
      model = 'gemini-3.8-flash',
      systemInstruction = '',
      messages = [],
      thinkingLevelObj = THINKING_LEVELS[2],
      expectJson = false,
      geminiJsonSchema = null
    }) {
      if (provider === 'openai') {
        if (!openaiKey) throw new Error('請先在「帳號與 AI 連線」設定 OpenAI API Key');
        const effectiveModel = model.startsWith('gpt-') || model.startsWith('o') ? model : 'gpt-4o-mini';
        const isReasoning = effectiveModel.startsWith('o');

        const apiMessages = [];
        if (systemInstruction) {
          apiMessages.push({
            role: isReasoning ? 'developer' : 'system',
            content: expectJson ? `${systemInstruction}\n請回傳合法 JSON 物件。` : systemInstruction
          });
        }
        for (const m of messages) {
          apiMessages.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.text });
        }

        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${openaiKey}` },
          body: JSON.stringify({
            model: effectiveModel,
            messages: apiMessages,
            ...(expectJson ? { response_format: { type: 'json_object' } } : {}),
            ...(isReasoning && thinkingLevelObj?.openaiEffort ? { reasoning_effort: thinkingLevelObj.openaiEffort } : {})
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || `OpenAI 錯誤 (${res.status})`);
        return { text: data?.choices?.[0]?.message?.content?.trim() || '', thought: '' };
      }

      // Gemini
      if (!geminiKey) throw new Error('請先在「帳號與 AI 連線」設定 Google Gemini API Key');
      const effectiveModel = model.startsWith('gemini-') ? model : 'gemini-3.8-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${effectiveModel}:generateContent?key=${encodeURIComponent(geminiKey)}`;

      const contents = messages.map((m) => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.text }]
      }));

      const buildPayload = (includeThinking) => {
        const generationConfig = {};
        if (expectJson) {
          generationConfig.responseMimeType = 'application/json';
          if (geminiJsonSchema) generationConfig.responseSchema = geminiJsonSchema;
        }
        if (includeThinking && typeof thinkingLevelObj?.geminiBudget === 'number') {
          generationConfig.thinkingConfig = { thinkingBudget: thinkingLevelObj.geminiBudget };
        }
        return {
          contents,
          ...(systemInstruction ? { systemInstruction: { parts: [{ text: systemInstruction }] } } : {}),
          ...(Object.keys(generationConfig).length > 0 ? { generationConfig } : {})
        };
      };

      let res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildPayload(true))
      });

      if (res.status === 400) {
        const errCheck = await res.clone().json().catch(() => ({}));
        if (/thinking/i.test(errCheck?.error?.message || '')) {
          res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildPayload(false))
          });
        }
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data?.error?.message || `Gemini 連線錯誤 (${res.status})`);

      const parts = data?.candidates?.[0]?.content?.parts || [];
      let thoughtText = '';
      let answerText = '';
      for (const p of parts) {
        if (p.thought) thoughtText += p.text || '';
        else answerText += p.text || '';
      }
      return { text: answerText.trim(), thought: thoughtText.trim() };
    }

            idbGetScopedKV(scopeUid, 'aiProvider', 'gemini'),
            idbGetScopedKV(scopeUid, 'geminiApiKey', ''),
            idbGetScopedKV(scopeUid, 'openaiApiKey', ''),
            idbGetScopedKV(scopeUid, 'pinCode', ''),
            idbGetScopedKV(scopeUid, 'quickTransCache', {}),
            idbGetScopedKV(scopeUid, 'activeDocId', null),
            idbGetAllDocs(scopeUid)
          ]);

          if (!mounted) return;
          if (savedProfile) setAccountProfile(savedProfile);
          setSettings(savedSettings ? { ...DEFAULT_SETTINGS, ...savedSettings } : DEFAULT_SETTINGS);
          setAiProvider(savedProvider || 'gemini');
          setGeminiApiKey(savedGemKey || '');
          setGeminiKeyDraft(savedGemKey || '');
          setOpenaiApiKey(savedOaiKey || '');
          setOpenaiKeyDraft(savedOaiKey || '');
          setPinCode(savedPin || '');
          setPinDraft(savedPin || '');
          setIsLocked(Boolean(savedPin));
          quickTransCacheRef.current =
            savedTransCache && typeof savedTransCache === 'object' ? savedTransCache : {};

          const sortedDocs = (storedDocs || []).sort(
            (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)
          );
          setLibraryDocs(sortedDocs);

          const targetDoc = sortedDocs.find((d) => d.id === savedActiveId) || sortedDocs[0] || null;
          await activateDocumentRecord(targetDoc, scopeUid);
          if (mounted) setDbInitialized(true);
        }

        loadWorkspace();
        return () => { mounted = false; };
      }, [currentOwnerUid, activateDocumentRecord]);

      useEffect(() => {
        if (!dbInitialized) return;
        idbSetScopedKV(currentOwnerUid, 'settings', settings);
      }, [settings, dbInitialized, currentOwnerUid]);

      // 自動持久儲存文獻進度、標註與行內筆記
      useEffect(() => {
        if (!dbInitialized || !activeDocId) return;
        const timer = setTimeout(() => {
          const total = Math.max(1, readingLines.length);
          const progressPct = Math.min(100, Math.round(((activeLineIdx + 1) / total) * 100));

          setLibraryDocs((prev) => {
            const target = prev.find((d) => d.id === activeDocId);
            if (!target) return prev;
            const updated = {
              ...target,
              ownerUid: currentOwnerUid,
              activeLineIdx,
              progressPct,
              textHighlights,
              inlineNotes,
              pdfAnnotations,
              chatMessages
            };
            idbPutDoc(updated, currentOwnerUid);
            return prev.map((d) => (d.id === activeDocId ? updated : d));
          });
        }, 350);
        return () => clearTimeout(timer);
      }, [dbInitialized, activeDocId, currentOwnerUid, activeLineIdx, readingLines.length, textHighlights, inlineNotes, pdfAnnotations, chatMessages]);

      // 鍵盤上下行與播放
      useEffect(() => {
        const onKeyDown = (e) => {
          const tag = document.activeElement?.tagName?.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || isLocked) return;

          if (e.key === 'ArrowDown' || e.key === 'j') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying(false);
            setActiveLineIdx((idx) => Math.min(readingLines.length - 1, idx + 1));
          } else if (e.key === 'ArrowUp' || e.key === 'k') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying(false);
            setActiveLineIdx((idx) => Math.max(0, idx - 1));
          } else if (e.code === 'Space') {
            if (readingLines.length === 0) return;
            e.preventDefault();
            setIsAutoPlaying((p) => !p);
          } else if (e.key === 'Escape') {
            setSelectionPopover(null);
            setShowLibraryMenu(false);
            setShowSettingsPanel(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [readingLines.length, isLocked]);

      // 自動換行閱讀進度計時器
      useEffect(() => {
        if (!isAutoPlaying || readingLines.length === 0) {
          setAutoPlayProgress(0);
          return;
        }
        const currentLine = readingLines[activeLineIdx];
        if (!currentLine) return;

        const cjkCount = currentLine.text.match(/[\u4e00-\u9fff]/g)?.length || 0;
        const wordCount = currentLine.text.replace(/[\u4e00-\u9fff]/g, ' ').trim().split(/\s+/).filter(Boolean).length;
        const wordEquivalent = Math.max(2, cjkCount * 0.6 + wordCount);
        const durationMs = Math.max(1500, Math.min(14000, (wordEquivalent / settings.wpm) * 60000));

        const startTime = performance.now();
        let rafId;
        const tick = (now) => {
          const elapsed = now - startTime;
          setAutoPlayProgress(Math.min(100, (elapsed / durationMs) * 100));
          if (elapsed >= durationMs) {
            if (activeLineIdx < readingLines.length - 1) {
              setActiveLineIdx((i) => i + 1);
            } else {
              setIsAutoPlaying(false);
              showToast('已完成全文閱讀');
            }
          } else {
            rafId = requestAnimationFrame(tick);
          }
        };
        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [isAutoPlaying, activeLineIdx, readingLines, settings.wpm, showToast]);

      // =======================================================================
      // PDF 畫布標註渲染 (支援直線模式)
      // =======================================================================
      const redrawAnnotationOverlay = useCallback(() => {
        const canvas = overlayCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const strokes = pdfAnnotations.filter(
          (a) => a.page === currentPdfPage && (a.type === 'pen' || a.type === 'marker')
        );

        const drawStroke = (s) => {
          if (!s.points || s.points.length < 2) return;
          const cObj = MARKER_COLORS.find((c) => c.id === s.colorId) || MARKER_COLORS[0];
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = cObj.hex;
          if (s.type === 'marker') {
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = Math.max(14, canvas.width * 0.024);
          } else {
            ctx.globalAlpha = 0.92;
            ctx.lineWidth = Math.max(2.5, canvas.width * 0.0038);
          }
          ctx.beginPath();
          s.points.forEach((pt, idx) => {
            const px = pt.x * canvas.width;
            const py = pt.y * canvas.height;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.stroke();
          ctx.restore();
        };

        strokes.forEach(drawStroke);
        if (drawingStrokeRef.current) drawStroke(drawingStrokeRef.current);
      }, [pdfAnnotations, currentPdfPage]);

      useEffect(() => {
        if (!activeDocId || viewMode === 'focus' || !pdfJsDocRef.current || !pdfCanvasRef.current) return;
        let renderTask = null;
        let cancelled = false;

        (async () => {
          try {
            const pdfDoc = pdfJsDocRef.current;
            const safePage = Math.min(Math.max(1, currentPdfPage), pdfDoc.numPages);
            const page = await pdfDoc.getPage(safePage);
            if (cancelled) return;

            const dpr = window.devicePixelRatio || 1;
            const viewport = page.getViewport({ scale: pdfZoom });
            const canvas = pdfCanvasRef.current;
            const overlay = overlayCanvasRef.current;
            if (!canvas || !overlay) return;

            canvas.width = Math.floor(viewport.width * dpr);
            canvas.height = Math.floor(viewport.height * dpr);
            canvas.style.width = `${Math.floor(viewport.width)}px`;
            canvas.style.height = `${Math.floor(viewport.height)}px`;

            overlay.width = Math.floor(viewport.width * dpr);
            overlay.height = Math.floor(viewport.height * dpr);
            overlay.style.width = `${Math.floor(viewport.width)}px`;
            overlay.style.height = `${Math.floor(viewport.height)}px`;

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            renderTask = page.render({ canvasContext: ctx, viewport });
            await renderTask.promise;
            if (!cancelled) redrawAnnotationOverlay();
          } catch {}
        })();

        return () => {
          cancelled = true;
          if (renderTask?.cancel) renderTask.cancel();
        };
      }, [activeDocId, viewMode, pdfBytes, currentPdfPage, pdfZoom, redrawAnnotationOverlay]);

      useEffect(() => {
        redrawAnnotationOverlay();
      }, [redrawAnnotationOverlay]);

      const getCanvasPoint = (e) => {
        const overlay = overlayCanvasRef.current;
        if (!overlay) return { x: 0.5, y: 0.5 };
        const rect = overlay.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height))
        };
      };

      const handleOverlayPointerDown = (e) => {
        const pt = getCanvasPoint(e);
        if (pdfSpotlightRuler && pdfTool === 'cursor') setRulerYRatio(pt.y);
        if (pdfTool === 'cursor') return;
        e.preventDefault();

        if (pdfTool === 'note') {
          const newNote = {
            id: `note-${Date.now()}`,
            page: currentPdfPage,
            type: 'note',
            x: Math.min(0.76, Math.max(0.04, pt.x)),
            y: Math.min(0.84, Math.max(0.04, pt.y)),
            colorId: activeBrushColor,
            text: '點擊輸入筆記...'
          };
          setPdfAnnotations((prev) => [...prev, newNote]);
          setEditingStickyId(newNote.id);
          setPdfTool('cursor');
          return;
        }

        if (pdfTool === 'eraser') {
          setPdfAnnotations((prev) =>
            prev.filter((ann) => {
              if (ann.page !== currentPdfPage) return true;
              if (ann.type === 'note') return Math.hypot(ann.x - pt.x, ann.y - pt.y) > 0.06;
              return !(ann.points || []).some((p) => Math.hypot(p.x - pt.x, p.y - pt.y) < 0.035);
            })
          );
          return;
        }

        if (pdfTool === 'pen' || pdfTool === 'marker') {
          const isStraight = drawMode === 'line' || e.shiftKey;
          drawingStrokeRef.current = {
            id: `stroke-${Date.now()}`,
            page: currentPdfPage,
            type: pdfTool,
            colorId: activeBrushColor,
            isStraight,
            points: [pt, pt]
          };
          redrawAnnotationOverlay();
        }
      };

      const handleOverlayPointerMove = (e) => {
        const pt = getCanvasPoint(e);
        if (pdfSpotlightRuler && e.buttons === 1 && pdfTool === 'cursor' && !draggingNoteRef.current) {
          setRulerYRatio(pt.y);
        }
        if (draggingNoteRef.current) {
          const noteId = draggingNoteRef.current;
          setPdfAnnotations((prev) =>
            prev.map((a) =>
              a.id === noteId
                ? { ...a, x: Math.min(0.8, Math.max(0.02, pt.x)), y: Math.min(0.86, Math.max(0.02, pt.y)) }
                : a
            )
          );
          return;
        }
        if (!drawingStrokeRef.current) return;
        const stroke = drawingStrokeRef.current;
        const isStraight = stroke.isStraight || e.shiftKey;

        if (isStraight) {
          const startPt = stroke.points[0];
          let endPt = { ...pt };
          if (e.shiftKey) {
            const dx = Math.abs(endPt.x - startPt.x);
            const dy = Math.abs(endPt.y - startPt.y);
            if (dx > dy) endPt.y = startPt.y;
            else endPt.x = startPt.x;
          }
          stroke.points = [startPt, endPt];
        } else {
          stroke.points.push(pt);
        }
        redrawAnnotationOverlay();
      };

      const handleOverlayPointerUp = () => {
        draggingNoteRef.current = null;
        if (drawingStrokeRef.current) {
          const finished = drawingStrokeRef.current;
          drawingStrokeRef.current = null;
          if (finished.points.length >= 2) {
            setPdfAnnotations((prev) => [...prev, finished]);
          }
        }
      };

      // =======================================================================
      // 匯入 PDF、刪除與本機備份/還原 (Local-First)
      // =======================================================================
      const handleImportPdfFiles = async (fileList) => {
        if (!fileList || fileList.length === 0) return;
        setShowLibraryMenu(false);
        let newestRecord = null;

        for (const file of Array.from(fileList)) {
          if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
            showToast(`「${file.name}」不是 PDF 檔案`);
            continue;
          }

          try {
            setImportProgressText(`正在讀取 ${file.name}...`);
            const arrayBuf = await file.arrayBuffer();
            const rawBytes = new Uint8Array(arrayBuf);
            const pdfDoc = await window.pdfjsLib.getDocument({
              data: rawBytes.slice(0),
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
              standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            }).promise;

            const { pages, totalCharCount } = await extractStructuredPagesFromPdf(
              pdfDoc,
              settings.filterHeaderFooter,
              (curr, total) => setImportProgressText(`精準擷取文字中 (${curr} / ${total} 頁)...`)
            );

            const cleanTitle = file.name.replace(/\.pdf$/i, '');
            const firstHeading = pages[0]?.blocks?.find((b) => b.type === 'heading')?.text || cleanTitle;

            const record = {
              id: `${currentOwnerUid}-pdf-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              ownerUid: currentOwnerUid,
              filename: file.name,
              fileSize: file.size,
              title: firstHeading.length <= 85 ? firstHeading : cleanTitle,
              subtitle: `${file.name} • 共 ${pdfDoc.numPages} 頁`,
              domainHint: `文獻 (${cleanTitle})`,
              numPages: pdfDoc.numPages,
              pages,
              pdfBytes: rawBytes,
              activeLineIdx: 0,
              progressPct: 1,
              textHighlights: [],
              inlineNotes: {},
              pdfAnnotations: [],
              chatMessages: DEFAULT_WELCOME_MESSAGES(),
              updatedAt: Date.now()
            };

            await idbPutDoc(record, currentOwnerUid);
            setLibraryDocs((prev) => [record, ...prev]);
            newestRecord = { record, pdfDoc, totalCharCount };
          } catch (err) {
            showToast(`匯入失敗：${err.message}`);
          }
        }

        setImportProgressText('');
        if (fileInputRef.current) fileInputRef.current.value = '';

        if (newestRecord) {
          const { record, pdfDoc, totalCharCount } = newestRecord;
          pdfJsDocRef.current = pdfDoc;
          await activateDocumentRecord(record, currentOwnerUid);

          if (totalCharCount < record.numPages * 15) {
            setViewMode('split');
            showToast('偵測為掃描圖片型 PDF，可點上方「AI 圖片轉文字」擷取內文');
          } else {
            showToast(`已成功匯入「${record.filename}」並永久保存於本機`);
          }
        }
      };

      const handleDeleteDocument = async (docId) => {
        const target = libraryDocs.find((d) => d.id === docId);
        if (!target) return;
        await idbDeleteDoc(docId);
        const remaining = libraryDocs.filter((d) => d.id !== docId);
        setLibraryDocs(remaining);
        setConfirmDeleteId(null);
        if (activeDocId === docId) {
          await activateDocumentRecord(remaining[0] || null, currentOwnerUid);
        }
        showToast(`已刪除「${target.filename || target.title}」`);
      };

      // 匯出完整本機備份檔 (Local-First JSON)
      const handleExportLocalBackup = async () => {
        try {
          const allDocs = await idbGetAllDocs(currentOwnerUid);
          const backupData = {
            version: 'v3_ultimate',
            ownerUid: currentOwnerUid,
            exportDate: new Date().toISOString(),
            settings,
            inlineNotes,
            documents: allDocs.map((doc) => ({
              ...doc,
              // 二進位轉 Array 儲存
              pdfBytes: doc.pdfBytes ? Array.from(doc.pdfBytes) : null
            }))
          };
          const jsonStr = JSON.stringify(backupData);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ADHD_閱讀器完整備份_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('已匯出完整本機備份檔，可在任何裝置隨時還原！');
        } catch (err) {
          showToast(`備份失敗：${err.message}`);
        }
      };

      // 還原備份檔
      const handleRestoreBackupFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (!parsed.documents) throw new Error('非標準備份格式');

          for (const doc of parsed.documents) {
            const restoredDoc = {
              ...doc,
              ownerUid: currentOwnerUid,
              pdfBytes: doc.pdfBytes ? new Uint8Array(doc.pdfBytes) : null
            };
            await idbPutDoc(restoredDoc, currentOwnerUid);
          }
          if (parsed.settings) setSettings(parsed.settings);
          showToast('備份還原成功！正在重新整理書庫...');
          setTimeout(() => window.location.reload(), 1000);
        } catch (err) {
          showToast(`還原失敗：${err.message}`);
        }
      };

      // 匯出「專注純文字版 PDF（含標註與行內筆記）」
      const handlePrintCleanTextPdf = () => {
        if (!activeDocId) return;
        window.print();
      };

      // =======================================================================
      // 反白即翻（免金鑰極速字典）
      // =======================================================================
      const triggerQuickInstantTranslate = useCallback(async (selectedText) => {
        const cleanKey = selectedText.trim().slice(0, 350);
        if (!cleanKey) return;

        const cached = quickTransCacheRef.current[cleanKey];
        if (cached) {
          setSelectionPopover((prev) =>
            prev && prev.quote === selectedText
              ? { ...prev, quickLoading: false, quickResult: cached, quickError: '' }
              : prev
          );
          return;
        }

        const reqId = ++quickReqIdRef.current;
        setSelectionPopover((prev) =>
          prev ? { ...prev, quickLoading: true, quickResult: null, quickError: '' } : null
        );

        try {
          const resultObj = await fetchKeylessInstantDictionary(cleanKey);
          if (reqId !== quickReqIdRef.current) return;

          quickTransCacheRef.current[cleanKey] = resultObj;
          const keys = Object.keys(quickTransCacheRef.current);
          if (keys.length > 400) delete quickTransCacheRef.current[keys[0]];
          idbSetScopedKV(currentOwnerUid, 'quickTransCache', quickTransCacheRef.current);

          setSelectionPopover((prev) =>
            prev ? { ...prev, quickLoading: false, quickResult: resultObj } : null
          );
        } catch (err) {
          if (reqId !== quickReqIdRef.current) return;
          setSelectionPopover((prev) =>
            prev ? { ...prev, quickLoading: false, quickError: err.message || '直譯逾時' } : null
          );
        }
      }, [currentOwnerUid]);

      const openSelectionMenu = useCallback(({ quote, lineObj, lineIndex, clientX, clientY }) => {
        const cleaned = (quote || '').trim();
        if (!cleaned) return;
        setIsAutoPlaying(false);
        if (typeof lineIndex === 'number') setActiveLineIdx(lineIndex);

        const safeX = Math.min(window.innerWidth - 195, Math.max(195, clientX));
        const placeBelow = clientY < 240;
        const safeY = placeBelow
          ? Math.min(window.innerHeight - 80, clientY + 20)
          : Math.max(70, clientY - 12);

        const cached = quickTransCacheRef.current[cleaned.slice(0, 350)] || null;

        setSelectionPopover({
          quote: cleaned,
          lineId: lineObj?.id || '',
          lineIndex: typeof lineIndex === 'number' ? lineIndex : activeLineIdx,
          pageNumber: lineObj?.pageNumber || currentPdfPage || 1,
          paragraphContext: lineObj?.paragraphContext || cleaned,
          x: safeX,
          y: safeY,
          placeBelow,
          quickLoading: settings.instantTranslate && !cached,
          quickResult: cached,
          quickError: '',
          deepLoading: false,
          deepResult: null,
          deepError: ''
        });

        if (settings.instantTranslate && !cached) {
          if (transDebounceRef.current) clearTimeout(transDebounceRef.current);
          transDebounceRef.current = setTimeout(() => {
            triggerQuickInstantTranslate(cleaned);
          }, 280);
        }
      }, [activeLineIdx, currentPdfPage, settings.instantTranslate, triggerQuickInstantTranslate]);

      const handleLineMouseUp = (e, lineObj, idx) => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        const sel = window.getSelection();
        const selectedStr = sel ? sel.toString().trim() : '';
        if (selectedStr.length >= 1) {
          const range = sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
          const rect = range ? range.getBoundingClientRect() : null;
          openSelectionMenu({
            quote: selectedStr,
            lineObj,
            lineIndex: idx,
            clientX: rect ? rect.left + rect.width / 2 : e.clientX,
            clientY: rect ? (rect.top < 240 ? rect.bottom : rect.top) : e.clientY
          });
        }
      };

      const handleLinePointerDown = (e, lineObj, idx) => {
        if (e.button && e.button !== 0) return;
        const { clientX, clientY } = e;
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);

        longPressTimerRef.current = setTimeout(() => {
          const existingSel = window.getSelection()?.toString().trim();
          if (existingSel) {
            openSelectionMenu({ quote: existingSel, lineObj, lineIndex: idx, clientX, clientY });
            return;
          }
          let targetQuote = lineObj.text;
          const caretRange = document.caretRangeFromPoint ? document.caretRangeFromPoint(clientX, clientY) : null;
          if (caretRange?.startContainer?.nodeType === Node.TEXT_NODE) {
            const nodeText = caretRange.startContainer.textContent || '';
            const offset = caretRange.startOffset || 0;
            const leftPart = nodeText.slice(0, offset).match(/[A-Za-z0-9'-]+$|[\u4e00-\u9fff]{1,4}$/);
            const rightPart = nodeText.slice(offset).match(/^[A-Za-z0-9'-]+|^[\u4e00-\u9fff]{1,4}/);
            const candidate = `${leftPart ? leftPart[0] : ''}${rightPart ? rightPart[0] : ''}`.trim();
            if (candidate.length >= 2) targetQuote = candidate;
          }
          openSelectionMenu({ quote: targetQuote, lineObj, lineIndex: idx, clientX, clientY });
        }, 420);
      };

      const cancelLongPress = () => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
      };

      // =======================================================================
      // 語境深譯（Gemini / OpenAI API Key）
      // =======================================================================
      const handleRunContextualTranslate = async () => {
        if (!selectionPopover || selectionPopover.deepLoading) return;
        if (!hasActiveApiKey) {
          setShowAccountModal(true);
          showToast('請先填寫您的 Gemini 或 OpenAI API Key');
          return;
        }

        setSelectionPopover((prev) => (prev ? { ...prev, deepLoading: true, deepError: '' } : null));

        try {
          const geminiSchema = {
            type: 'OBJECT',
            properties: {
              detectedGenre: { type: 'STRING' },
              rigorousTranslation: { type: 'STRING' },
              contextualNuance: { type: 'STRING' },
              keyTerms: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: { term: { type: 'STRING' }, meaningInContext: { type: 'STRING' } },
                  required: ['term', 'meaningInContext']
                }
              }
            },
            required: ['detectedGenre', 'rigorousTranslation', 'contextualNuance']
          };

          const prompt = `【文獻標題】：${docMeta.title}
【文獻領域】：${docMeta.domainHint}
【上下文完整段落】：${selectionPopover.paragraphContext}
【目標詞句】：${selectionPopover.quote}

        const newHl = {
          id: `hl-${Date.now()}`,
          lineId: selectionPopover.lineId,
          lineIndex: selectionPopover.lineIndex,
          pageNumber: selectionPopover.pageNumber,
          quote: selectionPopover.quote,
          colorId,
          tag: customTag,
          note: autoNote,
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setTextHighlights((prev) => [newHl, ...prev]);
        setSelectionPopover(null);
        window.getSelection()?.removeAllRanges();
        showToast('已加入重點標註，可於側邊欄即時編輯或點擊跳回該行');
      };

      // 側邊欄重點卡片平滑跳回段落（Scroll-to-Target + Pulse 動效）
      const handleJumpToLine = (targetLineId, targetLineIdx) => {
        let index = typeof targetLineIdx === 'number' ? targetLineIdx : -1;
        if (index === -1 || !readingLines[index] || readingLines[index].id !== targetLineId) {
          index = readingLines.findIndex((l) => l.id === targetLineId);
        }
        if (index === -1) {
          showToast('找不到該段落位置');
          return;
        }

        setIsAutoPlaying(false);
        setActiveLineIdx(index);
        setPulseLineId(targetLineId);

        const el = lineRefs.current[index];
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        setTimeout(() => {
          setPulseLineId((curr) => (curr === targetLineId ? null : curr));
        }, 1800);

      // 發送 AI 側欄聊天

        if (!hasActiveApiKey) {

          return;

        const effectiveQuestion = question || '請結合上下文脈絡，深入解析這段文字的核心概念。';
        const currentQuote = quotedContext;
        const levelObj = THINKING_LEVELS.find((t) => t.id === thinkingLevel) || THINKING_LEVELS[2];
        const modelList = PROVIDER_MODELS[aiProvider] || PROVIDER_MODELS.gemini;
        const modelObj = modelList.find((m) => m.id === selectedModel) || modelList[0];

        const userMsg = {
          id: `u-${Date.now()}`,

          quote: currentQuote?.quote || '',

        setChatMessages((prev) => [...prev, userMsg]);

            }));

            : `【文獻標題】：${docMeta.title}\n【當前段落】：${readingLines[activeLineIdx]?.paragraphContext || ''}\n\n【問題】：${effectiveQuestion}`;

            geminiKey: geminiApiKey,
            openaiKey: openaiApiKey,
            model: modelObj.id,
            systemInstruction: '你是專為 ADHD 設計的學術導讀助理。回答結構清晰、條列重點，使用繁體中文。',
            messages: historyMsgs,
            thinkingLevelObj: levelObj,
            expectJson: false

              id: `a-${Date.now()}`,
              role: 'assistant',
              model: modelObj.label.split('(')[0].trim(),
              thinkingLabel: levelObj.label,
              thought,
              quote: currentQuote?.quote || '',
              content: text || '已完成推理。'
            }

        } catch (err) {
          setChatMessages((prev) => [
            ...prev,
            {
              id: `err-${Date.now()}`,
              role: 'assistant',
              model: '提示',
              thinkingLabel: '異常',
              content: `無法取得回應：${err.message}`

      const renderHighlightedLineText = (line) => {
        const lineHls = textHighlights.filter(
          (h) => h.quote && (h.lineId === line.id || (h.quote.length >= 3 && line.text.includes(h.quote)))
        );
        if (lineHls.length === 0) return line.text;

        const ranges = [];
        for (const hl of lineHls) {
          const start = line.text.indexOf(hl.quote);
          if (start !== -1) {
            const end = start + hl.quote.length;
            if (!ranges.some((r) => start < r.end && end > r.start)) {
              ranges.push({ start, end, colorId: hl.colorId });
            }
          }
        }
        if (ranges.length === 0) return line.text;
        ranges.sort((a, b) => a.start - b.start);

        const nodes = [];
        let cursor = 0;
        ranges.forEach((r, i) => {
          if (r.start > cursor) nodes.push(line.text.slice(cursor, r.start));
          const cObj = MARKER_COLORS.find((c) => c.id === r.colorId) || MARKER_COLORS[0];

              {line.text.slice(r.start, r.end)}
            </mark>
          );
          cursor = r.end;
        });
        if (cursor < line.text.length) nodes.push(line.text.slice(cursor));
        return nodes;

                                  className={`group relative rounded-2xl px-4 sm:px-5 py-3 border transition-all duration-200 cursor-pointer ${
                                    isActive ? 'shadow-md' : 'hover:opacity-75'

                                    <span

                                      <Icon name="note" className="w-3 h-3 text-amber-500" />

                                              setInlineNotes((prev) => {

                                                return next;

                                        className="h-full"

                                    </div>
                                  )}
                                </div>
                              </React.Fragment>

                        </div>

                          style={{ backgroundColor: 'var(--bg-header)', borderColor: 'var(--border-color)' }}

                            onClick={() => {
                              setIsAutoPlaying(false);
                              setActiveLineIdx((i) => Math.max(0, i - 1));

                            <span className="text-[11px] font-mono w-12 text-right">{settings.wpm}wpm</span>

                        </div>
                      </div>

                  </main>

                          <Icon name="zoomOut" className="w-3.5 h-3.5" />

                        <span className="text-[11px] font-mono w-10 text-center">{Math.round(pdfZoom * 100)}%</span>

                          <Icon name="zoomIn" className="w-3.5 h-3.5" />

                              <Icon name={tool.icon} className="w-3.5 h-3.5" />
                              <span className="hidden xl:inline">{tool.label}</span>
                            </button>
                          );

                          <button
                            onClick={() => setDrawMode((m) => (m === 'line' ? 'free' : 'line'))}

                                : { backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }

                            <span>直線</span>

                            <div style={{ borderColor: '#c8a86b', backgroundColor: 'rgba(200,168,107,0.06)' }} className="h-[12%] w-full border-y-2" />
                            <div style={{ backgroundColor: 'rgba(30,34,40,0.62)' }} className="h-full w-full" />
                          </div>
                        )}
                      </div>
                    </div>
                  </section>
                )}

                    </button>
                  </div>
                  <button onClick={() => setShowRightSidebar(false)} className="p-1.5 rounded-lg opacity-70 hover:opacity-100">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {sidebarTab === 'highlights' ? (
                  /* 重點筆記清單與編輯視窗 */
                  <div className="flex-1 flex flex-col min-h-0">
                    {/* 標籤分類水平滾動過濾列 */}
                    <div className="p-2.5 border-b flex items-center gap-1.5 overflow-x-auto text-[11px]" style={{ borderColor: 'var(--border-color)' }}>
                      <span className="opacity-60 shrink-0 ml-1"><Icon name="tag" className="w-3 h-3" /></span>
                      <button
                        onClick={() => setSelectedTagFilter('ALL')}
                        style={selectedTagFilter === 'ALL' ? { backgroundColor: 'var(--accent)', color: '#fff' } : { backgroundColor: 'var(--bg-subtle)' }}
                        className="px-2.5 py-1 rounded-lg shrink-0 font-medium transition"
                      >
                        全部 ({textHighlights.length})
                      </button>
                      {allExistingTags.map((tag) => (
                        <button
                          key={tag}
                          onClick={() => setSelectedTagFilter(tag)}
                          style={selectedTagFilter === tag ? { backgroundColor: 'var(--accent)', color: '#fff' } : { backgroundColor: 'var(--bg-subtle)' }}
                          className="px-2.5 py-1 rounded-lg shrink-0 font-medium transition"
                        >
                          #{tag}
                        </button>
                      ))}
                    </div>

                    <div className="flex-1 overflow-y-auto p-3.5 space-y-3 text-xs">
                      {filteredHighlights.length === 0 ? (
                        <div className="py-12 text-center" style={{ color: 'var(--text-muted)' }}>
                          尚無此分類標註。在文章中反白或長按即可新增重點！
                        </div>
                      ) : (
                        filteredHighlights.map((hl) => {
                          const cObj = MARKER_COLORS.find((c) => c.id === hl.colorId) || MARKER_COLORS[0];
                          const isEditing = editingHlNoteId === hl.id;

                          return (
                            <div
                              key={hl.id}
                              style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                              className="rounded-2xl border p-3.5 space-y-2.5 shadow-sm transition hover:border-slate-500/40"
                            >
                              <div className="flex items-center justify-between text-[11px]" style={{ color: 'var(--text-muted)' }}>
                                <span className="flex items-center gap-1.5 font-medium">
                                  <span style={{ backgroundColor: cObj.hex }} className="w-2.5 h-2.5 rounded-full inline-block" />
                                  <span>P.{hl.pageNumber || 1} • {hl.createdAt || '重點'}</span>
                                  {hl.tag && (
                                    <span className="px-1.5 py-0.5 rounded text-[10px]" style={{ backgroundColor: 'var(--bg-panel)' }}>
                                      #{hl.tag}
                                    </span>
                                  )}
                                </span>
                                <button
                                  onClick={() => setTextHighlights((prev) => prev.filter((x) => x.id !== hl.id))}
                                  className="opacity-55 hover:opacity-100"
                                  title="刪除標註"
                                >
                                  <Icon name="trash" className="w-3.5 h-3.5" />
                                </button>
                              </div>

                              <p className="font-semibold leading-relaxed">「{hl.quote}」</p>

                              {/* 卡片註釋：點擊就地切換文字框編輯並自動儲存 */}
                              <div
                                onClick={() => {
                                  if (!isEditing) {
                                    setEditingHlNoteId(hl.id);
                                    setEditingHlDraft(hl.note || '');
                                  }
                                }}
                                style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                                className="rounded-xl p-2.5 border cursor-pointer transition hover:opacity-95"
                                title="點擊編輯此筆記"
                              >
                                {isEditing ? (
                                  <div className="space-y-2" onClick={(e) => e.stopPropagation()}>
                                    <textarea
                                      value={editingHlDraft}
                                      autoFocus
                                      rows={3}
                                      onChange={(e) => setEditingHlDraft(e.target.value)}
                                      onBlur={() => {
                                        setTextHighlights((prev) =>
                                          prev.map((item) => (item.id === hl.id ? { ...item, note: editingHlDraft.trim() } : item))
                                        );
                                        setEditingHlNoteId(null);
                                        showToast('已儲存重點筆記');
                                      }}
                                      style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--accent)', color: 'var(--text-main)' }}
                                      className="w-full p-2 rounded-lg border text-xs outline-none resize-none"
                                    />
                                    <div className="flex items-center justify-between text-[10px] opacity-60">
                                      <span>點擊框外自動儲存</span>
                                      <select
                                        value={hl.tag || '重要概念'}
                                        onChange={(e) => {
                                          const nextTag = e.target.value;
                                          setTextHighlights((prev) =>
                                            prev.map((item) => (item.id === hl.id ? { ...item, tag: nextTag } : item))
                                          );
                                        }}
                                        style={{ backgroundColor: 'var(--bg-subtle)' }}
                                        className="rounded px-1.5 py-0.5 border"
                                      >
                                        {DEFAULT_NOTE_TAGS.map((t) => (
                                          <option key={t} value={t}>{t}</option>
                                        ))}
                                      </select>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="leading-relaxed opacity-90 text-[11px]">
                                    {hl.note ? (
                                      <div className="whitespace-pre-wrap">{hl.note}</div>
                                    ) : (
                                      <span className="opacity-50 italic flex items-center gap-1">
                                        <Icon name="edit" className="w-3 h-3" />
                                        <span>點擊此處輸入個人註釋與筆記...</span>
                                      </span>
                                    )}
                                  </div>
                                )}
                              </div>

                              {/* 右下角小按鈕：平滑跳回文章該段落 (Scroll-to-Target) */}
                              <div className="flex justify-end pt-1">
                                <button
                                  onClick={() => handleJumpToLine(hl.lineId, hl.lineIndex)}
                                  style={{ backgroundColor: 'var(--accent-soft)', color: 'var(--accent-text)', borderColor: 'var(--accent)' }}
                                  className="px-2.5 py-1 rounded-lg border text-[11px] font-semibold flex items-center gap-1 transition hover:opacity-90 shadow-sm"
                                  title="點擊立即平滑捲動置中回該段落並高亮"
                                >
                                  <Icon name="locate" className="w-3 h-3" />
                                  <span>跳回該段落 ↗</span>
                                </button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                ) : (
                  /* 問問 AI 分頁 */
                  <>
                    <div className="px-3 py-2 border-b grid grid-cols-2 gap-2 text-xs" style={{ borderColor: 'var(--border-color)' }}>
                      <div>
                        <label className="text-[10px] block mb-1 opacity-70">模型選擇</label>
                        <select
                          value={selectedModel}
                          onChange={(e) => setSelectedModel(e.target.value)}
                          style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                          className="w-full px-2 py-1.5 rounded-lg border text-xs outline-none"
                        >
                          {(PROVIDER_MODELS[aiProvider] || PROVIDER_MODELS.gemini).map((m) => (
                            <option key={m.id} value={m.id}>{m.label}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] flex items-center gap-1 mb-1 opacity-70">
                          <Icon name="brain" className="w-3 h-3" />
                          <span>思考推演</span>
                        </label>
                        <select
                          value={thinkingLevel}
                          onChange={(e) => setThinkingLevel(e.target.value)}
                          style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                          className="w-full px-2 py-1.5 rounded-lg border text-xs outline-none"
                        >
                          {THINKING_LEVELS.map((t) => (
                            <option key={t.id} value={t.id}>{t.label}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3.5 space-y-3 text-xs leading-relaxed">
                      {chatMessages.map((msg) => (
                        <div
                          key={msg.id}
                          style={
                            msg.role === 'user'
                              ? { backgroundColor: 'var(--accent)', color: '#fff' }
                              : { backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }
                          }
                          className={`rounded-2xl p-3 space-y-2 ${msg.role === 'user' ? 'ml-6' : 'border mr-3'}`}
                        >
                          {msg.role === 'assistant' && (
                            <div className="flex items-center justify-between text-[10px] pb-1 border-b opacity-75" style={{ borderColor: 'var(--border-color)' }}>
                              <span className="font-semibold flex items-center gap-1">
                                <Icon name="sparkles" className="w-3 h-3" />
                                <span>{msg.model || 'AI'}</span>
                              </span>
                              <div className="flex items-center gap-2">
                                <span>{msg.thinkingLabel}</span>
                                {msg.id !== 'welcome-msg' && (
                                  <button
                                    onClick={() => handlePinChatAsNote(msg)}
                                    className="p-1 rounded hover:bg-black/15 flex items-center gap-0.5"
                                    title="釘選此回答為段落重點筆記"
                                  >
                                    <Icon name="pin" className="w-3 h-3 text-amber-400" />
                                    <span>釘選為筆記</span>
                                  </button>
                                )}
                              </div>
                            </div>
                          )}

                          {msg.quote && (
                            <div className="rounded-lg bg-black/15 px-2.5 py-1 text-[11px] border-l-2 italic" style={{ borderColor: '#c8a86b' }}>
                              「{msg.quote}」
                            </div>
                          )}

                          <div className="whitespace-pre-wrap break-words">{msg.content}</div>
                        </div>
                      ))}

                      {isChatSending && (
                        <div
                          style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                          className="rounded-2xl p-3 border mr-6 text-xs opacity-80"
                        >
                          Gemini 正在結合前後文思考中...
                        </div>
                      )}
                      <div ref={chatEndRef} />
                    </div>

                    <form onSubmit={handleSendChat} className="p-3 border-t space-y-2" style={{ borderColor: 'var(--border-color)' }}>
                      {quotedContext && (
                        <div
                          style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)' }}
                          className="rounded-xl border p-2 text-xs flex items-start justify-between gap-2"
                        >
                          <div className="min-w-0">
                            <div className="text-[10px] font-bold" style={{ color: 'var(--accent-text)' }}>
                              已引用詞句 (P.{quotedContext.pageNumber})
                            </div>
                            <p className="line-clamp-2 italic">「{quotedContext.quote}」</p>
                          </div>
                          <button type="button" onClick={() => setQuotedContext(null)} className="p-1 opacity-70 hover:opacity-100">
                            <Icon name="x" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      )}

                      <div className="flex items-end gap-2">
                        <textarea
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && !e.shiftKey) {
                              e.preventDefault();
                              handleSendChat();
                            }
                          }}
                          rows={2}
                          placeholder={quotedContext ? '補充問題（Enter 送出）...' : '針對文獻提問...'}
                          style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                          className="flex-1 rounded-2xl border px-3.5 py-2 text-xs outline-none resize-none"
                        />
                        <button
                          type="submit"
                          disabled={isChatSending || (!chatInput.trim() && !quotedContext)}
                          style={{ backgroundColor: 'var(--accent)' }}
                          className="h-10 px-3.5 rounded-2xl text-white disabled:opacity-40 flex items-center justify-center shrink-0"
                        >
                          <Icon name="send" className="w-4 h-4" />
                        </button>
                      </div>
                    </form>
                  </>
                )}
              </aside>
            )}
          </div>

          {/* 長按 / 反白查詢懸浮彈窗 */}
          {selectionPopover && (
            <div
              onClick={(e) => e.stopPropagation()}
              style={{
                left: `${selectionPopover.x}px`,
                top: `${selectionPopover.y}px`,
                transform: selectionPopover.placeBelow ? 'translate(-50%, 0)' : 'translate(-50%, -100%)',
                backgroundColor: 'var(--bg-panel)',
                borderColor: 'var(--border-color)'
              }}
              className="fixed z-50 w-[335px] sm:w-[390px] rounded-2xl border p-3.5 shadow-2xl space-y-2.5 no-print"
            >
              {settings.instantTranslate && (
                <div
                  style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                  className="rounded-xl border px-3 py-2 text-xs"
                >
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-[10px] font-bold flex items-center gap-1" style={{ color: 'var(--warn)' }}>
                      <Icon name="zap" className="w-3 h-3" />
                      <span>反白即翻（免金鑰字典）</span>
                    </span>
                    <button onClick={() => setSelectionPopover(null)} className="opacity-60 hover:opacity-100">
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                  {selectionPopover.quickLoading ? (
                    <p className="py-0.5 text-[11px]" style={{ color: 'var(--text-muted)' }}>字典查詢中...</p>
                  ) : selectionPopover.quickError ? (
                    <p className="text-[11px]" style={{ color: 'var(--warn)' }}>{selectionPopover.quickError}</p>
                  ) : selectionPopover.quickResult ? (
                    <div>
                      <p className="font-semibold text-sm leading-snug">{selectionPopover.quickResult.translation}</p>
                      {selectionPopover.quickResult.posOrNote && (
                        <p className="text-[11px] mt-1 leading-relaxed" style={{ color: 'var(--text-muted)' }}>
                          {selectionPopover.quickResult.posOrNote}
                        </p>
                      )}
                    </div>
                  ) : null}
                </div>
              )}

              {/* 4 色重點 + 語境深譯 + 問問 AI */}
              <div className="flex items-center justify-between gap-1.5 flex-wrap">
                <div className="flex items-center gap-1.5">
                  {MARKER_COLORS.map((c) => (
                    <button
                      key={c.id}
                      onClick={() => handleAddHighlight(c.id)}
                      style={{ backgroundColor: c.hex }}
                      className="w-5 h-5 rounded-full border border-black/20 hover:scale-110 transition"
                      title={`以${c.name}標記重點`}
                    />
                  ))}
                </div>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={handleRunContextualTranslate}
                    disabled={selectionPopover.deepLoading}
                    style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)', color: 'var(--accent-text)' }}
                    className="h-8 px-2.5 rounded-xl border text-xs font-semibold flex items-center gap-1 transition"
                  >
                    <Icon name="languages" className="w-3.5 h-3.5" />
                    <span>{selectionPopover.deepLoading ? '深譯中...' : '語境深譯'}</span>
                  </button>

                  <button
                    onClick={() => {
                      setQuotedContext({
                        quote: selectionPopover.quote,
                        paragraphContext: selectionPopover.paragraphContext,
                        pageNumber: selectionPopover.pageNumber
                      });
                      setSelectionPopover(null);
                      setSidebarTab('ai');
                      setShowRightSidebar(true);
                    }}
                    style={{ backgroundColor: 'var(--accent)' }}
                    className="h-8 px-2.5 rounded-xl text-white text-xs font-semibold flex items-center gap-1 transition"
                  >
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>問問 AI</span>
                  </button>
                </div>
              </div>

              {/* 語境深譯結果框 */}
              {selectionPopover.deepError && (
                <p className="text-xs" style={{ color: 'var(--danger)' }}>{selectionPopover.deepError}</p>
              )}
              {selectionPopover.deepResult && (
                <div
                  style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)' }}
                  className="rounded-xl border p-3 text-xs space-y-2 max-h-60 overflow-y-auto"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded" style={{ backgroundColor: 'var(--bg-subtle)' }}>
                      {selectionPopover.deepResult.detectedGenre}
                    </span>
                    <button onClick={() => handleAddHighlight('ochre', '語境深譯')} className="text-[11px] underline font-medium">
                      + 存為重點筆記
                    </button>
                  </div>
                  <p className="font-bold text-sm leading-relaxed">{selectionPopover.deepResult.rigorousTranslation}</p>
                  <p className="leading-relaxed opacity-90">
                    <span className="font-semibold">前後文解析：</span>
                    {selectionPopover.deepResult.contextualNuance}
                  </p>
                </div>
              )}
            </div>
          )}

          {/* 帳號與 AI 設定視窗 */}
          {showAccountModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 no-print">
              <div
                style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                className="w-full max-w-lg rounded-2xl border p-5 shadow-2xl space-y-4 max-h-[88vh] overflow-y-auto"
              >
                <div className="flex items-center justify-between border-b pb-3" style={{ borderColor: 'var(--border-color)' }}>
                  <div>
                    <h2 className="text-sm font-bold">個人帳號空間與 AI 金鑰設定</h2>
                    <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      「反白即翻」走免金鑰免費字典；此處金鑰僅用於「語境深譯」與「問問 AI」
                    </p>
                  </div>
                  <button onClick={() => setShowAccountModal(false)} className="p-1 opacity-70 hover:opacity-100">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2.5">
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setAiProvider('gemini')}
                      style={{
                        backgroundColor: aiProvider === 'gemini' ? 'var(--accent)' : 'var(--bg-subtle)',
                        color: aiProvider === 'gemini' ? '#fff' : 'var(--text-main)',
                        borderColor: aiProvider === 'gemini' ? 'var(--accent)' : 'var(--border-color)'
                      }}
                      className="py-2 px-3 rounded-xl border text-xs font-semibold"
                    >
                      Google Gemini 3.8
                    </button>
                    <button
                      type="button"
                      onClick={() => setAiProvider('openai')}
                      style={{
                        backgroundColor: aiProvider === 'openai' ? 'var(--accent)' : 'var(--bg-subtle)',
                        color: aiProvider === 'openai' ? '#fff' : 'var(--text-main)',
                        borderColor: aiProvider === 'openai' ? 'var(--accent)' : 'var(--border-color)'
                      }}
                      className="py-2 px-3 rounded-xl border text-xs font-semibold"
                    >
                      OpenAI ChatGPT
                    </button>
                  </div>

                  {aiProvider === 'gemini' ? (
                    <div className="space-y-1">
                      <div className="flex items-center justify-between text-xs">
                        <span>Google Gemini API Key</span>
                        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" className="underline text-[11px]" style={{ color: 'var(--accent-text)' }}>
                          前往 AI Studio 取得
                        </a>
                      </div>
                      <input
                        type="password"
                        value={geminiKeyDraft}
                        onChange={(e) => setGeminiKeyDraft(e.target.value)}
                        placeholder="貼上 AIzaSy... 開頭金鑰"
                        style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                        className="w-full px-3 py-2 rounded-xl border text-xs outline-none"
                      />
                    </div>
                  ) : (
                    <div className="space-y-1">
                      <div className="flex items-center justify-between text-xs">
                        <span>OpenAI API Key</span>
                        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer" className="underline text-[11px]" style={{ color: 'var(--accent-text)' }}>
                          前往 OpenAI 取得
                        </a>
                      </div>
                      <input
                        type="password"
                        value={openaiKeyDraft}
                        onChange={(e) => setOpenaiKeyDraft(e.target.value)}
                        placeholder="貼上 sk-... 開頭金鑰"
                        style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                        className="w-full px-3 py-2 rounded-xl border text-xs outline-none"
                      />
                    </div>
                  )}
                </div>

                <div className="pt-2 border-t flex justify-end gap-2" style={{ borderColor: 'var(--border-color)' }}>
                  <button onClick={() => setShowAccountModal(false)} className="px-3.5 py-2 rounded-xl text-xs opacity-75">
                    取消
                  </button>
                  <button
                    onClick={async () => {
                      setGeminiApiKey(geminiKeyDraft.trim());
                      setOpenaiApiKey(openaiKeyDraft.trim());
                      await Promise.all([
                        idbSetScopedKV(currentOwnerUid, 'aiProvider', aiProvider),
                        idbSetScopedKV(currentOwnerUid, 'geminiApiKey', geminiKeyDraft.trim()),
                        idbSetScopedKV(currentOwnerUid, 'openaiApiKey', openaiKeyDraft.trim())
                      ]);
                      setShowAccountModal(false);
                      showToast('已更新個人 AI 金鑰設定');
                    }}
                    style={{ backgroundColor: 'var(--accent)' }}
                    className="px-4 py-2 rounded-xl text-white text-xs font-semibold"
                  >
                    儲存設定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 輕量 Toast 通知 */}
          {toastMsg && (
            <div
              style={{ backgroundColor: 'var(--accent)' }}
              className="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-white text-xs font-medium shadow-lg pointer-events-none no-print"
            >
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
