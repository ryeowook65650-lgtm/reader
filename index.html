      const handleOcrCurrentPdfPage = async () => {
        if (!pdfDocInstance || isOcrLoading) return;
        const cleanKey = (geminiApiKey || window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
        if (!cleanKey) {
          setShowAccountModal(true);
          showToast('請先設定 Gemini API Key 以啟用 AI 圖片轉文字');
          return;
        }

        setIsOcrLoading(true);
        showToast(`正在使用 ${LOCKED_GEMINI_MODEL} 辨識第 ${currentPdfPage} 頁圖片文字...`);

        try {
          const page = await pdfDocInstance.getPage(currentPdfPage);
          const viewport = page.getViewport({ scale: 2.0 });
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = Math.floor(viewport.width);
          tempCanvas.height = Math.floor(viewport.height);
          const ctx = tempCanvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;

          const base64Png = tempCanvas.toDataURL('image/png').split(',')[1];

          const schema = {
            type: 'OBJECT',
            properties: {
              blocks: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: {
                    type: { type: 'STRING' },
                    text: { type: 'STRING' }
                  },
                  required: ['type', 'text']
                }
              }
            },
            required: ['blocks']
          };

          const { text } = await callGeminiFlash({
            geminiKey: cleanKey,
            systemInstruction: '你是精準的學術文獻 OCR 引擎。請完整辨識圖片中的所有段落與標題，過濾頁碼雜訊，保留原文語言。type 僅能為 "heading" 或 "paragraph"。',
            messages: [
              {
                role: 'user',
                inlineData: { mimeType: 'image/png', data: base64Png },
                text: '請將此頁完整轉為結構化文字區塊 JSON。'
              }
            ],
            thinkingLevelObj: THINKING_LEVELS[0],
            expectJson: true,
            geminiJsonSchema: schema
          });

          const parsed = JSON.parse(text);
          const newBlocks = Array.isArray(parsed?.blocks)
            ? parsed.blocks.filter((b) => b?.text?.trim())
            : [];

          if (newBlocks.length === 0) {
            showToast(`第 ${currentPdfPage} 頁未偵測到可辨識文字`);
          } else {
            setDocPages((prev) => {
              const exists = prev.some((p) => p.pageNumber === currentPdfPage);
              let updatedPages;
              if (exists) {
                updatedPages = prev.map((p) =>
                  p.pageNumber === currentPdfPage ? { ...p, blocks: newBlocks } : p
                );
              } else {
                updatedPages = [...prev, { pageNumber: currentPdfPage, blocks: newBlocks }].sort(
                  (a, b) => a.pageNumber - b.pageNumber
                );
              }
              setLibraryDocs((docs) =>
                docs.map((d) => {
                  if (d.id !== activeDocId) return d;
                  const nextDoc = { ...d, pages: updatedPages, updatedAt: Date.now() };
                  idbPutDoc(nextDoc, currentOwnerUid);
                  return nextDoc;
                })
              );
              return updatedPages;
            });
            showToast(`第 ${currentPdfPage} 頁 AI 圖片轉文字完成！已同步至左側專注閱讀區`);
          }
        } catch (err) {
          showToast(`OCR 辨識失敗：${err.message}`);
        } finally {
          setIsOcrLoading(false);
        }
      };

      // =======================================================================
      // 匯出「保存標註 PDF」（烙印手寫線條、直線、中文便利貼與重點附錄回原 PDF）
      // =======================================================================
      const handleExportAnnotatedPdf = async () => {
        if (!pdfBytes || !window.PDFLib || isExportingPdf) return;
        setIsExportingPdf(true);
        showToast('正在將手寫標註、便利貼與重點烙印至 PDF...');

        try {
          const { PDFDocument, rgb } = window.PDFLib;
          const pdfDoc = await PDFDocument.load(pdfBytes);
          const pages = pdfDoc.getPages();

          for (const ann of pdfAnnotations) {
            const pageIdx = (ann.page || 1) - 1;
            if (pageIdx < 0 || pageIdx >= pages.length) continue;
            const page = pages[pageIdx];
            const { width, height } = page.getSize();
            const cObj = MARKER_COLORS.find((c) => c.id === ann.colorId) || MARKER_COLORS[0];
            const [r, g, b] = cObj.rgb;

            if (ann.type === 'hlsync') {
              for (const rc of ann.rects || []) {
                page.drawRectangle({
                  x: rc.x * width,
                  y: (1 - rc.y - rc.h) * height,
                  width: rc.w * width,
                  height: rc.h * height,
                  color: rgb(r, g, b),
                  opacity: 0.34
                });
              }
              continue;
            }

            if ((ann.type === 'pen' || ann.type === 'marker') && ann.points?.length >= 2) {
              for (let i = 1; i < ann.points.length; i++) {
                const p1 = ann.points[i - 1];
                const p2 = ann.points[i];
                page.drawLine({
                  start: { x: p1.x * width, y: (1 - p1.y) * height },
                  end: { x: p2.x * width, y: (1 - p2.y) * height },
                  thickness: ann.type === 'marker' ? Math.max(12, width * 0.022) : Math.max(2.2, width * 0.0036),
                  color: rgb(r, g, b),
                  opacity: ann.type === 'marker' ? 0.34 : 0.9
                });
              }
            } else if (ann.type === 'note') {
              const { bytes: pngBytes, width: nw, height: nh } = await renderStickyNoteToPngBytes(
                ann.text || '（空白便利貼）',
                cObj.hex
              );
              const pngImg = await pdfDoc.embedPng(pngBytes);
              const drawW = Math.min(nw * 0.85, width * 0.34);
              const drawH = nh * (drawW / nw);
              const drawX = Math.min(width - drawW - 8, Math.max(8, ann.x * width));
              const drawY = Math.max(8, (1 - ann.y) * height - drawH);
              page.drawImage(pngImg, { x: drawX, y: drawY, width: drawW, height: drawH });
            }
          }

          // 若有文字重點標註，自動在 PDF 最後附上重點整理頁
          if (textHighlights.length > 0) {
            const chunkSize = 8;
            for (let i = 0; i < textHighlights.length; i += chunkSize) {
              const slice = textHighlights.slice(i, i + chunkSize);
              const appPngBytes = await renderAppendixPageToPngBytes(docMeta.title, slice);
              const appImg = await pdfDoc.embedPng(appPngBytes);
              const newPage = pdfDoc.addPage([595, 842]);
              newPage.drawImage(appImg, { x: 0, y: 0, width: 595, height: 842 });
            }
          }

          const outBytes = await pdfDoc.save();
          const blob = new Blob([outBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${docMeta.title.replace(/[\\/:*?"<>|]/g, '_')}_標註版.pdf`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('標註 PDF 匯出下載完成！');
        } catch (err) {
          showToast(`匯出標註 PDF 失敗：${err.message}`);
        } finally {
          setIsExportingPdf(false);
        }
      };

      // =======================================================================
      // 手動「同步重點至 PDF」：比對文字重點與 PDF 文字座標，把底色畫在對應句子上
      // =======================================================================
      const handleSyncHighlightsToPdf = async () => {
        if (!pdfDocInstance || isSyncingPdf) return;
        if (textHighlights.length === 0) {
          showToast('尚無文字重點可同步，請先在文章中反白標註');
          return;
        }
        setIsSyncingPdf(true);
        try {
          const lineById = {};
          readingLines.forEach((l) => { lineById[l.id] = l; });
          const total = docMeta.numPages || pdfDocInstance.numPages || 1;
          const { annotations, failed, ok } = await computeHighlightSyncRects(
            pdfDocInstance,
            textHighlights,
            lineById,
            total,
            (n, all) => {
              if (all > 12 && (n === 1 || n % 10 === 0)) showToast(`比對重點位置中 (${n} / ${all})...`);
            }
          );

          if (ok > 0) {
            setPdfAnnotations((prev) => {
              setUndoStack((stk) => [...stk.slice(-49), prev]);
              return [...prev.filter((a) => a.type !== 'hlsync'), ...annotations];
            });
          }

          if (failed.length > 0) {
            setSyncReport({
              ok,
              total: textHighlights.length,
              failed: failed.map(({ hl, reason }) => ({
                id: hl.id,
                lineId: hl.lineId,
                lineIndex: hl.lineIndex,
                page: hl.pageNumber || 1,
                quote: hl.quote,
                reason
              }))
            });
          } else {
            setSyncReport(null);
          }

          if (ok === 0) {
            showToast('沒有任何重點能對應到 PDF 文字位置，請看清單說明');
          } else {
            const undoHint = viewMode === 'focus' ? '切到雙欄／PDF 模式可按 Ctrl/Cmd+Z 復原' : '可按 Ctrl/Cmd+Z 復原';
            showToast(`已同步 ${ok} 則重點至 PDF${failed.length ? `，${failed.length} 則未同步` : ''}（${undoHint}）`);
          }
        } catch (err) {
          showToast(`同步失敗：${err.message}`);
        } finally {
          setIsSyncingPdf(false);
        }
      };

      // 匯出「純文字 PDF（完整多頁無外框）」
      const handlePrintCleanTextPdf = () => {
        if (!activeDocId) return;
        window.print();
      };

      // =======================================================================
      // 匯入 PDF、資料夾管理與備份還原
      // =======================================================================
      const handleImportPdfFiles = async (fileList) => {
        if (!fileList || fileList.length === 0) return;
        setShowLibraryMenu(false);
        let newestRecord = null;
        const targetFolderId =
          selectedFolderId !== 'ALL' && selectedFolderId !== 'UNCATEGORIZED' ? selectedFolderId : '';

        for (const file of Array.from(fileList)) {
          if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
            showToast(`「${file.name}」不是 PDF 檔案`);
            continue;
          }

          try {
            setImportProgressText(`正在讀取 ${file.name}...`);
            const arrayBuf = await file.arrayBuffer();
            const rawBytes = new Uint8Array(arrayBuf);
            const pdfDoc = await window.pdfjsLib.getDocument({
              data: rawBytes.slice(0),
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
              standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            }).promise;

            const onExtractProgress = (curr, total) =>
              setImportProgressText(`精準擷取文字中 (${curr} / ${total} 頁)...`);
            let extracted;
            let extractVersion = 2;
            try {
              extracted = await extractStructuredPagesFromPdfV2(pdfDoc, settings.filterHeaderFooter, onExtractProgress);
            } catch (v2Err) {
              console.warn('新版文字擷取失敗，改用舊版：', v2Err);
              extractVersion = 1;
              extracted = await extractStructuredPagesFromPdf(pdfDoc, settings.filterHeaderFooter, onExtractProgress);
            }
            const { pages, totalCharCount } = extracted;

            const cleanTitle = file.name.replace(/\.pdf$/i, '');
            const firstHeading = pages[0]?.blocks?.find((b) => b.type === 'heading')?.text || cleanTitle;

            const record = {
              id: `${currentOwnerUid}-pdf-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              ownerUid: currentOwnerUid,
              folderId: targetFolderId,
              filename: file.name,
              fileSize: file.size,
              title: firstHeading.length <= 85 ? firstHeading : cleanTitle,
              subtitle: `${file.name} • 共 ${pdfDoc.numPages} 頁`,
              domainHint: `文獻 (${cleanTitle})`,
              numPages: pdfDoc.numPages,
              extractVersion,
              pages,
              pdfBytes: rawBytes,
              activeLineIdx: 0,
              progressPct: 1,
              textHighlights: [],
              inlineNotes: {},
              pdfAnnotations: [],
              chatMessages: DEFAULT_WELCOME_MESSAGES(),
              updatedAt: Date.now()
            };

            await idbPutDoc(record, currentOwnerUid);
            setLibraryDocs((prev) => [record, ...prev]);
            newestRecord = { record, pdfDoc, totalCharCount };
          } catch (err) {
            showToast(`匯入失敗：${err.message}`);
          }
        }

        setImportProgressText('');
        if (fileInputRef.current) fileInputRef.current.value = '';

        if (newestRecord) {
          const { record, totalCharCount } = newestRecord;
          await activateDocumentRecord(record, false);

          if (totalCharCount < record.numPages * 15) {
            setViewMode('split');
            showToast('偵測為掃描圖片型 PDF，可點工具列「AI 圖片轉文字」擷取內文');
          } else {
            showToast(`已成功匯入「${record.filename}」`);
          }
        }
      };

      const handleMoveDocToFolder = async (docId, nextFolderId) => {
        setLibraryDocs((prev) =>
          prev.map((d) => {
            if (d.id !== docId) return d;
            const updated = { ...d, folderId: nextFolderId, updatedAt: Date.now() };
            idbPutDoc(updated, currentOwnerUid);
            return updated;
          })
        );
        showToast('已更新檔案分類資料夾');
      };

      const handleRenameDocument = (docId, rawName) => {
        const name = String(rawName || '').replace(/\s+/g, ' ').trim();
        setRenamingDocId(null);
        const target = libraryDocs.find((d) => d.id === docId);
        if (!target || !name || name === target.title) return;
        setLibraryDocs((prev) =>
          prev.map((d) => {
            if (d.id !== docId) return d;
            const updated = { ...d, title: name, updatedAt: Date.now() };
            idbPutDoc(updated, currentOwnerUid);
            return updated;
          })
        );
        if (docId === activeDocId) setDocMeta((m) => ({ ...m, title: name }));
        showToast(`已改名為「${name}」`);
      };

      const handleCreateFolder = (e) => {
        e.preventDefault();
        const name = newFolderInput.trim();
        if (!name) return;
        if (folders.some((f) => f.name === name)) {
          showToast('已有同名資料夾');
          return;
        }
        const created = { id: `folder-${Date.now()}`, name };
        setFolders((prev) => [...prev, created]);
        setSelectedFolderId(created.id);
        setNewFolderInput('');
        showToast(`已新增資料夾「${name}」`);
      };

      const handleDeleteFolder = (folderId) => {
        setFolders((prev) => prev.filter((f) => f.id !== folderId));
        setLibraryDocs((prev) =>
          prev.map((d) => {
            if (d.folderId !== folderId) return d;
            const updated = { ...d, folderId: '' };
            idbPutDoc(updated, currentOwnerUid);
            return updated;
          })
        );
        if (selectedFolderId === folderId) setSelectedFolderId('ALL');
        showToast('已刪除資料夾（內部檔案保留為未分類）');
      };

      const handleDeleteDocument = async (docId) => {
        const target = libraryDocs.find((d) => d.id === docId);
        if (!target) return;
        await idbDeleteDoc(docId);
        const remaining = libraryDocs.filter((d) => d.id !== docId);
        setLibraryDocs(remaining);
        setConfirmDeleteId(null);
        if (activeDocId === docId) {
          await activateDocumentRecord(remaining[0] || null, false);
        }
        showToast(`已刪除「${target.filename || target.title}」`);
      };

      const handleExportLocalBackup = async () => {
        try {
          const allDocs = await idbGetAllDocs(currentOwnerUid);
          const backupData = {
            version: 'v4_complete',
            ownerUid: currentOwnerUid,
            exportDate: new Date().toISOString(),
            settings,
            customTags,
            folders,
            documents: allDocs.map((doc) => ({
              ...doc,
              pdfBytes: doc.pdfBytes ? Array.from(doc.pdfBytes) : null
            }))
          };
          const blob = new Blob([JSON.stringify(backupData)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ADHD_閱讀器完整備份_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('已匯出完整書庫、資料夾與筆記備份檔！');
        } catch (err) {
          showToast(`備份失敗：${err.message}`);
        }
      };

      const handleRestoreBackupFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (!parsed.documents) throw new Error('非標準備份格式');

          for (const doc of parsed.documents) {
            await idbPutDoc(
              {
                ...doc,
                ownerUid: currentOwnerUid,
                pdfBytes: doc.pdfBytes ? new Uint8Array(doc.pdfBytes) : null
              },
              currentOwnerUid
            );
          }
          if (parsed.settings) setSettings({ ...DEFAULT_SETTINGS, ...parsed.settings });
          if (Array.isArray(parsed.customTags)) setCustomTags(parsed.customTags);
          if (Array.isArray(parsed.folders)) setFolders(parsed.folders);
          showToast('備份還原成功！正在重新載入...');
          setTimeout(() => window.location.reload(), 900);
        } catch (err) {
          showToast(`還原失敗：${err.message}`);
        }
      };

      // =======================================================================
      // 自訂 Hashtag 新增與刪除
      // =======================================================================
      const addCustomHashtag = (rawTag, applyToHlId = null) => {
        const cleaned = String(rawTag || '').replace(/^#+/, '').trim();
        if (!cleaned) return;
        if (!customTags.includes(cleaned)) {
          setCustomTags((prev) => [...prev, cleaned]);
        }
        if (applyToHlId) {
          setTextHighlights((prev) =>
            prev.map((h) => (h.id === applyToHlId ? { ...h, tag: cleaned } : h))
          );
        }
        showToast(`已啟用標籤 #${cleaned}`);
      };

      const removeCustomHashtag = (tagToRemove) => {
        setCustomTags((prev) => prev.filter((t) => t !== tagToRemove));
        setTextHighlights((prev) =>
          prev.some((h) => h.tag === tagToRemove)
            ? prev.map((h) => (h.tag === tagToRemove ? { ...h, tag: '' } : h))
            : prev
        );
        if (selectedTagFilter === tagToRemove) setSelectedTagFilter('ALL');
        showToast(`已移除標籤選項 #${tagToRemove}`);
      };

      // =======================================================================
      // 反白即翻（免金鑰字典）與語境深譯（固定 gemini-3.8-flash）
      // =======================================================================
      const triggerQuickInstantTranslate = useCallback(async (selectedText) => {
        const cleanKey = selectedText.trim().slice(0, 350);
        if (!cleanKey) return;

        const cached = quickTransCacheRef.current[cleanKey];
        if (cached) {
          setSelectionPopover((prev) =>
            prev && prev.quote === selectedText
              ? { ...prev, quickLoading: false, quickResult: cached, quickError: '' }
              : prev
          );
          return;
        }

        const reqId = ++quickReqIdRef.current;
        setSelectionPopover((prev) =>
          prev ? { ...prev, quickLoading: true, quickResult: null, quickError: '' } : null
        );

        try {
          const resultObj = await fetchKeylessInstantDictionary(cleanKey);
          if (reqId !== quickReqIdRef.current) return;

          quickTransCacheRef.current[cleanKey] = resultObj;
          const keys = Object.keys(quickTransCacheRef.current);
          if (keys.length > 400) delete quickTransCacheRef.current[keys[0]];
          idbSetScopedKV(currentOwnerUid, 'quickTransCache', quickTransCacheRef.current);

          setSelectionPopover((prev) =>
            prev ? { ...prev, quickLoading: false, quickResult: resultObj } : null
          );
        } catch (err) {
          if (reqId !== quickReqIdRef.current) return;
          setSelectionPopover((prev) =>
            prev ? { ...prev, quickLoading: false, quickError: err.message || '直譯逾時' } : null
          );
        }
      }, []);

      const openSelectionMenu = useCallback(({ quote, lineObj, lineIndex, clientX, clientY, selStart = -1, selEnd = -1 }) => {
        const cleaned = (quote || '').trim();
        if (!cleaned) return;
        setIsAutoPlaying(false);
        if (typeof lineIndex === 'number') setActiveLineIdx(lineIndex);

        const safeX = Math.min(window.innerWidth - 195, Math.max(195, clientX));
        const placeBelow = clientY < 240;
        const safeY = placeBelow
          ? Math.min(window.innerHeight - 80, clientY + 20)
          : Math.max(70, clientY - 12);

        const cached = quickTransCacheRef.current[cleaned.slice(0, 350)] || null;

        // 母標註：優先使用「+ 子標註」鎖定；否則自動偵測「完全包住所選文字」的最內層既有標註
        let parentId = '';
        let parentSource = '';
        const hlsNow = textHighlightsRef.current || [];
        const lockId = subParentLockRef.current;
        if (lockId && hlsNow.some((h) => h.id === lockId)) {
          parentId = lockId;
          parentSource = 'lock';
        } else if (lineObj && hlsNow.length > 0) {
          const det = detectParentHighlightId(lineObj, hlsNow, cleaned, selStart, selEnd, computeHighlightDepths(hlsNow));
          if (det) {
            parentId = det;
            parentSource = 'auto';
          }
        }

        setSelectionPopover({
          quote: cleaned,
          lineId: lineObj?.id || '',
          lineIndex: typeof lineIndex === 'number' ? lineIndex : activeLineIdx,
          pageNumber: lineObj?.pageNumber || currentPdfPage || 1,
          paragraphContext: lineObj?.paragraphContext || cleaned,
          selStart: Number.isInteger(selStart) && selStart >= 0 ? selStart : -1,
          parentId,
          parentSource,
          x: safeX,
          y: safeY,
          placeBelow,
          quickLoading: settings.instantTranslate && !cached,
          quickResult: cached,
          quickError: '',
          deepLoading: false,
          deepResult: null,
          deepError: ''
        });

        if (settings.instantTranslate && !cached) {
          if (transDebounceRef.current) clearTimeout(transDebounceRef.current);
          transDebounceRef.current = setTimeout(() => {
            triggerQuickInstantTranslate(cleaned);
          }, 260);
        }
      }, [activeLineIdx, currentPdfPage, settings.instantTranslate, triggerQuickInstantTranslate]);

      const handleLineMouseUp = (e, lineObj, idx) => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        const sel = window.getSelection();
        const selectedStr = sel ? sel.toString().trim() : '';
        if (selectedStr.length >= 1) {
          const range = sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
          const rect = range ? range.getBoundingClientRect() : null;
          // 取得所選文字在這一行內的字元位置（供母子標註與重複詞精準定位）
          let selStart = -1;
          let selEnd = -1;
          try {
            const host = e.currentTarget && e.currentTarget.querySelector
              ? e.currentTarget.querySelector('[data-line-text]')
              : null;
            if (host && range && host.contains(range.startContainer) && host.contains(range.endContainer)) {
              const pre = document.createRange();
              pre.selectNodeContents(host);
              pre.setEnd(range.startContainer, range.startOffset);
              const raw = range.toString();
              const lead = raw.length - raw.trimStart().length;
              selStart = pre.toString().length + lead;
              selEnd = selStart + selectedStr.length;
            }
          } catch {}
          openSelectionMenu({
            quote: selectedStr,
            lineObj,
            lineIndex: idx,
            selStart,
            selEnd,
            clientX: rect ? rect.left + rect.width / 2 : e.clientX,
            clientY: rect ? (rect.top < 240 ? rect.bottom : rect.top) : e.clientY
          });
        }
      };

      const handleLinePointerDown = (e, lineObj, idx) => {
        if (e.button && e.button !== 0) return;
        const { clientX, clientY } = e;
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);

        longPressTimerRef.current = setTimeout(() => {
          const existingSel = window.getSelection()?.toString().trim();
          if (existingSel) {
            openSelectionMenu({ quote: existingSel, lineObj, lineIndex: idx, clientX, clientY });
            return;
          }
          let targetQuote = lineObj.text;
          const caretRange = document.caretRangeFromPoint ? document.caretRangeFromPoint(clientX, clientY) : null;
          if (caretRange?.startContainer?.nodeType === Node.TEXT_NODE) {
            const nodeText = caretRange.startContainer.textContent || '';
            const offset = caretRange.startOffset || 0;
            const leftPart = nodeText.slice(0, offset).match(/[A-Za-z0-9'-]+$|[\u4e00-\u9fff]{1,4}$/);
            const rightPart = nodeText.slice(offset).match(/^[A-Za-z0-9'-]+|^[\u4e00-\u9fff]{1,4}/);
            const candidate = `${leftPart ? leftPart[0] : ''}${rightPart ? rightPart[0] : ''}`.trim();
            if (candidate.length >= 2) targetQuote = candidate;
          }
          openSelectionMenu({ quote: targetQuote, lineObj, lineIndex: idx, clientX, clientY });
        }, 420);
      };

      const cancelLongPress = () => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
      };

      const handleRunContextualTranslate = async () => {
        if (!selectionPopover || selectionPopover.deepLoading) return;
        const activeKey = (geminiApiKey || window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
        if (!activeKey) {
          setShowAccountModal(true);
          showToast('請設定一次 Google Gemini API Key，之後將永久自動生效');
          return;
        }

        setSelectionPopover((prev) => (prev ? { ...prev, deepLoading: true, deepError: '' } : null));

        try {
          const geminiSchema = {
            type: 'OBJECT',
            properties: {
              detectedGenre: { type: 'STRING' },
              rigorousTranslation: { type: 'STRING' },
              contextualNuance: { type: 'STRING' },
              keyTerms: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: { term: { type: 'STRING' }, meaningInContext: { type: 'STRING' } },
                  required: ['term', 'meaningInContext']
                }
              }
            },
            required: ['detectedGenre', 'rigorousTranslation', 'contextualNuance']
          };

          const prompt = `【文獻標題】：${docMeta.title}
【文獻領域】：${docMeta.domainHint}
【上下文完整段落】：${selectionPopover.paragraphContext}
【目標詞句】：${selectionPopover.quote}

請根據學術領域脈絡，提供嚴謹貼切的繁體中文語境翻譯與深層論證角色解析。`;

          const { text } = await callGeminiFlash({
            geminiKey: activeKey,
            systemInstruction: '嚴謹學術導讀譯者。緊扣文章脈絡以繁體中文回傳 JSON。',
            messages: [{ role: 'user', text: prompt }],
            thinkingLevelObj: THINKING_LEVELS[1],
            expectJson: true,
            geminiJsonSchema: geminiSchema
          });

          const parsed = JSON.parse(text);
          setSelectionPopover((prev) =>
            prev ? { ...prev, deepLoading: false, deepResult: parsed } : null
          );
        } catch (err) {
          setSelectionPopover((prev) =>
            prev ? { ...prev, deepLoading: false, deepError: err.message } : null
          );
        }
      };

      const handleAddHighlight = (colorId = 'ochre', initialTag = customTags[0] || '重要概念') => {
        if (!selectionPopover) return;
        const autoNote = selectionPopover.deepResult
          ? `【深譯】${selectionPopover.deepResult.rigorousTranslation} — ${selectionPopover.deepResult.contextualNuance}`
          : selectionPopover.quickResult
          ? `【快譯】${selectionPopover.quickResult.translation}`
          : '';

        const newHl = {
          id: `hl-${Date.now()}`,
          lineId: selectionPopover.lineId,
          lineIndex: selectionPopover.lineIndex,
          pageNumber: selectionPopover.pageNumber,
          quote: selectionPopover.quote,
          colorId,
          tag: initialTag,
          note: autoNote,
          ...(selectionPopover.selStart >= 0 ? { qStart: selectionPopover.selStart } : {}),
          ...(selectionPopover.parentId && textHighlights.some((h) => h.id === selectionPopover.parentId)
            ? { parentId: selectionPopover.parentId }
            : {}),
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setTextHighlights((prev) => [newHl, ...prev]);
        setSelectionPopover(null);
        window.getSelection()?.removeAllRanges();
        setSidebarTab('highlights');
        setShowRightSidebar(true);
        setEditingHlNoteId(newHl.id);
        setExpandedHlIds((prev) => ({ ...prev, [newHl.id]: true }));
        if (selectionPopover.parentSource === 'lock') setSubParentLockId(null);
        setTimeout(() => {
          const el = document.getElementById(`hl-card-${newHl.id}`);
          if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }, 90);
        showToast(newHl.parentId ? '已加入子標註，可自由選取 Hashtag 或編輯筆記' : '已加入重點標註，可自由選取 Hashtag 或編輯筆記');
      };

      const handleJumpToLine = (targetLineId, targetLineIdx) => {
        let index = typeof targetLineIdx === 'number' ? targetLineIdx : -1;
        if (index === -1 || !readingLines[index] || readingLines[index].id !== targetLineId) {
          index = readingLines.findIndex((l) => l.id === targetLineId);
        }
        if (index === -1) {
          showToast('找不到該段落位置');
          return;
        }
        if (viewMode === 'pdf') setViewMode('split');

        setIsAutoPlaying(false);
        setActiveLineIdx(index);
        setPulseLineId(targetLineId);

        setTimeout(() => {
          const el = lineRefs.current[index];
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 40);

        setTimeout(() => {
          setPulseLineId((curr) => (curr === targetLineId ? null : curr));
        }, 1800);
      };

      // 卡片展開／收合
      const toggleHlExpanded = (id) => {
        const isOpen = !!expandedHlIds[id] || editingHlNoteId === id;
        setExpandedHlIds((prev) => {
          const next = { ...prev };
          if (isOpen) delete next[id];
          else next[id] = true;
          return next;
        });
        if (isOpen && editingHlNoteId === id) setEditingHlNoteId(null);
      };

      const toggleAllHlExpanded = () => {
        const allOpen = visibleCards.length > 0 && visibleCards.every(({ hl }) => expandedHlIds[hl.id]);
        if (allOpen) {
          setExpandedHlIds({});
          setEditingHlNoteId(null);
        } else {
          const m = {};
          visibleCards.forEach(({ hl }) => { m[hl.id] = true; });
          setExpandedHlIds(m);
        }
      };

      // 更換母標註（拿掉 parentId 代表最上層）
      const setHighlightParent = (id, parentId) => {
        setTextHighlights((prev) =>
          prev.map((h) => {
            if (h.id !== id) return h;
            const { parentId: _old, ...rest } = h;
            return parentId ? { ...rest, parentId } : rest;
          })
        );
      };

      // mode: 'cascade' 連同子孫一併刪除；'promote' 只刪此則、子標註升一層
      const deleteHighlightWithMode = (id, mode) => {
        setTextHighlights((prev) => {
          const target = prev.find((h) => h.id === id);
          if (!target) return prev;
          if (mode === 'promote') {
            return prev
              .filter((h) => h.id !== id)
              .map((h) => {
                if (h.parentId !== id) return h;
                const { parentId: _old, ...rest } = h;
                return target.parentId ? { ...rest, parentId: target.parentId } : rest;
              });
          }
          const kill = new Set([id, ...collectDescendantIds(id, prev)]);
          return prev.filter((h) => !kill.has(h.id));
        });
        setParentDeletePromptId(null);
        setSubParentLockId((cur) => (cur === id ? null : cur));
      };

      const requestDeleteHighlight = (hl) => {
        if ((childCountById[hl.id] || 0) > 0) setParentDeletePromptId(hl.id);
        else deleteHighlightWithMode(hl.id, 'cascade');
      };

      // 「+ 子標註」：鎖定母標註，跳到原文，等使用者反白選字
      const startSubHighlight = (hl) => {
        setSubParentLockId(hl.id);
        handleJumpToLine(hl.lineId, hl.lineIndex);
        showToast('請在文章中反白選字，會新增為此重點的子標註');
      };

      const handleCopyArchitecturePrompt = async () => {
        if (textHighlights.length === 0) {
          showToast('尚無重點可複製');
          return;
        }
        const text = buildArchitecturePromptText({
          title: docMeta.title,
          numPages: docMeta.numPages,
          highlights: textHighlights,
          inlineNotes,
          colors: MARKER_COLORS
        });
        const ok = await copyTextToClipboard(text);
        if (ok) {
          setCopiedPrompt(true);
          setTimeout(() => setCopiedPrompt(false), 2200);
          showToast(`已複製 ${textHighlights.length} 則重點與架構表指令`);
        } else {
          showToast('複製失敗：瀏覽器未允許存取剪貼簿');
        }
      };

      const handlePinChatAsNote = (chatMsg) => {
        const curLine = readingLines[activeLineIdx];
        const tag = 'AI 導讀總結';
        if (!customTags.includes(tag)) setCustomTags((prev) => [...prev, tag]);

        const newHl = {
          id: `hl-pin-${Date.now()}`,
          lineId: curLine?.id || 'manual',
          lineIndex: activeLineIdx,
          pageNumber: curLine?.pageNumber || 1,
          quote: chatMsg.quote || curLine?.text || 'AI 導讀觀點',
          colorId: 'dustyBlue',
          tag,
          note: chatMsg.content,
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setTextHighlights((prev) => [newHl, ...prev]);
        showToast('已釘選收錄至重點筆記清單！');
      };

      const handleSendChat = async (e) => {
        if (e) e.preventDefault();
        const question = chatInput.trim();
        if ((!question && !quotedContext) || isChatSending) return;

        const activeKey = (geminiApiKey || window.localStorage.getItem(LS_KEYS.API_KEY) || '').trim();
        if (!activeKey) {
          setShowAccountModal(true);
          showToast('請設定一次 Google Gemini API Key，之後將永久生效');
          return;
        }

        const effectiveQuestion = question || '請結合上下文脈絡，深入解析這段文字的核心概念。';
        const currentQuote = quotedContext;
        const levelObj = THINKING_LEVELS.find((t) => t.id === thinkingLevel) || THINKING_LEVELS[2];

        const userMsg = {
          id: `u-${Date.now()}`,
          role: 'user',
          quote: currentQuote?.quote || '',
          pageNumber: currentQuote?.pageNumber || null,
          content: effectiveQuestion
        };

        setChatMessages((prev) => [...prev, userMsg]);
        setChatInput('');
        setQuotedContext(null);
        setIsChatSending(true);

        try {
          const historyMsgs = chatMessages
            .filter((m) => m.id !== 'welcome-msg')
            .slice(-10)
            .map((m) => ({
              role: m.role === 'assistant' ? 'assistant' : 'user',
              text: m.quote ? `【引用原文】"${m.quote}"\n【提問】${m.content}` : m.content
            }));

          const currentTurnPrompt = currentQuote
            ? `【文獻標題】：${docMeta.title}（${docMeta.domainHint}）\n【選取處段落 (P.${currentQuote.pageNumber})】：${currentQuote.paragraphContext}\n【目標詞句】："${currentQuote.quote}"\n\n【問題】：${effectiveQuestion}`
            : `【文獻標題】：${docMeta.title}\n【當前段落】：${readingLines[activeLineIdx]?.paragraphContext || ''}\n\n【問題】：${effectiveQuestion}`;

          historyMsgs.push({ role: 'user', text: currentTurnPrompt });

          const { text, thought } = await callGeminiFlash({
            geminiKey: activeKey,
            systemInstruction: '你是專為 ADHD 設計的學術導讀助理。回答結構清晰、條列重點，使用繁體中文。',
            messages: historyMsgs,
            thinkingLevelObj: levelObj,
            expectJson: false
          });

          setChatMessages((prev) => [
            ...prev,
            {
              id: `a-${Date.now()}`,
              role: 'assistant',
              model: LOCKED_GEMINI_MODEL,
              thinkingLabel: levelObj.label,
              thought,
              quote: currentQuote?.quote || '',
              content: text || '已完成推理。'
            }
          ]);
        } catch (err) {
          setChatMessages((prev) => [
            ...prev,
            {
              id: `err-${Date.now()}`,
              role: 'assistant',
              model: LOCKED_GEMINI_MODEL,
              thinkingLabel: '異常',
              content: `無法取得回應：${err.message}`
            }
          ]);
        } finally {
          setIsChatSending(false);
        }
      };

      // 所有可用 Hashtag 集合（合併自訂標籤與歷史筆記標籤）
      const allAvailableTags = useMemo(() => {
        const set = new Set(customTags);
        textHighlights.forEach((h) => { if (h.tag) set.add(h.tag); });
        return Array.from(set);
      }, [customTags, textHighlights]);

      const colorIdOf = (h) => (MARKER_COLORS.find((c) => c.id === h.colorId) || MARKER_COLORS[0]).id;

      const filteredHighlights = useMemo(() => {
        return textHighlights.filter(
          (h) =>
            (selectedTagFilter === 'ALL' || h.tag === selectedTagFilter) &&
            (colorFilter === 'ALL' || colorIdOf(h) === colorFilter)
        );
      }, [textHighlights, selectedTagFilter, colorFilter]);

      const colorCounts = useMemo(() => {
        const m = {};
        textHighlights.forEach((h) => {
          const id = colorIdOf(h);
          m[id] = (m[id] || 0) + 1;
        });
        return m;
      }, [textHighlights]);

      const hlById = useMemo(() => {
        const m = {};
        textHighlights.forEach((h) => { m[h.id] = h; });
        return m;
      }, [textHighlights]);

      const hlDepthById = useMemo(() => computeHighlightDepths(textHighlights), [textHighlights]);
      const allHlTree = useMemo(() => buildHighlightTree(textHighlights, 'array'), [textHighlights]);
      const childCountById = useMemo(() => {
        const m = {};
        textHighlights.forEach((h) => {
          if (h.parentId && hlById[h.parentId]) m[h.parentId] = (m[h.parentId] || 0) + 1;
        });
        return m;
      }, [textHighlights, hlById]);
      const isHlFiltering = selectedTagFilter !== 'ALL' || colorFilter !== 'ALL';
      const visibleCards = useMemo(
        () => (isHlFiltering ? filteredHighlights.map((h) => ({ hl: h, depth: 0 })) : allHlTree),
        [isHlFiltering, filteredHighlights, allHlTree]
      );
      textHighlightsRef.current = textHighlights;
      subParentLockRef.current = subParentLockId;

      const filteredLibraryDocs = useMemo(() => {
        let list = libraryDocs;
        if (selectedFolderId === 'UNCATEGORIZED') list = libraryDocs.filter((d) => !d.folderId);
        else if (selectedFolderId !== 'ALL') list = libraryDocs.filter((d) => d.folderId === selectedFolderId);
        const tokens = librarySearch.toLowerCase().split(/\s+/).filter(Boolean);
        if (tokens.length === 0) return list;
        return list.filter((d) => {
          const hay = `${d.title || ''} ${d.filename || ''}`.toLowerCase();
          return tokens.every((t) => hay.includes(t));
        });
      }, [libraryDocs, selectedFolderId, librarySearch]);

      // 渲染帶有莫蘭迪底色重點的文字（支援螢幕與純文字 PDF 列印）
      // 支援母子重疊：多層底色以巢狀 <mark> 疊出，兩層以上時以不同高度的底線區分層級
      const renderHighlightedLineText = (line, isForPrint = false) => {
        const lineHls = textHighlights.filter((h) => highlightAppliesToLine(h, line));
        if (lineHls.length === 0) return line.text;

        const ranges = [];
        for (const hl of lineHls) {
          const r = getHighlightRangeInLine(hl, line);
          if (r) ranges.push({ start: r.start, end: r.end, hl, depth: hlDepthById[hl.id] || 0 });
        }
        if (ranges.length === 0) return line.text;

        const segs = buildHighlightSegments(line.text, ranges);
        const nodes = [];
        segs.forEach((seg, i) => {
          const txt = line.text.slice(seg.a, seg.b);
          if (seg.layers.length === 0) {
            nodes.push(txt);
            return;
          }
          // 外層（範圍較大／層級較淺）在前，最內層最後
          const layers = [...seg.layers].sort(
            (x, y) => (y.end - y.start) - (x.end - x.start) || x.depth - y.depth
          );
          let inner = txt;
          for (let li = layers.length - 1; li >= 0; li--) {
            const L = layers[li];
            const cObj = MARKER_COLORS.find((c) => c.id === L.hl.colorId) || MARKER_COLORS[0];
            const level = layers.length - 1 - li; // 0 = 最內層
            const isStart = seg.a === L.start;
            const isEnd = seg.b === L.end;
            inner = (
              <mark
                key={`${i}-${li}`}
                style={{
                  backgroundColor: isForPrint ? cObj.printBg : currentTheme.isDark ? cObj.bgDark : cObj.bgLight,
                  color: isForPrint ? '#111827' : 'inherit',
                  borderBottom: `2px solid ${cObj.hex}`,
                  paddingTop: 2,
                  paddingBottom: 2 + level * 3,
                  paddingLeft: isStart ? 4 : 0,
                  paddingRight: isEnd ? 4 : 0,
                  borderRadius: `${isStart ? 4 : 0}px ${isEnd ? 4 : 0}px ${isEnd ? 4 : 0}px ${isStart ? 4 : 0}px`
                }}
              >
                {inner}
              </mark>
            );
          }
          nodes.push(inner);
        });
        return nodes;
      };

      // 預先算好每一行的底色節點：自動播放時整個畫面每一幀都會重繪，避免每幀重算
      const screenLineNodes = useMemo(() => {
        const m = {};
        readingLines.forEach((l) => { m[l.id] = renderHighlightedLineText(l, false); });
        return m;
      }, [readingLines, textHighlights, hlDepthById, currentTheme.isDark]);

      const fontClass =
        settings.fontFamily === 'serif'
          ? 'font-reader-serif'
          : settings.fontFamily === 'mono'
          ? 'font-reader-mono'
          : 'font-reader-sans';

      const pdfPageNumbers = useMemo(() => {
        const total = Math.max(1, docMeta.numPages || 1);
        return Array.from({ length: total }, (_, idx) => idx + 1);
      }, [docMeta.numPages]);

      return (
        <>
          {/* =================================================================
              螢幕主應用殼層（列印時隱藏，不影響多頁純文字匯出）
             ================================================================= */}
          <div
            id="screen-app-shell"
            className="h-screen w-full flex flex-col overflow-hidden transition-colors duration-300 no-print"
            style={{ backgroundColor: 'var(--bg-app)', color: 'var(--text-main)' }}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => {
              e.preventDefault();
              if (e.dataTransfer?.files?.length) handleImportPdfFiles(e.dataTransfer.files);
            }}
          >
            {/* 隱藏 File Inputs */}
            <input
              ref={fileInputRef}
              type="file"
              accept="application/pdf,.pdf"
              multiple
              className="hidden"
              onChange={(e) => handleImportPdfFiles(e.target.files)}
            />
            <input
              ref={backupInputRef}
              type="file"
              accept=".json"
              className="hidden"
              onChange={handleRestoreBackupFile}
            />

            {/* 匯入進度遮罩 */}
            {importProgressText && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center">
                <div
                  style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                  className="px-6 py-4 rounded-2xl border shadow-2xl text-xs font-semibold flex items-center gap-3"
                >
                  <span className="w-2.5 h-2.5 rounded-full animate-ping" style={{ backgroundColor: 'var(--accent)' }} />
                  <span>{importProgressText}</span>
                </div>
              </div>
            )}

            {/* 頂部導覽列 */}
            <header
              style={{ backgroundColor: 'var(--bg-header)', borderColor: 'var(--border-color)' }}
              className="h-14 px-3 sm:px-4 flex items-center justify-between gap-2 border-b shrink-0 z-30 relative backdrop-blur-md"
            >
              {/* 左區：書庫（支援分類資料夾） + 匯入 PDF */}
              <div className="flex items-center gap-2 min-w-0">
                <div className="relative min-w-0 shrink">
                  <button
                    onClick={() => {
                      setShowLibraryMenu((v) => !v);
                      setShowSettingsPanel(false);
                    }}
                    style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                    className="flex items-center gap-2 h-9 px-3 rounded-xl border shrink min-w-0 w-[140px] sm:w-[205px] transition hover:opacity-90"
                    title="開啟個人書庫與分類資料夾"
                  >
                    <span className="opacity-70 shrink-0"><Icon name="folder" className="w-4 h-4" /></span>
                    <span className="truncate text-xs sm:text-sm font-medium flex-1 text-left">
                      {activeDocId ? docMeta.title : `書庫 (${libraryDocs.length})`}
                    </span>
                    <span className="opacity-55 shrink-0"><Icon name="down" className="w-3.5 h-3.5" /></span>
                  </button>

                  {showLibraryMenu && (
                    <div
                      style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                      className="absolute left-0 top-11 w-[340px] sm:w-[440px] rounded-2xl border p-4 shadow-2xl z-50 space-y-3"
                    >
                      <div className="flex items-center justify-between gap-2 pb-2.5 border-b" style={{ borderColor: 'var(--border-color)' }}>
                        <div className="min-w-0">
                          <h3 className="text-xs font-bold truncate">已保存書庫 ({libraryDocs.length})</h3>
                          <p className="text-[11px] truncate mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            支援自訂分類資料夾管理
                          </p>
                        </div>
                        <button
                          onClick={() => fileInputRef.current?.click()}
                          style={{ backgroundColor: 'var(--accent)' }}
                          className="h-8 px-3 rounded-lg text-white text-xs font-medium flex items-center gap-1.5 whitespace-nowrap shrink-0"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5" />
                          <span>匯入 PDF</span>
                        </button>
                      </div>

                      {/* 書庫關鍵字搜尋（即時篩選檔名／標題；Esc 先清空、再關閉） */}
                      <div className="relative">
                        <span className="absolute left-2.5 top-1/2 -translate-y-1/2 opacity-55 pointer-events-none">

                              <span className="min-w-0 truncate">

                              <div className="flex items-center gap-1.5 shrink-0">
                                <button
                                  onClick={() => {
                                    handleDeleteFolder(target.id);
                                    setConfirmDeleteFolderId(null);

                                  className="px-2 py-1 rounded-md text-white font-medium"
                                >

                                <button
                                  onClick={() => setConfirmDeleteFolderId(null)}
                                  style={{ borderColor: 'var(--border-color)' }}
                                  className="px-2 py-1 rounded-md border font-medium"

                            </div>

                      {/* 書庫檔案列表 */}

                            {librarySearch.trim() ? `找不到符合「${librarySearch.trim()}」的檔案` : '此資料夾尚無檔案'}

                        ) : (
                          filteredLibraryDocs.map((item) => {
                            const isCurrent = item.id === activeDocId;
                            const isConfirming = confirmDeleteId === item.id;
                            return (
                              <div
                                key={item.id}

                                  backgroundColor: isCurrent ? 'var(--accent-soft)' : 'transparent',

                                  <div className="flex-1 min-w-0" onClick={(e) => e.stopPropagation()}>
                                    <input
                                      autoFocus
                                      value={renameDraft}
                                      maxLength={120}

                                      onFocus={(e) => e.target.select()}
                                      onKeyDown={(e) => {
                                        if (e.key === 'Enter') {
                                          e.preventDefault();
                                          e.currentTarget.dataset.done = '1';
                                          handleRenameDocument(item.id, renameDraft);
                                        } else if (e.key === 'Escape') {
                                          e.preventDefault();
                                          e.stopPropagation();
                                          e.currentTarget.dataset.done = '1';
                                          setRenamingDocId(null);
                                        }
                                      }}
                                      onBlur={(e) => {
                                        if (e.currentTarget.dataset.done) return;
                                        handleRenameDocument(item.id, renameDraft);
                                      }}

                          </button>

                <button

                        className="w-full text-left rounded-lg border p-2.5 transition hover:opacity-90"
                      >
                        <div className="font-semibold leading-snug">P.{f.page}　「{shortQuote(f.quote, 60)}」</div>
                        <div className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{f.reason}</div>
                      </button>
                    ))}
                  </div>
                  <div className="flex justify-end">
                    <button
                      onClick={() => setSyncReport(null)}
                      style={{ backgroundColor: 'var(--accent)' }}
                      className="px-4 py-1.5 rounded-xl text-white text-xs font-semibold"
                    >
                      知道了
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Toast 通知 */}
            {toastMsg && (
              <div
                style={{ backgroundColor: 'var(--accent)' }}
                className="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-white text-xs font-medium shadow-lg pointer-events-none"
              >
                {toastMsg}
              </div>
            )}
          </div>

          {/* =================================================================
              專屬純文字 PDF 完整多頁列印排版層（螢幕隱藏、列印展開第 1 至最後一頁，無閱讀框）
             ================================================================= */}
          <div id="print-clean-layer" className={fontClass}>
            {activeDocId && (
              <div style={{ maxWidth: '100%', margin: '0 auto', color: '#111827' }}>
                <div style={{ borderBottom: '2px solid #cbd5e1', paddingBottom: '12px', marginBottom: '20px' }}>
                  <h1 style={{ fontSize: '22pt', fontWeight: 700, margin: '0 0 6px 0', lineHeight: 1.3 }}>
                    {docMeta.title}
                  </h1>
                  <div style={{ fontSize: '10pt', color: '#475569' }}>
                    {docMeta.subtitle} • 純文字與重點筆記完整匯出
                  </div>
                </div>

                {/* 完整輸出第 1 頁至最後一頁純文字、底色劃記與行間筆記（無外框、無變暗） */}
                <div>
                  {readingLines.map((line, idx) => {
                    const prevLine = idx > 0 ? readingLines[idx - 1] : null;
                    const showPageHeader = !prevLine || prevLine.pageNumber !== line.pageNumber;
                    const noteText = inlineNotes[line.id]?.trim();

                    return (
                      <React.Fragment key={`print-${line.id}`}>
                        {showPageHeader && (
                          <div
                            style={{
                              marginTop: idx === 0 ? '4px' : '22px',
                              marginBottom: '10px',
                              paddingBottom: '4px',
                              borderBottom: '1px solid #e2e8f0',
                              fontSize: '9.5pt',
                              fontWeight: 600,
                              color: '#64748b'
                            }}
                            className="print-heading"
                          >
                            Page {line.pageNumber} / {docMeta.numPages}
                          </div>
                        )}

                        <div style={{ marginBottom: '10px' }}>
                          <p
                            style={{
                              margin: 0,
                              fontSize: line.type === 'heading' ? '14.5pt' : '11.5pt',
                              fontWeight: line.type === 'heading' ? 700 : 400,
                              lineHeight: 1.75,
                              color: '#111827'
                            }}
                          >
                            {renderHighlightedLineText(line, true)}
                          </p>

                          {noteText && (
                            <div
                              className="print-note-box"
                              style={{
                                marginTop: '6px',
                                marginLeft: '12px',
                                padding: '6px 10px',
                                borderLeft: '3px solid #5e7a94',
                                backgroundColor: '#f8fafc',
                                color: '#334155',
                                fontSize: '10pt',
                                lineHeight: 1.55,
                                whiteSpace: 'pre-wrap'
                              }}
                            >
                              <strong>行間筆記：</strong>{noteText}
                            </div>
                          )}
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>

                {/* 文末重點標註與 Hashtag 總整理 */}
                {textHighlights.length > 0 && (
                  <div style={{ marginTop: '32px', paddingTop: '18px', borderTop: '2px solid #cbd5e1' }}>
                    <h2 style={{ fontSize: '15pt', fontWeight: 700, marginBottom: '12px', color: '#0f172a' }}>
                      重點標註與筆記總整理 ({textHighlights.length})
                    </h2>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                      {textHighlights.map((hl) => {
                        const cObj = MARKER_COLORS.find((c) => c.id === hl.colorId) || MARKER_COLORS[0];
                        return (
                          <div
                            key={`print-hl-${hl.id}`}
                            className="print-note-box"
                            style={{
                              padding: '8px 12px',
                              borderLeft: `4px solid ${cObj.hex}`,
                              backgroundColor: '#f8fafc',
                              fontSize: '10.5pt',
                              lineHeight: 1.6
                            }}
                          >
                            <div style={{ fontSize: '9pt', color: '#475569', fontWeight: 600, marginBottom: '3px' }}>
                              Page {hl.pageNumber || 1} {hl.tag ? `• #${hl.tag}` : ''}
                            </div>
                            <div style={{ fontWeight: 600, color: '#111827' }}>「{hl.quote}」</div>
                            {hl.note && (
                              <div style={{ marginTop: '4px', color: '#334155', whiteSpace: 'pre-wrap' }}>
                                註釋：{hl.note}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
