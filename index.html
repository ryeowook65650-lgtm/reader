    // =========================================================================
    // 2. 本機 IndexedDB 永久儲存引擎 (依帳號 UID 完全獨立隔離書庫、PDF 與筆記)
    // =========================================================================
    const IDB_NAME = 'ADHDFocusReaderClean_v2';
    const IDB_VERSION = 1;

    function openReaderDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('瀏覽器不支援 IndexedDB'));
          return;
        }
        const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('documents')) {
            db.createObjectStore('documents', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('kv')) {
            db.createObjectStore('kv', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGetKV(key, fallback = null) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readonly');
          const req = tx.objectStore('kv').get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : fallback);
          req.onerror = () => resolve(fallback);
        });
      } catch {
        return fallback;
      }
    }

    async function idbSetKV(key, value) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbGetScopedKV(uid, key, fallback = null) {
      const val = await idbGetKV(`${uid}::${key}`, undefined);
      return val !== undefined ? val : fallback;
    }

    async function idbSetScopedKV(uid, key, value) {
      return idbSetKV(`${uid}::${key}`, value);
    }

    async function idbGetAllDocs(uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readonly');
          const req = tx.objectStore('documents').getAll();
          req.onsuccess = () => {
            const list = (req.result || []).filter((d) => (d.ownerUid || 'local-owner') === uid);
            resolve(list);
          };
          req.onerror = () => resolve([]);
        });
      } catch {
        return [];
      }
    }

    async function idbPutDoc(docRecord, uid = 'local-owner') {
      try {
        const db = await openReaderDB();
        const payload = { ...docRecord, ownerUid: uid || docRecord.ownerUid || 'local-owner' };
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').put(payload);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        return false;
      }
    }

    async function idbDeleteDoc(docId) {
      try {
        const db = await openReaderDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').delete(docId);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {

    // =========================================================================
    // 4. 多頁文字型 PDF 解析、免金鑰極速字典與 AI 雙引擎呼叫函式
    // =========================================================================
    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return 'PDF 檔案';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function splitParagraphIntoSentences(text) {
      if (!text) return [];
      const cleaned = text.replace(/\s+/g, ' ').trim();
      if (!cleaned) return [];
      const rawParts = cleaned.match(/[^.!?。！？]+(?:[.!?。！？]+['"”’)]*|\s*$)/g) || [cleaned];
      const merged = [];
      for (const part of rawParts) {
        const trimmed = part.trim();
        if (!trimmed) continue;
        const prev = merged[merged.length - 1];
        if (
          prev &&
          (/(?:\b(?:Dr|Prof|Mr|Mrs|Ms|Jr|Sr|vs|etc|e\.g|i\.e|U\.S|cf|ib|op|p|pp|Fig|No)\.|[0-9]\.)$/i.test(prev) ||
            prev.length < 14)
        ) {
          merged[merged.length - 1] = `${prev} ${trimmed}`;
        } else {
          merged.push(trimmed);
        }
      }
      return merged;
    }

    // 多頁文字 PDF 精準解析引擎 (支援 CMap、Y/X 座標排序、跨行連字號接合與標題辨識)
    async function extractStructuredPagesFromPdf(pdfDoc, filterHeaderFooter = true, onProgress = null) {
      const pages = [];
      let totalCharCount = 0;

      for (let p = 1; p <= pdfDoc.numPages; p++) {
        if (onProgress) onProgress(p, pdfDoc.numPages);
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        const pageHeight = viewport.height || 800;
        const textContent = await page.getTextContent();
        const rawItems = textContent.items || [];

        const items = [];
        for (const item of rawItems) {
          const str = (item.str || '').replace(/\u0000/g, '');
          if (!str.trim()) continue;
          const tx = item.transform ? item.transform[4] : 0;
          const ty = item.transform ? item.transform[5] : 0;
          const fontH = Math.max(
            8,
            Math.hypot(item.transform?.[0] || 0, item.transform?.[1] || 0) || item.height || 12
          );

          if (filterHeaderFooter) {
            const isNearEdge = ty > pageHeight * 0.94 || ty < pageHeight * 0.055;
            const isStamp =
              /^https?:\/\//i.test(str.trim()) ||
              /^[-–—]?\s*\d+\s*[-–—]?$/.test(str.trim()) ||
              /^\d+\s*\/\s*\d+$/.test(str.trim());
            if (isNearEdge && isStamp) continue;
          }

          items.push({
            str,
            x: tx,
            y: ty,
            w: item.width || str.length * fontH * 0.5,
            h: fontH
          });
        }

        if (items.length === 0) {
          pages.push({ pageNumber: p, blocks: [] });
          continue;
        }

        items.sort((a, b) => {
          if (Math.abs(b.y - a.y) > Math.min(a.h, b.h) * 0.45) {
            return b.y - a.y;
          }
          return a.x - b.x;
        });

        const visualLines = [];
        for (const it of items) {
          const lastLine = visualLines[visualLines.length - 1];
          if (lastLine && Math.abs(lastLine.y - it.y) <= Math.max(lastLine.h, it.h) * 0.48) {
            const prevItem = lastLine.items[lastLine.items.length - 1];
            const gap = it.x - (prevItem.x + prevItem.w);
            const isCJK = /[\u4e00-\u9fff]$/.test(lastLine.text) || /^[\u4e00-\u9fff]/.test(it.str);
            const needSpace =
              !isCJK &&
              gap > it.h * 0.16 &&
              !/[\s\-–—/(\[「『（]$/.test(lastLine.text) &&
              !/^[\s.,;:!?%)\]」』）]/.test(it.str);
            lastLine.text += (needSpace ? ' ' : '') + it.str;
            lastLine.items.push(it);
            lastLine.h = Math.max(lastLine.h, it.h);
          } else {
            visualLines.push({
              text: it.str.trim(),
              y: it.y,
              x: it.x,
              h: it.h,
              items: [it]
            });
          }
        }

        const sortedHeights = visualLines.map((l) => l.h).sort((a, b) => a - b);
        const medianH = sortedHeights[Math.floor(sortedHeights.length / 2)] || 12;

        const blocks = [];
        let currentBlock = null;

        for (const line of visualLines) {
          const lineText = line.text.trim();
          if (!lineText) continue;
          totalCharCount += lineText.length;
          const isHeading = line.h >= medianH * 1.2 && lineText.length < 130;

          if (!currentBlock) {
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
            continue;
          }

          const verticalGap = currentBlock.lastY - line.y;
          const paragraphBreak =
            isHeading ||
            currentBlock.type === 'heading' ||
            verticalGap > Math.max(currentBlock.lastH, line.h) * 1.72 ||
            /^(\d+\.|[•·\-▪])\s+/.test(lineText);

          if (paragraphBreak) {
            blocks.push({ type: currentBlock.type, text: currentBlock.text });
            currentBlock = {
              type: isHeading ? 'heading' : 'paragraph',
              text: lineText,
              lastY: line.y,
              lastH: line.h
            };
          } else {
            if (/[a-zA-Z]-$/.test(currentBlock.text) && /^[a-z]/.test(lineText)) {
              currentBlock.text = currentBlock.text.slice(0, -1) + lineText;
            } else {
              const bothCJK =
                /[\u4e00-\u9fff，。；：「」『』（）！？”’]$/.test(currentBlock.text) &&
                /^[\u4e00-\u9fff「『（]/.test(lineText);
              currentBlock.text = `${currentBlock.text}${bothCJK ? '' : ' '}${lineText}`;
            }
            currentBlock.lastY = line.y;
            currentBlock.lastH = line.h;
          }
        }

        if (currentBlock && currentBlock.text.trim()) {
          blocks.push({ type: currentBlock.type, text: currentBlock.text.trim() });
        }
        pages.push({ pageNumber: p, blocks });
      }

      return { pages, totalCharCount };
    }

    // 免金鑰高速字典直譯通道 (完全不消耗 Gemini / OpenAI API 額度)
    async function fetchKeylessInstantDictionary(queryText) {
      // 通道 1：公開字典與快速直譯介面 (50~150ms 極速回應，單字自動附帶詞性與多義項)
      try {
        const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(queryText)}`;
        const res = await fetch(gtxUrl);
        if (res.ok) {
          const data = await res.json();
          const mainTrans = Array.isArray(data?.[0])
            ? data[0].map((seg) => seg?.[0] || '').join('').trim()
            : '';
          let posNote = '';
          if (Array.isArray(data?.[1]) && data[1].length > 0) {
            posNote = data[1]
              .slice(0, 2)
              .map((entry) => `${entry[0]}：${(entry[1] || []).slice(0, 4).join('、')}`)
              .join(' ｜ ');
          }
          if (mainTrans) {
            return { translation: mainTrans, posOrNote: posNote };
          }
        }
      } catch {
        // 自動降級至備用字典通道
      }

      // 通道 2：MyMemory 開放翻譯字典備援
      const isAsciiLang = /^[A-Za-z0-9\s.,'?!:;()-]+$/.test(queryText);
      const langPair = isAsciiLang ? 'en|zh-TW' : 'autodetect|zh-TW';
      const mmRes = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(queryText)}&langpair=${langPair}`
      );
      if (!mmRes.ok) {
        throw new Error('免費字典通道暫時忙碌，請直接點下方「語境深譯」');
      }
      const mmData = await mmRes.json();
      const mmText = mmData?.responseData?.translatedText?.trim();
      if (!mmText) {
        throw new Error('查無直譯結果，請點下方「語境深譯」');
      }
      return { translation: mmText, posOrNote: '' };
    }

    // 雙引擎 AI 呼叫介面 (專門用於「語境深譯」、「問問 AI 側欄」與「圖片 OCR」)
    async function callUnifiedAI({
      provider = 'gemini',
      geminiKey = '',
      openaiKey = '',
      model = 'gemini-3.8-flash',
      systemInstruction = '',
      messages = [],
      thinkingLevelObj = THINKING_LEVELS[2],
      expectJson = false,
      geminiJsonSchema = null
    }) {
      if (provider === 'openai') {
        if (!openaiKey) {
          throw new Error('請先點右上角「帳號與 AI 連線」，貼上您的 OpenAI (ChatGPT) API Key');
        }
        const effectiveModel = model.startsWith('gpt-') || model.startsWith('o') ? model : 'gpt-4o-mini';
        const isReasoningModel = effectiveModel.startsWith('o');

        const apiMessages = [];
        if (systemInstruction) {
          apiMessages.push({
            role: isReasoningModel ? 'developer' : 'system',
            content: expectJson ? `${systemInstruction}\n請務必只回傳合法的 JSON 物件。` : systemInstruction
          });
        }

        for (const m of messages) {
          if (m.imageBase64) {
            apiMessages.push({
              role: m.role === 'assistant' ? 'assistant' : 'user',
              content: [
                { type: 'text', text: m.text },
                { type: 'image_url', image_url: { url: `data:image/png;base64,${m.imageBase64}` } }
              ]
            });
          } else {
            apiMessages.push({
              role: m.role === 'assistant' ? 'assistant' : 'user',
              content: m.text
            });
          }
        }

        const payload = {
          model: effectiveModel,
          messages: apiMessages,
          ...(expectJson ? { response_format: { type: 'json_object' } } : {}),
          ...(isReasoningModel && thinkingLevelObj?.openaiEffort
            ? { reasoning_effort: thinkingLevelObj.openaiEffort }
            : {})
        };

        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${openaiKey}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.error?.message || `OpenAI 連線錯誤 (HTTP ${res.status})`);
        }
        const content = data?.choices?.[0]?.message?.content || '';
        return { text: content.trim(), thought: '' };
      }

      // Google Gemini API (支援 gemini-3.8-flash / gemini-3.8-pro)
      if (!geminiKey) {
        throw new Error('請先點右上角「帳號與 AI 連線」，貼上您的 Google Gemini API Key');
      }
      const effectiveModel = model.startsWith('gemini-') ? model : 'gemini-3.8-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${effectiveModel}:generateContent?key=${encodeURIComponent(geminiKey)}`;

      const contents = messages.map((m) => {
        const parts = [];
        if (m.imageBase64) {
          parts.push({ inlineData: { mimeType: 'image/png', data: m.imageBase64 } });
        }
        parts.push({ text: m.text });
        return {
          role: m.role === 'assistant' ? 'model' : 'user',
          parts
        };
      });

      const buildBody = (includeThinking) => {
        const generationConfig = {};
        if (expectJson) {
          generationConfig.responseMimeType = 'application/json';
          if (geminiJsonSchema) generationConfig.responseSchema = geminiJsonSchema;
        }
        if (includeThinking && typeof thinkingLevelObj?.geminiBudget === 'number') {
          generationConfig.thinkingConfig = { thinkingBudget: thinkingLevelObj.geminiBudget };
        }
        return {
          contents,
          ...(systemInstruction ? { systemInstruction: { parts: [{ text: systemInstruction }] } } : {}),
          ...(Object.keys(generationConfig).length > 0 ? { generationConfig } : {})
        };
      };

      let res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildBody(true))
      });

      // 若特定模型端點不支援 thinkingConfig 參數，自動無縫降級重送一次
      if (res.status === 400) {
        const errCheck = await res.clone().json().catch(() => ({}));
        if (/thinking/i.test(errCheck?.error?.message || '')) {
          res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildBody(false))
          });
        }
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data?.error?.message || `Gemini 連線錯誤 (HTTP ${res.status})`);
      }

      const parts = data?.candidates?.[0]?.content?.parts || [];
      let thoughtText = '';
      let answerText = '';
      for (const p of parts) {
        if (p.thought) thoughtText += p.text || '';
        else answerText += p.text || '';
      }
      return { text: answerText.trim(), thought: thoughtText.trim() };
    }

    // 將重點筆記分頁渲染成高解析度圖片嵌入匯出的 PDF
    function renderNotesPagesToPngDataUrls(title, highlights) {
      const chunks = [];
      const pageSize = 10;
      for (let i = 0; i < highlights.length; i += pageSize) {
        chunks.push(highlights.slice(i, i + pageSize));
      }

      return chunks.map((chunk, pageIdx) => {
        const canvas = document.createElement('canvas');
        canvas.width = 1190;
        canvas.height = 1684;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#faf8f4';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2c353d';
        ctx.font = 'bold 34px "Noto Sans TC", system-ui, sans-serif';
        ctx.fillText(
          `重點標註與語境筆記總整理 (${pageIdx + 1} / ${chunks.length})`,
          80,
          96
        );

        ctx.fillStyle = '#687078';
        ctx.font = '22px "Noto Sans TC", system-ui, sans-serif';
        ctx.fillText(`文獻：${(title || '').slice(0, 50)}`, 80, 140);

        ctx.strokeStyle = '#d6cfc2';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(80, 166);
        ctx.lineTo(1110, 166);
        ctx.stroke();

        let y = 215;
        const maxWidth = 1000;

        const drawWrapped = (text, x, startY, lineH, font, color) => {
          ctx.font = font;
          ctx.fillStyle = color;
          let line = '';
          let currY = startY;
          for (const ch of Array.from(text || '')) {
            if (ch === '\n') {
              ctx.fillText(line, x, currY);
              line = '';
              currY += lineH;
              continue;
            }
            if (ctx.measureText(line + ch).width > maxWidth && line) {
              ctx.fillText(line, x, currY);
              line = ch;
              currY += lineH;
              if (currY > 1590) return currY;
            } else {
              line += ch;
            }
          }
          if (line && currY <= 1590) {
            ctx.fillText(line, x, currY);
            currY += lineH;
          }
          return currY;
        };

        chunk.forEach((hl, idx) => {
          if (y > 1530) return;
          const cObj = MARKER_COLORS.find((c) => c.id === hl.colorId) || MARKER_COLORS[0];
          ctx.fillStyle = cObj.hex;
          ctx.fillRect(80, y - 22, 9, 30);

          const globalNum = pageIdx * pageSize + idx + 1;
          y = drawWrapped(
            `${globalNum}. [P.${hl.pageNumber || 1}] "${hl.quote}"`,
            104,
            y,
            32,
            'bold 22px "Noto Sans TC", system-ui, sans-serif',
            '#2b2e33'
          );
          if (hl.note) {
            y = drawWrapped(
              `↳ ${hl.note}`,
              104,
              y + 4,
              30,
              '20px "Noto Sans TC", system-ui, sans-serif',
              '#4d5359'
            );
          }
          y += 20;
        });

        return canvas.toDataURL('image/png');
      });
    }

    function decodeJwtPayload(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch {
        return null;
      }
    }

              let ny = 38;

                if (nCtx.measureText(line + ch).width > 320) {
                  nCtx.fillText(line, 18, ny);
                  line = ch;
                  ny += 28;
                } else {
                  line += ch;
                }
              }
              if (line) nCtx.fillText(line, 18, ny);

              const pngImg = await pdfDoc.embedPng(noteCanvas.toDataURL('image/png'));
              const drawW = 135;
              const drawH = 60;
              page.drawImage(pngImg, {
                x: Math.min(width - drawW - 10, ann.x * width),
                y: Math.max(10, (1 - ann.y) * height - drawH),
                width: drawW,
                height: drawH
              });
            }
          }

          if (textHighlights.length > 0) {
            const summaryUrls = renderNotesPagesToPngDataUrls(docMeta.title, textHighlights);
            for (const dataUrl of summaryUrls) {
              const png = await pdfDoc.embedPng(dataUrl);
              const summaryPage = pdfDoc.addPage([595.28, 841.89]);
              summaryPage.drawImage(png, { x: 0, y: 0, width: 595.28, height: 841.89 });
            }
          }

          const exportedBytes = await pdfDoc.save();
          const blob = new Blob([exportedBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const baseName = (docMeta.filename || docMeta.title || 'document').replace(/\.pdf$/i, '');
          a.href = url;
          a.download = `${baseName}_筆記標註版.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('已匯出含所有標註與重點筆記的 PDF，可於任意閱讀器開啟');
        } catch (err) {
          showToast(`匯出失敗：${err.message}`);
        } finally {
          setIsExportingPdf(false);
        }
      };

      // =======================================================================
      // 1) 反白即翻：走免金鑰高速字典通道 (0 額度消耗、毫秒級秒回 + 本地快取)
      // =======================================================================
      const triggerQuickInstantTranslate = useCallback(async (selectedText) => {
        const cleanKey = selectedText.trim().slice(0, 350);
        if (!cleanKey) return;

        // 命中本機快取時 0 延遲直接顯示
        const cached = quickTransCacheRef.current[cleanKey];
        if (cached) {
          setSelectionPopover((prev) =>
            prev && prev.quote === selectedText
              ? { ...prev, quickLoading: false, quickResult: cached, quickError: '' }
              : prev
          );
          return;
        }

        const reqId = ++quickReqIdRef.current;
        setSelectionPopover((prev) =>
          prev ? { ...prev, quickLoading: true, quickResult: null, quickError: '' } : null
        );

        try {
          const resultObj = await fetchKeylessInstantDictionary(cleanKey);
          if (reqId !== quickReqIdRef.current) return;

          quickTransCacheRef.current[cleanKey] = resultObj;
          const keys = Object.keys(quickTransCacheRef.current);
          if (keys.length > 400) delete quickTransCacheRef.current[keys[0]];
          idbSetScopedKV(currentOwnerUid, 'quickTransCache', quickTransCacheRef.current);

          setSelectionPopover((prev) =>
            prev ? { ...prev, quickLoading: false, quickResult: resultObj } : null
          );
        } catch (err) {
          if (reqId !== quickReqIdRef.current) return;
          setSelectionPopover((prev) =>
            prev ? { ...prev, quickLoading: false, quickError: err.message || '直譯連線逾時' } : null
          );
        }
      }, [currentOwnerUid]);

      const openSelectionMenu = useCallback(({ quote, lineObj, lineIndex, clientX, clientY }) => {
        const cleaned = (quote || '').trim();
        if (!cleaned) return;
        setIsAutoPlaying(false);
        if (typeof lineIndex === 'number') setActiveLineIdx(lineIndex);

        const safeX = Math.min(window.innerWidth - 195, Math.max(195, clientX));
        const placeBelow = clientY < 240;
        const safeY = placeBelow
          ? Math.min(window.innerHeight - 80, clientY + 20)
          : Math.max(70, clientY - 12);

        const cached = quickTransCacheRef.current[cleaned.slice(0, 350)] || null;

        setSelectionPopover({
          quote: cleaned,
          lineId: lineObj?.id || '',
          pageNumber: lineObj?.pageNumber || currentPdfPage || 1,
          paragraphContext: lineObj?.paragraphContext || cleaned,
          x: safeX,
          y: safeY,
          placeBelow,
          quickLoading: settings.instantTranslate && !cached,
          quickResult: cached,
          quickError: '',
          deepLoading: false,
          deepResult: null,
          deepError: ''
        });

        if (settings.instantTranslate && !cached) {
          if (transDebounceRef.current) clearTimeout(transDebounceRef.current);
          transDebounceRef.current = setTimeout(() => {
            triggerQuickInstantTranslate(cleaned);
          }, 300);
        }
      }, [currentPdfPage, settings.instantTranslate, triggerQuickInstantTranslate]);

      const handleLineMouseUp = (e, lineObj, idx) => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        const sel = window.getSelection();
        const selectedStr = sel ? sel.toString().trim() : '';
        if (selectedStr.length >= 1) {
          const range = sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
          const rect = range ? range.getBoundingClientRect() : null;
          openSelectionMenu({
            quote: selectedStr,
            lineObj,
            lineIndex: idx,
            clientX: rect ? rect.left + rect.width / 2 : e.clientX,
            clientY: rect ? (rect.top < 240 ? rect.bottom : rect.top) : e.clientY
          });
        }
      };

      const handleLinePointerDown = (e, lineObj, idx) => {
        if (e.button && e.button !== 0) return;
        const { clientX, clientY } = e;
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);

        longPressTimerRef.current = setTimeout(() => {
          const existingSel = window.getSelection()?.toString().trim();
          if (existingSel) {
            openSelectionMenu({ quote: existingSel, lineObj, lineIndex: idx, clientX, clientY });
            return;
          }
          let targetQuote = lineObj.text;
          const caretRange = document.caretRangeFromPoint ? document.caretRangeFromPoint(clientX, clientY) : null;
          if (caretRange?.startContainer?.nodeType === Node.TEXT_NODE) {
            const nodeText = caretRange.startContainer.textContent || '';
            const offset = caretRange.startOffset || 0;
            const leftPart = nodeText.slice(0, offset).match(/[A-Za-z0-9'-]+$|[\u4e00-\u9fff]{1,4}$/);
            const rightPart = nodeText.slice(offset).match(/^[A-Za-z0-9'-]+|^[\u4e00-\u9fff]{1,4}/);
            const candidate = `${leftPart ? leftPart[0] : ''}${rightPart ? rightPart[0] : ''}`.trim();
            if (candidate.length >= 2) targetQuote = candidate;
          }
          openSelectionMenu({ quote: targetQuote, lineObj, lineIndex: idx, clientX, clientY });
        }, 420);
      };

      const cancelLongPress = () => {

      // =======================================================================
      // 2) 語境深譯：走您的個人 Gemini Key / OpenAI Key (嚴謹結合前後文脈絡)
      // =======================================================================
      const handleRunContextualTranslate = async () => {
        if (!selectionPopover || selectionPopover.deepLoading) return;

【文獻領域提示】：${docMeta.domainHint}
【所在段落完整前後文】：${selectionPopover.paragraphContext}
【選取的目標詞語或句子】：${selectionPopover.quote}

請根據這篇文章的專業學科脈絡（例如若為哲學文章請採用嚴謹哲學術語譯法，若為醫學/科學請採用精確學術譯法，絕不作單一死板直譯），連接上下文解釋其深層意涵。請回傳 JSON 格式：
{

            ? `【文獻標題】：${docMeta.title}（${docMeta.domainHint}）\n【選取處完整段落 (P.${currentQuote.pageNumber})】：${currentQuote.paragraphContext}\n【我選中的詞句】："${currentQuote.quote}"\n\n【我的問題】：${effectiveQuestion}`
            : `【文獻標題】：${docMeta.title}\n【目前閱讀段落】：${readingLines[activeLineIdx]?.paragraphContext || ''}\n\n【我的問題】：${effectiveQuestion}`;

          historyMsgs.push({ role: 'user', text: currentTurnPrompt });

          const { text, thought } = await callUnifiedAI({
            provider: aiProvider,
            geminiKey: geminiApiKey,
            openaiKey: openaiApiKey,
            model: modelObj.id,
            systemInstruction:
              '你是專為深度閱讀者與 ADHD 使用者設計的學術導讀助理。請緊扣文章前後文脈絡回答，結構清晰、重點明確，使用繁體中文。',
            messages: historyMsgs,
            thinkingLevelObj: levelObj,
            expectJson: false
          });

          setChatMessages((prev) => [
            ...prev,
            {
              id: `a-${Date.now()}`,
              role: 'assistant',
              model: modelObj.label.split('(')[0].trim(),
              thinkingLabel: levelObj.label,

              content: text || '已完成推理，但未收到回應文字。'

      // 儲存帳號空間與雙引擎金鑰

      const renderHighlightedLineText = (line) => {
        const lineHls = textHighlights.filter(
          (h) => h.quote && (h.lineId === line.id || (h.quote.length >= 3 && line.text.includes(h.quote)))
        );
        if (lineHls.length === 0) return line.text;

        const ranges = [];
        for (const hl of lineHls) {
          const start = line.text.indexOf(hl.quote);
          if (start !== -1) {
            const end = start + hl.quote.length;
            if (!ranges.some((r) => start < r.end && end > r.start)) {
              ranges.push({ start, end, colorId: hl.colorId });
            }
          }
        }
        if (ranges.length === 0) return line.text;
        ranges.sort((a, b) => a.start - b.start);

        const nodes = [];
        let cursor = 0;
        ranges.forEach((r, i) => {
          if (r.start > cursor) nodes.push(line.text.slice(cursor, r.start));
          const cObj = MARKER_COLORS.find((c) => c.id === r.colorId) || MARKER_COLORS[0];
          nodes.push(
            <mark
              key={i}
              style={{
                backgroundColor: currentTheme.isDark ? cObj.bgDark : cObj.bgLight,
                color: 'inherit',
                borderBottom: `2px solid ${cObj.hex}`
              }}
              className="rounded px-1 py-0.5"
            >
              {line.text.slice(r.start, r.end)}
            </mark>
          );
          cursor = r.end;
        });
        if (cursor < line.text.length) nodes.push(line.text.slice(cursor));
        return nodes;
      };

      const fontClass =
        settings.fontFamily === 'serif'

      // 若啟用本機密碼鎖則顯示解鎖畫面
      if (isLocked && pinCode) {

          <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: 'var(--bg-app)' }}>
            <div
              className="w-full max-w-sm rounded-2xl border p-6 shadow-xl space-y-4"
              style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
            >
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ backgroundColor: 'var(--accent-soft)', color: 'var(--accent-text)' }}>
                  <Icon name="lock" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base font-bold">個人閱讀空間已鎖定</h1>
                  <p className="text-xs" style={{ color: 'var(--text-muted)' }}>{currentAccountDisplay.name}</p>
                </div>
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (unlockInput === pinCode) {

                className="space-y-3"
              >

      return (

        >
          {/* 隱藏的多檔 PDF 選取器 */}
          <input
            ref={fileInputRef}
            type="file"
            accept="application/pdf,.pdf"
            multiple
            className="hidden"
            onChange={(e) => handleImportPdfFiles(e.target.files)}
          />

          {/* 頂部導覽列 */}
          <header
            style={{ backgroundColor: 'var(--bg-header)', borderColor: 'var(--border-color)' }}
            className="h-14 px-4 flex items-center justify-between gap-3 border-b shrink-0 z-30 relative backdrop-blur-md"
          >
            {/* 左區：書庫管理 + 匯入 PDF */}
            <div className="flex items-center gap-3 min-w-0">
              <div className="relative min-w-0 shrink">
                <button
                  onClick={() => {
                    setShowLibraryMenu((v) => !v);
                    setShowSettingsPanel(false);
                  }}
                  style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                  className="flex items-center gap-2 h-9 px-3 rounded-xl border shrink min-w-0 w-[150px] sm:w-[220px] transition hover:opacity-90"

                </button>

                {showLibraryMenu && (
                  <div
                    style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                    className="absolute left-0 top-11 w-[320px] sm:w-[395px] rounded-2xl border p-4 shadow-2xl z-50"
                  >
                    <div className="flex items-center justify-between gap-2 pb-3 mb-3 border-b" style={{ borderColor: 'var(--border-color)' }}>
                      <div className="min-w-0">
                        <h3 className="text-xs font-bold truncate">已保留書庫 ({libraryDocs.length})</h3>

                          空間：{currentAccountDisplay.name}

                      </div>
                      <button
                        onClick={() => fileInputRef.current?.click()}

            >
              {/* 反白即翻區塊 (免金鑰公開字典極速直譯) */}
              {settings.instantTranslate && (
                <div
                  style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                  className="rounded-xl border px-3 py-2 text-xs"
                >
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-[10px] font-bold flex items-center gap-1" style={{ color: 'var(--warn)' }}>
                      <Icon name="zap" className="w-3 h-3" />
                      <span>反白即翻（免金鑰快速字典）</span>
                    </span>
                    <button onClick={() => setSelectionPopover(null)} className="opacity-60 hover:opacity-100">
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                  {selectionPopover.quickLoading ? (
                    <p className="py-0.5 text-[11px]" style={{ color: 'var(--text-muted)' }}>字典查詢中...</p>
                  ) : selectionPopover.quickError ? (
                    <p className="text-[11px]" style={{ color: 'var(--warn)' }}>
                      {selectionPopover.quickError}
                    </p>
                  ) : selectionPopover.quickResult ? (
                    <div>
                      <p className="font-semibold text-sm leading-snug">{selectionPopover.quickResult.translation}</p>
                      {selectionPopover.quickResult.posOrNote && (
                        <p className="text-[11px] mt-1 leading-relaxed" style={{ color: 'var(--text-muted)' }}>
                          {selectionPopover.quickResult.posOrNote}
                        </p>
                      )}
                    </div>
                  ) : null}
                </div>
              )}

              {/* 操作列：莫蘭迪 4 色重點 + 語境深譯 (Gemini) + 問問 AI (側欄) */}
              <div className="flex items-center justify-between gap-1.5 flex-wrap">
                <div className="flex items-center gap-1.5">
                  {MARKER_COLORS.map((c) => (
                    <button
                      key={c.id}
                      onClick={() => handleAddHighlight(c.id)}
                      style={{ backgroundColor: c.hex }}
                      className="w-5 h-5 rounded-full border border-black/20 hover:scale-110 transition"
                      title={`以${c.name}畫重點`}
                    />
                  ))}
                </div>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={handleRunContextualTranslate}
                    disabled={selectionPopover.deepLoading}
                    style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)', color: 'var(--accent-text)' }}
                    className="h-8 px-2.5 rounded-xl border text-xs font-semibold flex items-center gap-1 transition"
                  >
                    <Icon name="languages" className="w-3.5 h-3.5" />
                    <span>{selectionPopover.deepLoading ? '深譯中...' : '語境深譯'}</span>
                  </button>

                  <button
                    onClick={handleAskAiFromSelection}
                    style={{ backgroundColor: 'var(--accent)' }}
                    className="h-8 px-2.5 rounded-xl text-white text-xs font-semibold flex items-center gap-1 transition"
                  >
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>問問 AI</span>
                  </button>

                  {!settings.instantTranslate && (
                    <button onClick={() => setSelectionPopover(null)} className="p-1.5 rounded-lg opacity-70 hover:opacity-100">
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>
              </div>

              {/* 語境深譯結果框 */}
              {selectionPopover.deepError && (
                <p className="text-xs" style={{ color: 'var(--danger)' }}>{selectionPopover.deepError}</p>
              )}
              {selectionPopover.deepResult && (
                <div
                  style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)' }}
                  className="rounded-xl border p-3 text-xs space-y-2 max-h-60 overflow-y-auto"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded" style={{ backgroundColor: 'var(--bg-subtle)' }}>
                      {selectionPopover.deepResult.detectedGenre}
                    </span>
                    <button onClick={() => handleAddHighlight('ochre')} className="text-[11px] underline font-medium">
                      + 存為重點筆記
                    </button>
                  </div>
                  <p className="font-bold text-sm leading-relaxed">{selectionPopover.deepResult.rigorousTranslation}</p>
                  <p className="leading-relaxed opacity-90">
                    <span className="font-semibold">前後文脈絡解析：</span>
                    {selectionPopover.deepResult.contextualNuance}
                  </p>
                  {selectionPopover.deepResult.keyTerms?.length > 0 && (
                    <div className="pt-1.5 border-t space-y-1" style={{ borderColor: 'var(--border-color)' }}>
                      {selectionPopover.deepResult.keyTerms.map((kt, i) => (
                        <div key={i} className="text-[11px]">
                          <span className="font-semibold">{kt.term}：</span>
                          <span className="opacity-85">{kt.meaningInContext}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* 帳號與 AI 連線設定視窗 */}
          {showAccountModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)' }}
                className="w-full max-w-lg rounded-2xl border p-5 shadow-2xl space-y-4 max-h-[88vh] overflow-y-auto"
              >
                <div className="flex items-center justify-between border-b pb-3" style={{ borderColor: 'var(--border-color)' }}>
                  <div>
                    <h2 className="text-sm font-bold">個人獨立空間與 Google Gemini / ChatGPT 連線設定</h2>
                    <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      「反白即翻」已內建免費高速字典；此處設定的金鑰僅用於「語境深譯」、「AI 側欄」與「圖片 OCR」
                    </p>
                  </div>
                  <button onClick={() => setShowAccountModal(false)} className="p-1 opacity-70 hover:opacity-100">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div
                  style={{ backgroundColor: 'var(--accent-soft)', borderColor: 'var(--accent)' }}
                  className="rounded-xl border p-3 text-xs flex items-start gap-2.5"
                >
                  <span className="mt-0.5 shrink-0"><Icon name="shield" className="w-4 h-4" /></span>
                  <div className="leading-relaxed">
                    <strong>100% 獨立隱私保護：</strong>您匯入的 PDF、標註與金鑰皆儲存在您個人瀏覽器的 IndexedDB 中，絕不會上傳至 GitHub 公開伺服器，其他人打開網址時完全看不到您的任何檔案與筆記。
                  </div>
                </div>

                <div className="space-y-2.5">
                  <label className="text-xs font-semibold block">選擇深度語境翻譯與側欄問答的 AI 引擎</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setAiProvider('gemini')}
                      style={{
                        backgroundColor: aiProvider === 'gemini' ? 'var(--accent)' : 'var(--bg-subtle)',
                        color: aiProvider === 'gemini' ? '#fff' : 'var(--text-main)',
                        borderColor: aiProvider === 'gemini' ? 'var(--accent)' : 'var(--border-color)'
                      }}
                      className="py-2.5 px-3 rounded-xl border text-xs font-semibold transition"
                    >
                      Google Gemini 3.8
                    </button>
                    <button
                      type="button"
                      onClick={() => setAiProvider('openai')}
                      style={{
                        backgroundColor: aiProvider === 'openai' ? 'var(--accent)' : 'var(--bg-subtle)',
                        color: aiProvider === 'openai' ? '#fff' : 'var(--text-main)',
                        borderColor: aiProvider === 'openai' ? 'var(--accent)' : 'var(--border-color)'
                      }}
                      className="py-2.5 px-3 rounded-xl border text-xs font-semibold transition"
                    >
                      OpenAI ChatGPT (GPT-4o / o3)
                    </button>
                  </div>

                  {aiProvider === 'gemini' ? (
                    <div className="space-y-1.5 pt-1">
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs font-medium">個人 Google Gemini API Key</span>
                        <a
                          href="https://aistudio.google.com/apikey"
                          target="_blank"
                          rel="noreferrer"
                          style={{ color: 'var(--accent-text)' }}
                          className="text-[11px] underline flex items-center gap-1"
                        >
                          <span>前往 Google AI Studio 取得金鑰</span>
                          <Icon name="external" className="w-3 h-3" />
                        </a>
                      </div>
                      <input
                        type="password"
                        value={geminiKeyDraft}
                        onChange={(e) => setGeminiKeyDraft(e.target.value)}
                        placeholder="貼上 AIzaSy... 開頭的個人金鑰"
                        style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                        className="w-full px-3 py-2 rounded-xl border text-xs outline-none"
                      />
                    </div>
                  ) : (
                    <div className="space-y-1.5 pt-1">
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs font-medium">個人 OpenAI (ChatGPT) API Key</span>
                        <a
                          href="https://platform.openai.com/api-keys"
                          target="_blank"
                          rel="noreferrer"
                          style={{ color: 'var(--accent-text)' }}
                          className="text-[11px] underline flex items-center gap-1"
                        >
                          <span>登入 OpenAI 帳號取得金鑰</span>
                          <Icon name="external" className="w-3 h-3" />
                        </a>
                      </div>
                      <input
                        type="password"
                        value={openaiKeyDraft}
                        onChange={(e) => setOpenaiKeyDraft(e.target.value)}
                        placeholder="貼上 sk-... 開頭的個人 OpenAI 金鑰"
                        style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                        className="w-full px-3 py-2 rounded-xl border text-xs outline-none"
                      />
                    </div>
                  )}
                </div>

                {/* 同裝置多帳號獨立書庫切換 */}
                <div
                  style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)' }}
                  className="rounded-xl border p-3.5 space-y-2.5 text-xs"
                >
                  <div className="flex items-center justify-between gap-2">
                    <div>
                      <div className="font-bold">目前書庫空間：{currentAccountDisplay.name}</div>
                      <div className="text-[11px]" style={{ color: 'var(--text-muted)' }}>{currentAccountDisplay.email}</div>
                    </div>
                    {currentAccountDisplay.isCustom && (
                      <button
                        type="button"
                        onClick={handleLogoutWorkspace}
                        style={{ borderColor: 'var(--border-color)' }}
                        className="h-8 px-2.5 rounded-lg border flex items-center gap-1 text-[11px]"
                      >
                        <Icon name="logout" className="w-3.5 h-3.5" />
                        <span>切回預設</span>
                      </button>
                    )}
                  </div>

                  <form onSubmit={handleSwitchAccountWorkspace} className="flex gap-2 pt-1">
                    <input
                      type="text"
                      value={switchEmailDraft}
                      onChange={(e) => setSwitchEmailDraft(e.target.value)}
                      placeholder="輸入 Email 或暱稱切換同裝置獨立書庫..."
                      style={{ backgroundColor: 'var(--bg-panel)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                      className="flex-1 px-3 py-1.5 rounded-lg border text-xs outline-none"
                    />
                    <button
                      type="submit"
                      style={{ backgroundColor: 'var(--accent)' }}
                      className="px-3 py-1.5 rounded-lg text-white font-medium whitespace-nowrap"
                    >
                      切換空間
                    </button>
                  </form>

                  {googleClientId && <div ref={googleBtnContainerRef} className="pt-1" />}
                </div>

                {/* 選填本機 PIN 碼鎖 */}
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold flex items-center gap-1.5">
                    <Icon name="lock" className="w-3.5 h-3.5" />
                    <span>個人空間密碼鎖（選填）</span>
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="password"
                      value={pinDraft}
                      onChange={(e) => setPinDraft(e.target.value)}
                      placeholder="留空不設密碼；填寫可為此書庫加上螢幕鎖"
                      style={{ backgroundColor: 'var(--bg-subtle)', borderColor: 'var(--border-color)', color: 'var(--text-main)' }}
                      className="flex-1 px-3 py-2 rounded-xl border text-xs outline-none"
                    />
                    {pinCode && (
                      <button
                        type="button"
                        onClick={() => {
                          setShowAccountModal(false);
                          setIsLocked(true);
                        }}
                        style={{ borderColor: 'var(--border-color)' }}
                        className="px-3 py-2 rounded-xl border text-xs whitespace-nowrap"
                      >
                        立即鎖定
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t" style={{ borderColor: 'var(--border-color)' }}>
                  <button
                    type="button"
                    onClick={() => setShowAccountModal(false)}
                    className="px-3.5 py-2 rounded-xl text-xs opacity-75 hover:opacity-100"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={handleSaveAccountAndKeys}
                    style={{ backgroundColor: 'var(--accent)' }}
                    className="px-4 py-2 rounded-xl text-white text-xs font-semibold"
                  >
                    儲存連線設定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 頂部柔和通知橫幅 */}
          {toastMsg && (
            <div
              style={{ backgroundColor: 'var(--accent)' }}
              className="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-white text-xs font-medium shadow-lg pointer-events-none"
            >
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
